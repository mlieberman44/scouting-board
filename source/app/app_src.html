<meta charset="utf-8">
<title>League 99907173 Scouting Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: app shell. Sticky top bar (brand, search, build), section tabs on desktop and a bottom bar on phones, one view at a time, a side sheet for player profiles and comparisons. */
:root{
  --bg:#eef1f4; --panel:#ffffff; --raise:#f6f8fa; --ink:#15202b; --muted:#5b6876; --line:#d5dbe2; --soft:#e4e9ee;
  --accent:#c2410c; --accent-ink:#ffffff; --accent-soft:#fbe6da; --me:#fff3e8;
  --pos-1:#d7efe6; --pos-2:#a5dcc7; --pos-3:#5fbf9c; --pos-ink:#0d3d2e; --pos-fg:#0f7a55;
  --neg-1:#f8e1e1; --neg-2:#efb4b4; --neg-3:#dc7676; --neg-ink:#4a1111; --neg-fg:#b42323;
  --warn:#b45309; --scrim:rgba(12,18,24,.5); --shadow:0 12px 32px rgba(12,18,24,.18);
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10161c; --panel:#18212a; --raise:#1d2731; --ink:#e6ebf0; --muted:#98a6b4; --line:#2b3743; --soft:#222d38;
  --accent:#fb923c; --accent-ink:#1a0d03; --accent-soft:#3a2416; --me:#2a2016;
  --pos-1:#15352b; --pos-2:#1d5a45; --pos-3:#2a8a68; --pos-ink:#e3fff4; --pos-fg:#5fd3a5;
  --neg-1:#3a1d1f; --neg-2:#6b2a2d; --neg-3:#9c3a3e; --neg-ink:#ffeaea; --neg-fg:#f28b8b;
  --warn:#fbbf24; --scrim:rgba(0,0,0,.62); --shadow:0 12px 32px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10161c; --panel:#18212a; --raise:#1d2731; --ink:#e6ebf0; --muted:#98a6b4; --line:#2b3743; --soft:#222d38;
  --accent:#fb923c; --accent-ink:#1a0d03; --accent-soft:#3a2416; --me:#2a2016;
  --pos-1:#15352b; --pos-2:#1d5a45; --pos-3:#2a8a68; --pos-ink:#e3fff4; --pos-fg:#5fd3a5;
  --neg-1:#3a1d1f; --neg-2:#6b2a2d; --neg-3:#9c3a3e; --neg-ink:#ffeaea; --neg-fg:#f28b8b;
  --warn:#fbbf24; --scrim:rgba(0,0,0,.62); --shadow:0 12px 32px rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--body);margin:0}
button{font:inherit;color:inherit}
h1,h2,h3{text-wrap:balance}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--panel);border-bottom:1px solid var(--line)}
.bar-in{max-width:1280px;margin:0 auto;padding-inline:16px;padding-block:10px;display:flex;align-items:center;gap:10px}
.brand{display:flex;flex-direction:column;align-items:flex-start;gap:3px;background:none;border:0;padding:0;cursor:pointer;min-width:0;text-align:left;flex:0 1 auto}
.brand b{font:700 1.45rem/1 var(--display);text-transform:uppercase;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.brand b i{font-style:normal;color:var(--accent)}
.brand small{color:var(--muted);font-size:.74rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:52ch}
.search{position:relative;flex:1 1 240px;max-width:440px;margin-left:auto;display:flex;align-items:center}
.search svg.i{position:absolute;left:10px;width:16px;height:16px;color:var(--muted);pointer-events:none}
#sq{width:100%;font:inherit;background:var(--raise);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px 8px 32px}
.results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:6px;display:flex;flex-direction:column;gap:2px;max-height:min(60vh,440px);overflow-y:auto;z-index:36}
.res{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;text-align:left;background:none;border:0;border-radius:6px;padding:7px 10px;cursor:pointer}
.res:hover,.res[aria-selected="true"]{background:var(--soft)}
.res small{color:var(--muted);font-size:.75rem;display:block}
.res em{font:600 .8rem var(--mono);font-style:normal;color:var(--accent)}
.res-h{font:600 .68rem var(--body);text-transform:uppercase;letter-spacing:.09em;color:var(--muted);padding:6px 10px 2px}
.iconbtn{display:inline-grid;place-items:center;width:38px;height:38px;border:1px solid var(--line);background:var(--raise);border-radius:8px;cursor:pointer;flex:none;color:var(--ink)}
.buildbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--raise);border-radius:8px;padding:8px 10px;cursor:pointer;font:600 .8rem var(--body);white-space:nowrap;flex:none}
.buildbtn svg.i{width:16px;height:16px}
.buildbtn[data-on="true"]{border-color:var(--accent);color:var(--accent)}
.only-m{display:none!important}
.ldot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-left:6px;vertical-align:middle}
nav.tabs{max-width:1280px;margin:0 auto;padding-inline:16px;display:flex;gap:2px;overflow-x:auto}
nav.tabs button{font:600 1.02rem var(--display);text-transform:uppercase;letter-spacing:.05em;background:none;border:0;color:var(--muted);padding:6px 14px 9px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs button:hover{color:var(--ink)}
.buildpop{position:absolute;right:max(16px,calc((100% - 1280px)/2 + 16px));top:calc(100% + 6px);width:min(440px,calc(100% - 32px));background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:10px;z-index:36}
/* sign-in: each manager opens the board as their own team */
.signin #tabs,.signin #bottom,.signin #searchbox,.signin #search-toggle,.signin #buildbtn,.signin #acctbtn{display:none!important}
.signin #brand{pointer-events:none}
.acctbtn{font:600 .72rem var(--mono);letter-spacing:.02em;width:auto;min-width:38px;padding:0 8px}
.acctbtn[hidden]{display:none!important}
@media (max-width:420px){.bar-in{gap:8px}.acctbtn{min-width:34px;padding:0 6px}}
.login{max-width:560px;margin:24px auto 0}
.login h1{font:700 2rem/1.05 var(--display);text-transform:uppercase;letter-spacing:.01em;margin:0}
.login .lead{margin:0;color:var(--muted)}
.login-teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:8px}
.login-team{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;font:inherit;color:inherit;background:var(--raise);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;min-width:0}
.login-team:hover,.login-team:focus-visible{border-color:var(--accent)}
.login-team b{font-weight:600;overflow-wrap:anywhere}
.login-team small{color:var(--muted)}
.login-form{display:flex;flex-direction:column;gap:10px}
.login-form label{font:600 .72rem var(--body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.login-row{display:flex;gap:8px;flex-wrap:wrap}
.login-row input{flex:1 1 12ch;min-width:0;font:500 1.05rem var(--mono);letter-spacing:.08em;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--raise);color:var(--ink)}
.login-row input:focus{outline:2px solid var(--accent);outline-offset:1px}
.login-row .btn{padding:9px 16px;font-size:.9rem}
.login-err{margin:0;color:var(--neg-fg);font-weight:500}
.login-who{margin:0;font-size:1.05rem}
.login .note{margin:0}
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;display:none;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.bottom button{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px 7px;font:600 .66rem var(--body);letter-spacing:.02em;color:var(--muted);background:none;border:0;cursor:pointer}
nav.bottom svg.i{width:22px;height:22px}
nav.bottom button[aria-current="page"]{color:var(--accent)}
main{max-width:1280px;margin:0 auto;padding-inline:16px;padding-block:16px 56px;display:flex;flex-direction:column;gap:16px}

/* building blocks */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.ph{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:8px 16px}
.ph>div{min-width:0;display:flex;flex-direction:column;gap:4px}
.ph-act{flex-direction:row!important;flex-wrap:wrap;gap:8px!important;align-items:center}
h2{font:600 1.4rem/1.05 var(--display);text-transform:uppercase;letter-spacing:.03em;margin:0}
h3{font:600 1.08rem/1.1 var(--display);text-transform:uppercase;letter-spacing:.05em;margin:0}
.note{color:var(--muted);font-size:.83rem;margin:0;max-width:80ch}
.lbl{font:600 .7rem var(--body);text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.eyebrow{font:600 .72rem var(--body);text-transform:uppercase;letter-spacing:.1em;color:var(--accent)}
.btn{display:inline-flex;align-items:center;gap:6px;font:600 .82rem var(--body);background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent);border-radius:8px;padding:7px 12px;cursor:pointer;white-space:nowrap}
.btn.ghost{background:var(--panel);color:var(--accent)}
.btn.sm{padding:4px 10px;font-size:.78rem}
.btn svg.i{width:15px;height:15px}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font:600 .82rem var(--body);cursor:pointer}
.tlink,.plink{background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;text-align:left}
.tlink:hover,.plink:hover{color:var(--accent);text-decoration:underline}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,[tabindex]:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow-x:auto;max-width:100%;flex:none}
.seg button{font:500 .8rem var(--body);background:var(--panel);color:var(--ink);border:0;padding:6px 11px;cursor:pointer;white-space:nowrap}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:600 .82rem var(--display);letter-spacing:.04em;border:1px solid var(--line);background:var(--soft);color:var(--ink);border-radius:999px;padding:4px 11px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);text-decoration:line-through}
.chip small{opacity:.75;font-weight:500}
.tchip[data-on="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);text-decoration:none}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select,input[type=search],textarea{font:inherit;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:6px 8px;max-width:100%}
input[type=search].grow{width:16em}
textarea{width:100%;min-height:9em;font:.8rem/1.45 var(--mono);resize:vertical}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:16px;align-items:start}

/* tables */
.scroll{overflow-x:auto;min-width:0}
.scroll.tall{max-height:600px;overflow-y:auto}
table{border-collapse:separate;border-spacing:0;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:7px 9px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--soft)}
th{font:600 .7rem var(--body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--panel);position:sticky;top:0;z-index:2}
th[data-sort]{cursor:pointer;user-select:none}
th[data-sort]:hover{color:var(--ink)}
th[data-dir="desc"]::after{content:" ▼";color:var(--accent)}
th[data-dir="asc"]::after{content:" ▲";color:var(--accent)}
th.l,td.l{text-align:left}
.stick{position:sticky;left:0;z-index:1;background:var(--panel)}
th.stick{z-index:3}
tr.me td{background:var(--me)}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--soft)}
tr.sel td{box-shadow:inset 0 2px 0 var(--accent),inset 0 -2px 0 var(--accent)}
tr.click:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
td.num{font-family:var(--mono);font-size:.82rem}
td.warnc,.warnc{color:var(--warn)}
td.up{color:var(--pos-fg)}td.down{color:var(--neg-fg)}
.punted{opacity:.35}
tr.punted td{opacity:.4}
.rkc,.cs,.gc{background:var(--soft)}
.z{font-family:var(--mono);font-size:.8rem;text-align:center}
.p1{background:var(--pos-1);color:var(--pos-ink)}.p2{background:var(--pos-2);color:var(--pos-ink)}.p3{background:var(--pos-3);color:var(--pos-ink)}
.n1{background:var(--neg-1);color:var(--neg-ink)}.n2{background:var(--neg-2);color:var(--neg-ink)}.n3{background:var(--neg-3);color:var(--neg-ink)}
.rk{display:block;font-size:.66rem;opacity:.75}
.pname{min-width:11em}
.pname .row{display:flex;align-items:center;gap:6px}
.pname b{font-weight:600}
.pname small{display:block;color:var(--muted);font-size:.74rem;font-weight:400}
.pname input{accent-color:var(--accent);margin:0}
.tname{font-weight:600}
.tname small{display:block;color:var(--muted);font-weight:400;font-size:.75rem}
td.past{opacity:.55}
td small.sit{display:block;font-size:.66rem;color:var(--warn)}
.hm td{padding:6px 7px;text-align:center;font-family:var(--mono);font-size:.78rem}

/* pills, grades, bars */
.pill{display:inline-block;font:600 .67rem var(--body);letter-spacing:.05em;padding:2px 7px;border-radius:999px;margin-left:6px;vertical-align:1px;background:var(--soft);color:var(--ink);white-space:nowrap}
.pill.dtd{background:var(--neg-1);color:var(--neg-ink)}.pill.out{background:var(--neg-3);color:var(--neg-ink)}.pill.est{background:var(--soft);color:var(--warn);border:1px solid var(--line)}
.pill.live{background:var(--accent);color:var(--accent-ink)}.pill.p3{background:var(--pos-3);color:var(--pos-ink)}.pill.p2{background:var(--pos-2);color:var(--pos-ink)}.pill.p1{background:var(--pos-1);color:var(--pos-ink)}
.pill.n1{background:var(--neg-1);color:var(--neg-ink)}.pill.n2{background:var(--neg-2);color:var(--neg-ink)}.pill.n3{background:var(--neg-3);color:var(--neg-ink)}
.pill.star{background:var(--accent-soft);color:var(--accent)}
.grade{font:700 1.15rem/1 var(--display);display:inline-grid;place-items:center;min-width:2.2em;border-radius:6px;padding:3px 6px;background:var(--soft)}
.g-A{background:var(--pos-3);color:var(--pos-ink)}.g-Bp{background:var(--pos-2);color:var(--pos-ink)}.g-B{background:var(--pos-1);color:var(--pos-ink)}.g-Cp{background:var(--neg-1);color:var(--neg-ink)}.g-C{background:var(--neg-2);color:var(--neg-ink)}
.wp{position:relative;height:18px;background:var(--neg-1);border-radius:4px;overflow:hidden;min-width:120px}
.wp span{position:absolute;left:0;top:0;bottom:0;background:var(--pos-3)}
.wp em{position:absolute;left:6px;top:0;font:500 .74rem/18px var(--mono);font-style:normal;color:var(--pos-ink);white-space:nowrap}
.tvbar{position:relative;height:16px;background:var(--soft);border-radius:4px;min-width:110px;overflow:hidden}
.tvbar span{position:absolute;left:0;top:0;bottom:0;background:var(--accent);opacity:.85}
.tvbar em{position:absolute;left:6px;top:0;font:600 .74rem/16px var(--mono);font-style:normal;color:var(--ink)}
.tvbar.big{height:10px;min-width:0}
.tvnum{font:700 1rem var(--display);color:var(--accent);font-style:normal}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:16px;align-items:end;padding-block:4px}
.hero h1{font:700 clamp(2rem,4.6vw,3.1rem)/.95 var(--display);text-transform:uppercase;letter-spacing:.01em;margin:6px 0 10px}
.hero-meta{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;color:var(--muted)}
.hero-meta b{color:var(--ink)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.kpi{border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:3px;background:var(--panel);min-width:0}
.kpi span{color:var(--muted);font-size:.78rem}
.kpi b{font:700 1.9rem/1.05 var(--display);font-variant-numeric:tabular-nums}
.kpi small{color:var(--muted);font-size:.76rem}
.todo{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.todo li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.todo .dot{width:10px;height:10px;border-radius:50%;background:var(--muted)}
.todo .warn .dot{background:var(--neg-3)}.todo .move .dot{background:var(--pos-3)}.todo .info .dot{background:var(--accent)}
.todo b{display:block;font-weight:600}
.todo p{margin:2px 0 0;color:var(--muted);font-size:.83rem}
.rkstrip,.catstrip{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:6px}
.rkc,.cs{border-radius:8px;padding:8px 4px;text-align:center;display:flex;flex-direction:column;gap:2px;min-width:0}
.rkc span,.cs b{font:600 .74rem var(--body);letter-spacing:.05em}
.rkc b{font:700 1.3rem/1 var(--display)}
.cs span{font:700 1.15rem/1 var(--display)}
.cs small{font-size:.66rem;opacity:.8}
.weeks{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.wk{display:flex;flex-direction:column;gap:6px;text-align:left;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--panel);cursor:pointer;min-width:0}
.wk:hover{background:var(--soft)}
.wk b{font:600 1.05rem/1.15 var(--display);text-transform:uppercase;letter-spacing:.02em}
.wk small{color:var(--muted);font-size:.74rem}

/* matchup */
.vs{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:12px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:14px}
.vs-side{display:flex;flex-direction:column;gap:2px;min-width:0}.vs-side b{font:700 1.4rem/1.1 var(--display);text-transform:uppercase}.vs-side.r{text-align:right}
.vs-score{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}.vs-score b{font:700 2.5rem/1 var(--display);font-variant-numeric:tabular-nums}.vs-score i{font-style:normal;color:var(--muted);padding:0 4px}.vs-score>span{font-size:.75rem;color:var(--muted)}
.vs-score .pill{font-size:.8rem;margin:0}
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.league td.strong{font-weight:700}

/* league */
.pr-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.pr-list .tier{margin-top:6px}
.pr{display:grid;grid-template-columns:2.4rem minmax(0,1fr) auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
.pr:hover{background:var(--soft)}.pr.me{background:var(--me)}
.pr-rank{font:700 2rem/1 var(--display);color:var(--accent);text-align:center}
.pr-main{min-width:0;display:flex;flex-direction:column;gap:4px}
.pr-head{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pr-bar{position:relative;height:6px;background:var(--soft);border-radius:3px;max-width:420px}
.pr-bar span{position:absolute;top:0;bottom:0;border-radius:3px}.pr-bar .up{background:var(--pos-3)}.pr-bar .down{background:var(--neg-3)}
.pr-bar::after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--muted)}
.pr-blurb{margin:0;color:var(--muted);font-size:.84rem;max-width:82ch}
.pr-num{text-align:right;display:flex;flex-direction:column;gap:2px}.pr-num b{font:700 1.3rem var(--display);font-variant-numeric:tabular-nums}.pr-num span{font-size:.72rem;color:var(--muted)}
.mx td{text-align:center;font-family:var(--mono);font-size:.8rem}

<script>
const DATA = /*DATA*/null;

/* ---------- sign-in: each manager opens the board as their own team ----------
   DATA.auth maps team id -> sha256("sb99907173:<id>:<code>"); the codes themselves never ship in the page.
   A personal link (?team=<id>&code=<code>) signs in and is then stripped from the address bar; the plain link shows the sign-in page.
   The choice is remembered on this device (localStorage sb.session) until Sign out. No auth data in the build = the old single-team board. */
const sha256=(()=>{const P=[];for(let c=2;P.length<64;c++)if(P.every(p=>c%p))P.push(c);
  const K=P.map(p=>Math.floor((Math.cbrt(p)%1)*4294967296)|0),H0=P.slice(0,8).map(p=>Math.floor((Math.sqrt(p)%1)*4294967296)|0),r=(x,k)=>x>>>k|x<<(32-k);
  return str=>{const b=new TextEncoder().encode(str),l=b.length,n=((l+72)>>6)<<4,w=new Int32Array(n),W=new Int32Array(64);let H=H0.slice();
    for(let i=0;i<l;i++)w[i>>2]|=b[i]<<(24-(i&3)*8);w[l>>2]|=0x80<<(24-(l&3)*8);w[n-1]=l*8;
    for(let j=0;j<n;j+=16){for(let t=0;t<64;t++){if(t<16)W[t]=w[j+t];else{const a=W[t-15],c=W[t-2];W[t]=(W[t-16]+(r(a,7)^r(a,18)^a>>>3)+W[t-7]+(r(c,17)^r(c,19)^c>>>10))|0}}
      let [a,b2,c,d,e,f,g,h]=H;
      for(let t=0;t<64;t++){const t1=(h+(r(e,6)^r(e,11)^r(e,25))+((e&f)^(~e&g))+K[t]+W[t])|0,t2=((r(a,2)^r(a,13)^r(a,22))+((a&b2)^(a&c)^(b2&c)))|0;h=g;g=f;f=e;e=(d+t1)|0;d=c;c=b2;b2=a;a=(t1+t2)|0}
      H=[a,b2,c,d,e,f,g,h].map((x,i)=>(x+H[i])|0)}
    return H.map(x=>(x>>>0).toString(16).padStart(8,'0')).join('')}})();
const AUTH=DATA.auth&&Object.keys(DATA.auth).length?DATA.auth:null;
const codeHash=(id,code)=>sha256('sb99907173:'+id+':'+String(code||'').trim().toLowerCase().replace(/[\s-]/g,''));
const urlQ=(()=>{try{return new URLSearchParams(location.search)}catch(e){return new URLSearchParams()}})();

  const qt=+urlQ.get('team'),qc=urlQ.get('code');

const store={key:k=>k==='ros'||ME==null?'sb.'+k:'sb.t'+ME+'.'+k,

function fairness(e){const big=Math.max(e.tvIn,e.tvOut,1),gap=e.tvIn-e.tvOut,p=gap/big;return Math.abs(p)<=.15||Math.abs(gap)<=6?['Fair deal','p3']:p>0?['Team A wins the value','p1']:['Team B wins the value','n1']}
function balancers(aId,bId,e){if(isFair(e.tvIn,e.tvOut))return [];

  return M.players.filter(p=>p.team===id&&!sel.includes(p.name)).map(p=>{const e2=side==='give'?evalDeal(aId,bId,[...S.give,p.name],S.get):evalDeal(aId,bId,S.give,[...S.get,p.name]);

/* ---------- extension points: stat drill-downs, the stats lab, search commands ----------

// memo(key,fn): computed once per model state (recompute() bumps GEN when punts, value mode or rankings change)
let GEN=0;const MEMO=new Map();
function memo(k,f){const key=GEN+'|'+k;if(!MEMO.has(key)){if(MEMO.size>500)MEMO.clear();MEMO.set(key,f())}return MEMO.get(key)}
const sx=d=>`data-stat="${esc(d)}"`;
// modules add their own layout CSS once (theme tokens only): addCSS('mymod-css', '.x{...}')
const addCSS=(id,css)=>{if(document.getElementById(id))return;const el=document.createElement('style');el.id=id;el.textContent=css;document.head.appendChild(el)};
const sbtn=(d,html,cls='')=>`<button type="button" class="sx ${cls}" data-stat="${esc(d)}">${html}</button>`;
// wiring helpers: a drill cell that is also a tab stop (small tables), a category control for sortable headers,
// and category headers that open the league-wide category drill (sortable when a view is given)
const sxk=d=>`${sx(d)} tabindex="0"`;
const lcBtn=c=>`<button type="button" class="thx" data-stat="${esc('lc|'+c.k)}" aria-label="${esc(c.n)} across the league" data-tip="${esc(c.n)} across the league">${icon('stats')}</button>`;
const lcHeads=(view,prefix='',extra)=>CATS.map(c=>{const cls=(S.punt.has(c.k)?'punted ':'')+(extra?extra(c):'');return view?th(view,prefix+c.k,c.l+lcBtn(c),cls.trim()):`<th scope="col" class="${cls.trim()}">${sbtn('lc|'+c.k,c.l)}</th>`}).join('');
const catOf=k=>CATS.find(c=>c.k===k);
// a category's per-game value from a stat line (null when the line has no attempts for a percentage)
const catV=(ln,c)=>!ln?null:c.pct?(ln[c.pct[1]]?ln[c.pct[0]]/ln[c.pct[1]]:null):ln[c.k];
const fmtC=(c,v,dp)=>v==null||!isFinite(v)?'–':c.pct?f3(v):v.toFixed(dp??1);
const better=(c,a,b)=>c.neg?a<b:a>b;
// share of the values that v beats (ties count half); for "lower is better" categories pass neg
const pctl=(arr,v,neg)=>{const n=arr.length;if(!n||v==null)return null;let lo=0,eq=0;arr.forEach(x=>{if(x===v)eq++;else if(neg?x>v:x<v)lo++});return (lo+Math.max(0,eq-1)/2)/Math.max(1,n-1)};
const rankIn=(arr,v,neg)=>1+arr.filter(x=>neg?x<v:x>v).length;
const ord=n=>{const v=n%100;return n+(v>=11&&v<=13?'th':({1:'st',2:'nd',3:'rd'}[n%10]||'th'))};

function sheetStat(desc){const parts=String(desc).split('|'),type=parts[0],fn=DRILL[type];let r=null;

/* ---------- tooltip for chart marks and dense cells: any element with data-tip ---------- */
const TIP=()=>document.getElementById('tip');
function hideTip(){const t=TIP();if(t)t.hidden=true}
function placeTip(x,y){const t=TIP(),w=t.offsetWidth,h=t.offsetHeight;let l=x+14,tp=y+16;
  if(l+w>innerWidth-8)l=Math.max(8,x-w-12);if(tp+h>innerHeight-8)tp=Math.max(8,y-h-12);t.style.transform=`translate(${Math.round(l)}px,${Math.round(tp)}px)`}
document.addEventListener('pointerover',e=>{const el=e.target.closest&&e.target.closest('[data-tip]');const t=TIP();if(!t)return;if(!el){t.hidden=true;return}
  t.textContent=el.dataset.tip;t.hidden=false;placeTip(e.clientX,e.clientY)});
document.addEventListener('pointermove',e=>{const t=TIP();if(t&&!t.hidden)placeTip(e.clientX,e.clientY)});
document.addEventListener('focusin',e=>{const el=e.target.closest&&e.target.closest('[data-tip]');const t=TIP();if(!t)return;if(!el){t.hidden=true;return}
  const r=el.getBoundingClientRect();t.textContent=el.dataset.tip;t.hidden=false;placeTip(r.left+r.width/2,r.bottom)});
window.addEventListener('scroll',hideTip,{passive:true,capture:true});

/* ---------- charts: small SVG and HTML charts drawn with the theme tokens ----------
   One axis per chart, thin marks with 4px rounded data ends, recessive grid, text in text tokens, a tooltip on every mark.
   Series colors s1 s2 s3 (validated for color-vision deficiency in both themes); the accent marks "this one"; s2 marks your team. */
const CH={};
const _f=x=>Math.round(x*10)/10;
function niceTicks(lo,hi,n=4){if(!(hi>lo)){hi=lo+1}const span=hi-lo,step0=span/n,mag=Math.pow(10,Math.floor(Math.log10(step0))),err=step0/mag,step=(err>=7.5?10:err>=3.5?5:err>=1.5?2:1)*mag;
  const a=Math.ceil(lo/step-1e-9)*step,out=[];for(let v=a;v<=hi+1e-9;v+=step)out.push(+v.toFixed(10));return out}
CH.ticks=niceTicks;
// horizontal bars, one row per item: [{label,v,txt,hi,me,stat,tip,cls}]; diverging around zero when any value is negative
CH.hbars=(rows,o={})=>{if(!rows.length)return '<div class="empty">No data.</div>';
  const vals=rows.map(r=>r.v).filter(v=>v!=null&&isFinite(v)),neg=!!o.center||vals.some(v=>v<0),mx=o.max??Math.max(...vals.map(Math.abs),1e-9),mn=neg?-(o.max??mx):0;
  const X=v=>(v-mn)/(mx-mn)*100,z=X(0);
  return `<div class="hb${o.stack?' stack':''}" ${o.label?`role="list" aria-label="${esc(o.label)}"`:''}>${rows.map(r=>{const v=r.v,ok=v!=null&&isFinite(v),l=ok?Math.min(X(v),z):z,w=ok?Math.abs(X(v)-z):0;
    const cls=r.cls||(r.hi?'hi':r.me?'me':neg?(v<0?'neg':'pos'):'');
    const inner=`<span class="hb-l">${r.label}</span><span class="hb-b">${neg?`<span class="zero" style="left:${_f(z)}%"></span>`:''}<i class="${cls}" style="left:${_f(l)}%;width:${_f(Math.max(w,ok&&v!==0?.6:0))}%"></i></span><span class="hb-v">${r.txt??(ok?(o.fmt?o.fmt(v):v.toFixed(1)):'–')}</span>`;
    const tip=r.tip?` data-tip="${esc(r.tip)}"`:'';
    return r.stat?`<button type="button" class="hb-r ${r.hi?'hi':''}" data-stat="${esc(r.stat)}"${tip} role="listitem">${inner}</button>`:`<div class="hb-r ${r.hi?'hi':''}"${tip} role="listitem">${inner}</div>`}).join('')}</div>`};
// dot strip: where one value sits among many. items [{v,label,hi,me,stat}]; o.fmt, o.rev (lower is better: better stays on the right)
CH.strip=(items,o={})=>{const it=items.filter(x=>x.v!=null&&isFinite(x.v));if(!it.length)return '<div class="empty">No data.</div>';
  const W=640,H=o.h||96,pad=18,vs=it.map(x=>x.v),lo=Math.min(...vs),hi=Math.max(...vs),span=(hi-lo)||1;
  const X=v=>{const t=(v-lo)/span;return pad+(o.rev?1-t:t)*(W-2*pad)},base=H-26,r=4;
  const sorted=[...it].sort((a,b)=>X(a.v)-X(b.v)),rows=[];
  sorted.forEach(d=>{const x=X(d.v);let k=0;while((rows[k]||[]).some(px=>Math.abs(px-x)<2*r+1))k++;(rows[k]=rows[k]||[]).push(x);d._x=x;d._y=base-8-k*(2*r+1)});
  const ymin=Math.min(...sorted.map(d=>d._y));const top=Math.min(0,ymin-(it.some(d=>d.hi)?32:12));
  const med=[...vs].sort((a,b)=>a-b)[Math.floor(vs.length/2)],fmt=o.fmt||(v=>v.toFixed(1));
  const dots=sorted.filter(d=>!d.hi).map(d=>`<circle class="dot ${d.me?'me':''}" cx="${_f(d._x)}" cy="${_f(d._y)}" r="${r}" data-tip="${esc(d.label+' · '+fmt(d.v))}"${d.stat?` data-stat="${esc(d.stat)}"`:''}/>`).join('');
  const his=sorted.filter(d=>d.hi).map(d=>{const anchor=d._x<W*.2?'start':d._x>W*.8?'end':'middle';const ly=ymin-16;return `<line class="ax" x1="${_f(d._x)}" x2="${_f(d._x)}" y1="${_f(ly+4)}" y2="${_f(d._y-7)}"/><circle class="dot hi" cx="${_f(d._x)}" cy="${_f(d._y)}" r="6.5" data-tip="${esc(d.label+' · '+fmt(d.v))}"/><text class="ink" x="${_f(d._x)}" y="${_f(ly)}" text-anchor="${anchor}">${esc(d.label)} · ${esc(fmt(d.v))}</text>`}).join('');
  const lx=o.rev?W-pad:pad,hx=o.rev?pad:W-pad;
  return `<div class="chwrap"><svg class="ch" viewBox="0 ${_f(top)} ${W} ${_f(H-top)}" role="img" aria-label="${esc(o.label||'Distribution')}">
    <line class="ax" x1="${pad}" x2="${W-pad}" y1="${base}" y2="${base}"/><line class="md" x1="${_f(X(med))}" x2="${_f(X(med))}" y1="${_f(Math.max(top+14,ymin-6))}" y2="${base}"/>
    ${dots}${his}
    <text x="${lx}" y="${base+16}" text-anchor="${o.rev?'end':'start'}">${esc(fmt(lo))}${o.rev?'':' · worst'}</text><text x="${_f(X(med))}" y="${base+16}" text-anchor="middle">median ${esc(fmt(med))}</text><text x="${hx}" y="${base+16}" text-anchor="${o.rev?'start':'end'}">${o.rev?'':'best · '}${esc(fmt(hi))}</text></svg></div>`};
// radar for up to three series over the nine categories; vals are 0..1 (percentiles). series [{name,vals,cls:'s1'|'s2'|'s3'}]
CH.radar=(series,axes,o={})=>{const W=360,cx=W/2,cy=W/2,R=128,n=axes.length,ang=i=>-Math.PI/2+i*2*Math.PI/n,pt=(i,v)=>[cx+Math.cos(ang(i))*R*v,cy+Math.sin(ang(i))*R*v];
  const rings=[.25,.5,.75,1].map(t=>`<polygon class="gr" fill="none" points="${axes.map((_,i)=>pt(i,t).map(_f).join(',')).join(' ')}"/>`).join('');
  const spokes=axes.map((_,i)=>{const [x,y]=pt(i,1);return `<line class="gr" x1="${cx}" y1="${cy}" x2="${_f(x)}" y2="${_f(y)}"/>`}).join('');
  const labels=axes.map((a,i)=>{const [x,y]=pt(i,1.17);return `<text class="ink" x="${_f(x)}" y="${_f(y+4)}" text-anchor="middle">${esc(a.l)}</text>`}).join('');
  const polys=series.map(s=>`<polygon class="area ${s.cls}" points="${s.vals.map((v,i)=>pt(i,Math.max(.02,v||0)).map(_f).join(',')).join(' ')}"/>`+s.vals.map((v,i)=>{const [x,y]=pt(i,Math.max(.02,v||0));return `<circle class="${s.cls}" cx="${_f(x)}" cy="${_f(y)}" r="4" stroke="var(--panel)" stroke-width="1.5" data-tip="${esc(s.name+' · '+axes[i].l+': better than '+Math.round((v||0)*100)+'%'+(o.of?' of '+o.of:''))}"${s.stats?` data-stat="${esc(s.stats[i])}"`:''}/>`}).join('')).join('');
  const legend=series.length>1?`<div class="legend">${series.map(s=>`<span><i class="${s.cls}"></i>${esc(s.name)}</span>`).join('')}</div>`:'';
  return `<div class="chwrap" style="max-width:440px;margin:0 auto;width:100%"><svg class="ch" viewBox="-30 -14 ${W+60} ${W+28}" role="img" aria-label="${esc(o.label||'Category profile')}">${rings}${spokes}${polys}${labels}</svg>${legend}</div>`};
// bars for a discrete distribution (categories won 0..9, seeds 1..10): items [{x,p,cls,stat}]
CH.dist=(items,o={})=>{const W=520,H=150,pad=22,bw=(W-2*pad)/items.length,mx=Math.max(...items.map(d=>d.p),1e-9),bh=H-42;
  return `<div class="chwrap"><svg class="ch" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label||'Distribution')}"><line class="ax" x1="${pad}" x2="${W-pad}" y1="${H-24}" y2="${H-24}"/>
    ${items.map((d,i)=>{const h=Math.max(d.p>0?2:0,d.p/mx*bh),x=pad+i*bw+2,y=H-24-h,w=bw-4,r=Math.min(4,h/2,w/2);
      const path=h>0?`M${_f(x)},${H-24}V${_f(y+r)}Q${_f(x)},${_f(y)} ${_f(x+r)},${_f(y)}H${_f(x+w-r)}Q${_f(x+w)},${_f(y)} ${_f(x+w)},${_f(y+r)}V${H-24}Z`:'';
      return `${path?`<path class="${d.cls||'bar-n'}" d="${path}" data-tip="${esc((d.tip||d.x)+': '+pc(d.p))}"${d.stat?` data-stat="${esc(d.stat)}"`:''}/>`:''}${d.p>=.03?`<text x="${_f(x+w/2)}" y="${_f(y-5)}" text-anchor="middle">${pc(d.p)}</text>`:''}<text class="${d.em?'ink':''}" x="${_f(x+w/2)}" y="${H-8}" text-anchor="middle">${esc(String(d.x))}</text>`}).join('')}</svg>${o.legend||''}</div>`};
// two (or three) normal curves on one axis: [{m,s,name,cls}]; o.fmt; o.rev when lower is better
CH.normals=(ds,o={})=>{const W=560,H=140,pad=16,lo=Math.min(...ds.map(d=>d.m-3*d.s)),hi=Math.max(...ds.map(d=>d.m+3*d.s)),X=v=>pad+(v-lo)/((hi-lo)||1)*(W-2*pad);
  const pk=Math.max(...ds.map(d=>1/(d.s||1e-9))),Y=v=>H-24-v/pk*(H-40),fmt=o.fmt||(v=>v.toFixed(1));
  const curve=d=>{const pts=[];for(let k=0;k<=80;k++){const v=lo+(hi-lo)*k/80,y=Math.exp(-.5*((v-d.m)/(d.s||1e-9))**2)/(d.s||1e-9);pts.push(`${_f(X(v))},${_f(Y(y))}`)}return pts};
  const tk=niceTicks(lo,hi,5).filter(v=>v>=lo&&v<=hi);
  return `<div class="chwrap"><svg class="ch" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label||'Projected range')}"><line class="ax" x1="${pad}" x2="${W-pad}" y1="${H-24}" y2="${H-24}"/>
    ${tk.map(v=>`<text x="${_f(X(v))}" y="${H-8}" text-anchor="middle">${esc(fmt(v))}</text>`).join('')}
    ${ds.map(d=>{const p=curve(d);return `<polygon class="area ${d.cls}" points="${_f(X(lo))},${H-24} ${p.join(' ')} ${_f(X(hi))},${H-24}" data-tip="${esc(d.name+': most likely '+fmt(d.m)+', usually '+fmt(d.m-d.s)+' to '+fmt(d.m+d.s))}"/><line class="${d.cls}" x1="${_f(X(d.m))}" x2="${_f(X(d.m))}" y1="${H-24}" y2="${_f(Y(1/(d.s||1e-9)))}" stroke-width="2"/>`}).join('')}</svg>
    <div class="legend">${ds.map(d=>`<span><i class="${d.cls}"></i>${esc(d.name)} ${esc(fmt(d.m))}</span>`).join('')}${o.rev?'<span>lower is better</span>':''}</div></div>`};
// lines over a shared x axis: series [{name,cls,pts:[[x,y],...]}]; o.xl(x) label, o.fmt(y), o.y0/o.y1 fixed range
CH.line=(series,o={})=>{const W=600,H=o.h||170,pl=36,pr=12,pt=10,pb=24,all=series.flatMap(s=>s.pts);if(!all.length)return '<div class="empty">No data.</div>';
  const xs=all.map(p=>p[0]),ys=all.map(p=>p[1]),x0=Math.min(...xs),x1=Math.max(...xs),y0=o.y0??Math.min(...ys),y1=o.y1??Math.max(...ys);
  const X=x=>pl+(x-x0)/((x1-x0)||1)*(W-pl-pr),Y=y=>pt+(1-(y-y0)/((y1-y0)||1))*(H-pt-pb),fmt=o.fmt||(v=>String(_f(v))),xl=o.xl||(x=>x);
  const yt=niceTicks(y0,y1,4).filter(v=>v>=y0-1e-9&&v<=y1+1e-9),xt=[...new Set(xs)].sort((a,b)=>a-b),step=Math.ceil(xt.length/10);
  return `<div class="chwrap"><svg class="ch" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label||'Trend')}">
    ${yt.map(v=>`<line class="gr" x1="${pl}" x2="${W-pr}" y1="${_f(Y(v))}" y2="${_f(Y(v))}"/><text x="${pl-6}" y="${_f(Y(v)+4)}" text-anchor="end">${esc(fmt(v))}</text>`).join('')}
    ${o.ref!=null?`<line class="md" x1="${pl}" x2="${W-pr}" y1="${_f(Y(o.ref))}" y2="${_f(Y(o.ref))}"/>`:''}
    ${xt.filter((_,i)=>i%step===0).map(x=>`<text x="${_f(X(x))}" y="${H-6}" text-anchor="middle">${esc(String(xl(x)))}</text>`).join('')}
    ${series.map(s=>`<polyline class="ln ${s.cls}" points="${s.pts.map(p=>_f(X(p[0]))+','+_f(Y(p[1]))).join(' ')}"/>`+s.pts.map(p=>`<circle class="${s.cls}" cx="${_f(X(p[0]))}" cy="${_f(Y(p[1]))}" r="3.5" stroke="var(--panel)" stroke-width="1.5" data-tip="${esc(s.name+' · '+xl(p[0])+': '+fmt(p[1]))}"${p[2]?` data-stat="${esc(p[2])}"`:''}/>`).join('')).join('')}</svg>
    ${series.length>1?`<div class="legend">${series.map(s=>`<span><i class="${s.cls}"></i>${esc(s.name)}</span>`).join('')}</div>`:''}</div>`};
// scatter: points [{x,y,label,hi,me,stat,cls}]; o.xl/o.yl axis titles, o.fx/o.fy formatters, o.ref(x) optional reference curve, o.rx reverse x
CH.scatter=(pts,o={})=>{const W=600,H=o.h||300,pl=40,pr=14,pt=12,pb=34;if(!pts.length)return '<div class="empty">No data.</div>';
  const xs=pts.map(p=>p.x),ys=pts.map(p=>p.y),x0=o.x0??Math.min(...xs),x1=o.x1??Math.max(...xs),y0=o.y0??Math.min(...ys),y1=o.y1??Math.max(...ys);
  const X=x=>pl+(o.rx?1-(x-x0)/((x1-x0)||1):(x-x0)/((x1-x0)||1))*(W-pl-pr),Y=y=>pt+(1-(y-y0)/((y1-y0)||1))*(H-pt-pb),fx=o.fx||(v=>String(_f(v))),fy=o.fy||(v=>String(_f(v)));
  const yt=niceTicks(y0,y1,4).filter(v=>v>=y0-1e-9&&v<=y1+1e-9),xt=niceTicks(x0,x1,6).filter(v=>v>=x0-1e-9&&v<=x1+1e-9);
  let ref='';if(o.ref){const q=[];for(let k=0;k<=40;k++){const x=x0+(x1-x0)*k/40,y=o.ref(x);if(y>=y0&&y<=y1)q.push(_f(X(x))+','+_f(Y(y)))}ref=`<polyline class="md" fill="none" points="${q.join(' ')}"/>`}
  const order=[...pts].sort((a,b)=>(a.hi?1:0)-(b.hi?1:0)||(a.me?1:0)-(b.me?1:0));
  return `<div class="chwrap"><svg class="ch" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label||'Scatter')}">
    ${yt.map(v=>`<line class="gr" x1="${pl}" x2="${W-pr}" y1="${_f(Y(v))}" y2="${_f(Y(v))}"/><text x="${pl-6}" y="${_f(Y(v)+4)}" text-anchor="end">${esc(fy(v))}</text>`).join('')}
    ${xt.map(v=>`<text x="${_f(X(v))}" y="${H-pb+16}" text-anchor="middle">${esc(fx(v))}</text>`).join('')}
    <line class="ax" x1="${pl}" x2="${W-pr}" y1="${H-pb}" y2="${H-pb}"/>${ref}
    ${order.map(p=>`<circle class="dot ${p.hi?'hi':p.me?'me':''} ${p.cls||''}" cx="${_f(X(p.x))}" cy="${_f(Y(p.y))}" r="${p.hi?6:4.5}" data-tip="${esc(p.tip||p.label)}"${p.stat?` data-stat="${esc(p.stat)}"`:''}/>`).join('')}
    ${o.xl?`<text x="${_f((pl+W-pr)/2)}" y="${H-2}" text-anchor="middle">${esc(o.xl)}</text>`:''}${o.yl?`<text x="${pl}" y="${pt-2}" text-anchor="start">${esc(o.yl)}</text>`:''}</svg></div>`};
// sequential background for heat tables (0..1): one hue, light to dark, ink text stays readable
CH.seq=t=>`background:color-mix(in srgb,var(--s2) ${Math.round(6+Math.max(0,Math.min(1,t||0))*60)}%,var(--panel))`;

/* ---------- render ---------- */
const VIEWS={home:vHome,matchup:vMatchup,league:vLeague,stats:vStats,players:vPlayers,waivers:vWaivers,trades:vTrades,team:vTeam};
function renderChrome(){
  const active=S.tab==='team'?(S.team===ME?'home':'league'):S.tab;
  const dot=k=>k==='matchup'&&LIVEW&&LIVEW===curWeek?'<span class="ldot" title="Live scores this week"></span>':'';
  document.getElementById('tabs').innerHTML=TABS.map(([k,l])=>`<button type="button" role="tab" data-go="${k}" aria-selected="${k===active}">${l}${dot(k)}</button>`).join('');
  document.getElementById('bottom').innerHTML=TABS.map(([k,l])=>`<button type="button" data-go="${k}" ${k===active?'aria-current="page"':''}>${icon(k)}<span>${l}${dot(k)}</span></button>`).join('');
  document.getElementById('punts').innerHTML=CATS.map(c=>`<button type="button" class="chip" data-punt="${c.k}" aria-pressed="${S.punt.has(c.k)}" title="${c.n}: your team ranks #${tm(ME).catRank[c.k]}">${c.l} <small>#${tm(ME).catRank[c.k]}</small></button>`).join('');
  document.querySelectorAll('#mode button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===S.mode));
  const pl=[...S.punt].map(k=>CATS.find(c=>c.k===k).l);
  document.getElementById('buildlbl').textContent=(pl.length?'Punt '+pl.join(', '):'No punts')+(S.mode==='season'?' · season':'');
  document.getElementById('buildbtn').dataset.on=String(pl.length>0||S.mode==='season');
  const tray=document.getElementById('tray');
  document.body.classList.toggle('has-tray',S.cmp.length>0);
  if(S.cmp.length){tray.hidden=false;tray.innerHTML=`<span class="tn">Compare</span>${S.cmp.map(n=>`<span class="tn">${esc(n)} <button type="button" class="x" data-cmpx="${esc(n)}" aria-label="Remove ${esc(n)}">✕</button></span>`).join('')}<button type="button" class="btn sm" data-open-cmp ${S.cmp.length<2?'disabled':''}>Compare ${S.cmp.length}</button>`}else tray.hidden=true}
function render(keepScroll){
  if(ME==null)return;
  renderChrome();hideTip();
  const keep=!keepScroll?[]:[...document.querySelectorAll('#view [data-keep]')].map(e=>[e.dataset.keep,e.scrollTop,e.scrollLeft]);
  const v=document.getElementById('view');v.innerHTML=VIEWS[S.tab]();pruneStats(v);
  keep.forEach(([k,t,l])=>{const e=v.querySelector(`[data-keep="${k}"]`);if(e){e.scrollTop=t;e.scrollLeft=l}});
  if(S.sheet)renderSheet();
}
// a number whose breakdown isn't part of this build (its module is missing) stays plain text instead of opening "No breakdown"
function pruneStats(root){root.querySelectorAll('[data-stat]').forEach(el=>{if(DRILL[el.getAttribute('data-stat').split('|')[0]])return;
  if(el.tagName==='BUTTON'&&el.classList.contains('sx')){const s=document.createElement('span');s.innerHTML=el.innerHTML;el.replaceWith(s)}
  else{el.removeAttribute('data-stat');if(el.tagName!=='BUTTON'&&el.getAttribute('tabindex')==='0')el.removeAttribute('tabindex')}})}
function renderSheet(){const sh=document.getElementById('sheet'),sc=document.getElementById('scrim');
  if(!S.sheet){sh.hidden=true;sc.hidden=true;document.body.style.overflow='';return}
  const top=S.stack[S.stack.length-1],prev=S.stack[S.stack.length-2];
  const body=S.sheet==='player'?sheetPlayer(S.sheetName):S.sheet==='stat'?sheetStat(S.sheetName):sheetCompare();
  if(top&&!top.t)top.t=S.sheet==='player'?S.sheetName:S.sheet==='compare'?'Compare':'';
  const nav=prev?`<div class="sheet-nav"><button type="button" class="btn sm ghost" data-back>${icon('back')}Back</button><span class="note">to ${esc(prev.t||'previous')}</span></div>`:'';
  sh.innerHTML=nav+body;pruneStats(sh);sh.hidden=false;sc.hidden=false;document.body.style.overflow='hidden'}
let lastFocus=null;
// the sheet keeps a stack, so a drill-down opened from inside the sheet can go back to where it came from
function openSheet(kind,name){if(!S.sheet){lastFocus=document.activeElement;S.stack=[]}
  const top=S.stack[S.stack.length-1],a=name||null;
  if(!(top&&top.k===kind&&top.a===a))S.stack.push({k:kind,a});
  if(S.stack.length>15)S.stack.splice(0,S.stack.length-15);
  S.sheet=kind;S.sheetName=a;renderSheet();const sh=document.getElementById('sheet');sh.scrollTop=0;const b=sh.querySelector('[data-close]');if(b)b.focus()}
function sheetBack(){S.stack.pop();const t=S.stack[S.stack.length-1];if(!t){closeSheet();return}
  S.sheet=t.k;S.sheetName=t.a;renderSheet();const sh=document.getElementById('sheet');sh.scrollTop=0;const b=sh.querySelector('[data-back],[data-close]');if(b)b.focus()}
function closeSheet(){S.sheet=null;S.stack=[];renderSheet();if(lastFocus&&document.contains(lastFocus))lastFocus.focus()}
const openStat=d=>openSheet('stat',d);
function go(tab,opts={}){S.tab=tab;if(tab==='team'&&opts.team!=null)S.team=opts.team;if(tab==='stats'&&opts.hub){S.hub=opts.hub;store.set('hub',S.hub)}
  const tok=tab==='team'?'team-'+S.team:tab==='stats'&&S.hub?'stats-'+S.hub:tab;try{history.replaceState(null,'','#'+tok)}catch(e){}
  render();if(!opts.keep)window.scrollTo({top:0})}
let toastT=null;function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2600)}
function scrollToId(id){const el=document.getElementById(id);if(el)el.scrollIntoView({block:'start'})}

/* ---------- search ---------- */
let SR=[],SRi=-1;
function searchResults(q){q=norm(q);if(!q)return [];
  const ps=M.all.filter(p=>norm(p.name).includes(q)).sort((a,b)=>(norm(a.name).startsWith(q)?0:1)-(norm(b.name).startsWith(q)?0:1)||b.tv-a.tv).slice(0,8);
  const ts=M.teams.filter(t=>norm(t.name+' '+t.mgr+' '+t.abbr).includes(q)).slice(0,4);
  const cm=CMDS.map((c,i)=>[c,i]).filter(([c])=>norm(c.label+' '+(c.kw||'')).includes(q)).slice(0,5);
  return [...cm.map(([c,i])=>({k:'cmd',id:i,html:`<span><b>${esc(c.label)}</b><small>${esc(c.sub||'')}</small></span><em>${esc(c.tag||'Go')}</em>`})),...ts.map(t=>({k:'team',id:t.id,html:`<span><b>${esc(t.name)}</b><small>${esc(t.mgr)} · power rank #${t.pr}</small></span><em>Team</em>`})),...ps.map(p=>({k:'player',id:p.name,html:`<span><b>${esc(p.name)}</b>${pills(p)}<small>${p.team?esc(teamById[p.team].name):'Free agent'} · ${p.nba} · ${p.pos}</small></span><em>${p.tv.toFixed(0)}</em>`}))]}
function drawSearch(){const box=document.getElementById('sresults'),inp=document.getElementById('sq');
  if(!SR.length){box.hidden=!inp.value.trim();box.innerHTML=inp.value.trim()?'<div class="res-h">No matches</div>':'';inp.setAttribute('aria-expanded',String(!box.hidden));return}
  box.hidden=false;inp.setAttribute('aria-expanded','true');box.innerHTML=SR.map((r,i)=>`<button type="button" class="res" role="option" data-res="${i}" aria-selected="${i===SRi}">${r.html}</button>`).join('')}
function pickResult(i){const r=SR[i];if(!r)return;const inp=document.getElementById('sq');inp.value='';SR=[];SRi=-1;drawSearch();document.getElementById('bar').classList.remove('searching');
  if(r.k==='cmd'){try{CMDS[r.id].act()}catch(e){console.error(e)}return}
  if(r.k==='team')go('team',{team:r.id});else openSheet('player',r.id)}

/* ---------- events ---------- */
const SEGKEY={lg:'lg',tr:'tr',pv:'pView',pp:'pPool',wm:'wMode',hub:'hub'};
document.addEventListener('click',e=>{
  const el=e.target;
  if(el.closest('[data-close]')||el.id==='scrim'){closeSheet();return}
  if(el.closest('[data-back]')){sheetBack();return}
  const pop=document.getElementById('buildpop');
  if(!pop.hidden&&!el.closest('#buildpop')&&!el.closest('#buildbtn')){pop.hidden=true;document.getElementById('buildbtn').setAttribute('aria-expanded','false')}
  if(!el.closest('#searchbox')){const b=document.getElementById('sresults');if(!b.hidden){b.hidden=true;document.getElementById('sq').setAttribute('aria-expanded','false')}}
  if(el.closest('#buildbtn')){pop.hidden=!pop.hidden;document.getElementById('buildbtn').setAttribute('aria-expanded',String(!pop.hidden));return}
  if(el.closest('#build-done')){pop.hidden=true;document.getElementById('buildbtn').setAttribute('aria-expanded','false');return}
  if(el.closest('#build-reset')){S.punt.clear();store.set('punt',[]);recompute();render();return}
  if(el.closest('#search-toggle')){const bar=document.getElementById('bar');bar.classList.toggle('searching');if(bar.classList.contains('searching'))document.getElementById('sq').focus();return}
  if(el.closest('#brand')){go('home');return}
  if(el.matches('input.cmp,input.tr-pick')||(el.closest('label.pick')&&!el.closest('[data-stat]')))return;
  // act on the innermost actionable element, so a name link inside a clickable row opens the name, not the row
  const a=el.closest('[data-stat],[data-set],[data-res],[data-punt],#mode button,[data-seg],th[data-sort],.tchip,[data-watch],[data-cmpadd],[data-open-cmp],[data-cmpx],[data-balance],[data-addtrade],[data-trade],[data-want],[data-go],[data-player],[data-team],[data-wkteam],[data-week]');
  if(!a){}
  else if(a.matches('[data-stat]')){hideTip();openStat(a.dataset.stat);return}
  else if(a.matches('[data-set]')){const t=a.dataset.set,i=t.indexOf('=');S.x[t.slice(0,i)]=t.slice(i+1);store.set('x',S.x);render(true);return}
  else if(a.matches('[data-res]')){pickResult(+a.dataset.res);return}
  else if(a.matches('[data-punt]')){const k=a.dataset.punt;S.punt.has(k)?S.punt.delete(k):S.punt.add(k);store.set('punt',[...S.punt]);S.target=null;recompute();render();return}
  else if(a.matches('#mode button')){S.mode=a.dataset.v;store.set('mode',S.mode);recompute();render();return}
  else if(a.matches('[data-seg]')){const key=SEGKEY[a.dataset.seg];S[key]=a.dataset.v;store.set(key,S[key]);if(key==='hub'){try{history.replaceState(null,'','#stats-'+S.hub)}catch(e){}}render();return}
  else if(a.matches('th[data-sort]')){const v=a.dataset.view,k=a.dataset.sort,[ck,cd]=S.sort[v];S.sort[v]=[k,ck===k?(cd==='desc'?'asc':'desc'):(ASC_KEYS.includes(k)?'asc':'desc')];render();return}
  else if(a.matches('.tchip')){const k=a.dataset.k,t=new Set(targetsFor());t.has(k)?t.delete(k):t.add(k);S.target=[...t];render(true);return}
  else if(a.matches('[data-watch]')){const n=a.dataset.watch;S.watch.has(n)?S.watch.delete(n):S.watch.add(n);store.set('watch',[...S.watch]);toast(S.watch.has(n)?`${n} added to your watchlist`:`${n} removed from your watchlist`);render(true);return}
  else if(a.matches('[data-cmpadd]')){const n=a.dataset.cmpadd;if(!S.cmp.includes(n)){if(S.cmp.length>=4)S.cmp.shift();S.cmp.push(n)}if(S.cmp.length>=2)openSheet('compare');else{toast(`${n} added. Pick one more to compare.`);render(true)}return}
  else if(a.matches('[data-open-cmp]')){openSheet('compare');return}
  else if(a.matches('[data-cmpx]')){S.cmp=S.cmp.filter(n=>n!==a.dataset.cmpx);render(true);return}
  else if(a.matches('[data-balance]')){const arr=a.dataset.balance==='give'?S.give:S.get;if(!arr.includes(a.dataset.name))arr.push(a.dataset.name);const y=window.scrollY;render(true);window.scrollTo({top:y});return}
  else if(a.matches('[data-addtrade]')){const n=a.dataset.addtrade,tid=+a.dataset.pteam;
    if(a.dataset.partner){S.tA=ME;S.tB=+a.dataset.partner;S.give=[];S.get=[]}
    if(tid===S.tA){if(!S.give.includes(n))S.give.push(n)}else if(tid===S.tB){if(!S.get.includes(n))S.get.push(n)}else if(tid===ME){S.tA=ME;if(!S.give.includes(n))S.give.push(n)}else{S.tB=tid;S.get=[n]}
    S.tr='machine';closeSheet();go('trades');setTimeout(()=>scrollToId('tr-verdict'),0);return}
  else if(a.matches('[data-trade]')){const t=JSON.parse(a.dataset.trade);S.tA=ME;S.tB=t.p;S.give=t.g;S.get=t.r;S.tr='machine';closeSheet();go('trades');setTimeout(()=>scrollToId('tr-verdict'),0);return}
  else if(a.matches('[data-want]')){S.want=a.dataset.want;S.tr='target';closeSheet();go('trades');return}
  else if(a.matches('[data-go]')){const d=a.dataset;
    if(d.week)S.week=+d.week;if(d.wkteam)S.wkTeam=+d.wkteam;if(d.lg)S.lg=d.lg;if(d.wmode)S.wMode=d.wmode;if(d.partner){S.tA=ME;S.tB=+d.partner;S.give=[];S.get=[];S.tr='machine'}
    closeSheet();go(d.go);return}
  else if(a.matches('[data-player]')){openSheet('player',a.dataset.player);return}
  else if(a.matches('[data-team]')){closeSheet();go('team',{team:+a.dataset.team});return}
  else if(a.matches('[data-wkteam]')){S.wkTeam=+a.dataset.wkteam;if(a.dataset.week)S.week=+a.dataset.week;render();window.scrollTo({top:0});return}
  else if(a.matches('[data-week]')){S.week=+a.dataset.week;render();window.scrollTo({top:0});return}
  if(el.closest('#tr-swap')){[S.tA,S.tB]=[S.tB,S.tA];[S.give,S.get]=[S.get,S.give];render();return}
  if(el.closest('#tr-clear')){S.give=[];S.get=[];render();return}
  if(el.closest('#ros-parse')){const txt=document.getElementById('ros-text').value,r=parseRanks(txt),n=Object.keys(r).length,msg=document.getElementById('ros-msg'),prev=document.getElementById('ros-prev');
    if(!n){msg.textContent='No player names from this league were found in that text. Paste the full table, names included.';prev.innerHTML='';ROS_PENDING=null;return}
    ROS_PENDING={src:'FantasyPros rest-of-season rankings',at:new Date().toISOString(),ranks:r};
    const top=Object.entries(r).sort((a,b)=>a[1]-b[1]).slice(0,8).map(([k,v])=>{const p=M.all.find(x=>norm(x.name)===k);return `${v}. ${esc(p?p.name:k)}`});
    msg.textContent=`Matched ${n} players.`;prev.innerHTML=`<p class="note">First matches: ${top.join(', ')}.</p><div class="filters"><button type="button" class="btn" id="ros-save">Use these rankings</button></div>`;return}
  if(el.closest('#ros-save')){if(ROS_PENDING)saveRos(ROS_PENDING);return}
  if(el.closest('#ros-clear')){clearRos();return}
});
document.addEventListener('keydown',e=>{

    const box=document.getElementById('sresults');if(!box.hidden){box.hidden=true;return}}

  if(inSq&&SR.length&&(e.key==='ArrowDown'||e.key==='ArrowUp')){e.preventDefault();SRi=(SRi+(e.key==='ArrowDown'?1:-1)+SR.length)%SR.length;drawSearch();return}
  if(inSq&&e.key==='Enter'){e.preventDefault();pickResult(SRi>=0?SRi:0);return}
  if(e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)){e.preventDefault();const bar=document.getElementById('bar');bar.classList.add('searching');document.getElementById('sq').focus();return}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('tr[tabindex],li[tabindex],[data-stat][tabindex]:not(button)')){e.preventDefault();e.target.click()}
  if(e.key==='Tab'&&S.sheet){const f=[...document.getElementById('sheet').querySelectorAll('button,select,input,a,[tabindex]')].filter(x=>!x.disabled);if(!f.length)return;
    if(e.shiftKey&&document.activeElement===f[0]){e.preventDefault();f[f.length-1].focus()}else if(!e.shiftKey&&document.activeElement===f[f.length-1]){e.preventDefault();f[0].focus()}}
});
document.addEventListener('change',e=>{const t=e.target,id=t.id;
  if(t.dataset&&t.dataset.setk){S.x[t.dataset.setk]=t.type==='checkbox'?(t.checked?'1':''):t.value;store.set('x',S.x);render(true);return}
  if(t.matches('input.cmp')){const n=t.dataset.name;if(t.checked){if(!S.cmp.includes(n)){if(S.cmp.length>=4){S.cmp.shift();toast('Comparing up to four players; dropped the first one')}S.cmp.push(n)}}else S.cmp=S.cmp.filter(x=>x!==n);render(true);return}
  if(t.matches('.tr-pick')){const arr=t.dataset.side==='give'?S.give:S.get,n=t.value;if(t.checked){if(!arr.includes(n))arr.push(n)}else arr.splice(arr.indexOf(n),1);const y=window.scrollY;render(true);window.scrollTo({top:y});return}
  const set={'f-team':v=>S.pTeam=v,'f-pos':v=>S.pPos=v,'f-tsel':v=>{S.team=+v;try{history.replaceState(null,'','#team-'+v)}catch(e){}},'wk-team':v=>S.wkTeam=+v,'wk-week':v=>S.week=+v,'tr-partner':v=>{S.tB=+v;S.get=[]},'tr-a':v=>{S.tA=+v;S.give=[]},
    'tv-team':v=>S.tvTeam=v,'tv-pos':v=>S.tvPos=v,'tr-shape':v=>S.tShape=v,'tr-filter':v=>S.tFilter=v,'w-drop':v=>S.drop=v,'w-pos':v=>S.wPos=v,'w-week':v=>S.wWeek=+v,'want':v=>S.want=v||null};
  if(set[id]){set[id](t.value);render()}
});

function readHash(){const h=location.hash.slice(1);if(/^team-\d+$/.test(h)&&teamById[+h.slice(5)]){S.tab='team';S.team=+h.slice(5)}else if(/^stats-[a-z0-9]+$/.test(h)){S.tab='stats';S.hub=h.slice(6)}else if(VIEWS[h]&&h!=='team')S.tab=h}

/* ---------- shared rankings store ---------- */
async function saveRos(r){ROS=r;applyRos();recompute();render();
  if(DB&&CAN_SHARE!==false){try{await DB.doc('shared/ros').set(r);ROS_SHARED=true;store.set('ros',null);toast('Rankings saved for everyone who opens the board');render();return}catch(e){CAN_SHARE=false}}
  store.set('ros',r);ROS_SHARED=false;toast('Rankings saved on this device');render()}
async function clearRos(){if(DB&&ROS_SHARED){try{await DB.doc('shared/ros').delete()}catch(e){toast('Only the board\'s owner can remove the shared rankings');return}}
  store.set('ros',null);ROS=null;ROS_SHARED=false;applyRos();recompute();render();toast('Rankings removed')}
</script>
