@media (max-width:560px){.h5-sc .ch text{font-size:17px}}
`)}

/* ---------- the snake ---------- */
const rndOf=(n,NT)=>Math.ceil(n/NT), inRd=(n,NT)=>(n-1)%NT+1;
const slotOf=(n,NT)=>{const r=rndOf(n,NT),i=inRd(n,NT);return r%2?i:NT+1-i};
const pickAt=(slot,r,NT)=>(r-1)*NT+(r%2?slot:NT+1-slot);
const pl=(n,NT=DATA.teams.length)=>`${rndOf(n,NT)}.${String(inRd(n,NT)).padStart(2,'0')}`;

/* ---------- the board: picks, inferred slots, the expected-value curve, grades, rounds ---------- */
function board(vk){vk=vk==='model'?'model':vk==='tv'?'tv':VK();return memo(NS+'.board.'+vk,()=>{
  const NT=DATA.teams.length;
  const drafted=M.all.filter(p=>p.draftPick!=null&&Number.isFinite(+p.draftPick)&&+p.draftPick>=1);
  const byPick=new Map(),dups=[];
  [...drafted].sort((a,b)=>a.draftPick-b.draftPick||(b.team>0)-(a.team>0)).forEach(p=>{const n=+p.draftPick;if(byPick.has(n))dups.push(p);else byPick.set(n,p)});
  const N=byPick.size?Math.max(...byPick.keys()):0,R=Math.ceil(N/NT),NN=R*NT;
  // slot -> team by majority vote of where each slot's players are rostered now, one team per slot
  const votes={};byPick.forEach((p,n)=>{if(p.team>0){const s=slotOf(n,NT),o=votes[s]=votes[s]||{};o[p.team]=(o[p.team]||0)+1}});
  const pairs=[];Object.entries(votes).forEach(([s,o])=>Object.entries(o).forEach(([t,c])=>pairs.push([c,+s,+t])));
  pairs.sort((a,b)=>b[0]-a[0]||a[1]-b[1]);
  const s2t={},t2s={};pairs.forEach(([c,s,t])=>{if(s2t[s]==null&&t2s[t]==null){s2t[s]=t;t2s[t]=s}});
  const freeS=[...Array(NT)].map((_,i)=>i+1).filter(s=>s2t[s]==null),freeT=DATA.teams.map(t=>t.id).filter(t=>t2s[t]==null);
  if(freeS.length===1&&freeT.length===1){s2t[freeS[0]]=freeT[0];t2s[freeT[0]]=freeS[0]}
  const support={};for(let s=1;s<=NT;s++){const o=votes[s]||{},tot=Object.values(o).reduce((a,b)=>a+b,0);support[s]={n:s2t[s]!=null?(o[s2t[s]]||0):0,of:tot}}
  const picks=[];for(let n=1;n<=NN;n++){const p=byPick.get(n)||null,s=slotOf(n,NT),by=s2t[s]??null;
    picks.push({n,r:rndOf(n,NT),i:inRd(n,NT),s,by,p,v:valOf(p,vk),moved:!!(p&&by!=null&&p.team!==by)})}
  // expected value: least squares of value on ln(pick), floored at 0 (value can't go below replacement)
  const pts=picks.filter(k=>k.v!=null);let a=0,b=0;
  if(pts.length>=3){const X=pts.map(k=>Math.log(k.n)),Y=pts.map(k=>k.v),mx=mean(X),my=mean(Y);let sxy=0,sxx=0;X.forEach((x,i)=>{sxy+=(x-mx)*(Y[i]-my);sxx+=(x-mx)**2});b=sxx?sxy/sxx:0;a=my-b*mx}
  else if(pts.length)a=mean(pts.map(k=>k.v));
  const E=n=>Math.max(0,a+b*Math.log(Math.max(1,n)));
  picks.forEach(k=>{k.e=E(k.n);k.d=k.v==null?null:k.v-k.e});
  const res=pts.map(k=>k.d),sd=res.length>1?Math.sqrt(mean(res.map(x=>x*x))):1,ym=mean(pts.map(k=>k.v));
  const sst=pts.reduce((s,k)=>s+(k.v-ym)**2,0),sse=pts.reduce((s,k)=>s+k.d**2,0),r2=sst?Math.max(0,1-sse/sst):0;
  const T=[.5,1,2].map(m=>Math.max(1,Math.round(m*sd)));
  const cls=d=>d==null?'':d>=T[2]?'p3':d>=T[1]?'p2':d>=T[0]?'p1':d<=-T[2]?'n3':d<=-T[1]?'n2':d<=-T[0]?'n1':'';
  picks.forEach(k=>k.c=cls(k.d));
  [...pts].sort((x,y)=>y.v-x.v||x.n-y.n).forEach((k,i)=>k.vr=i+1);
  const dmax=Math.max(1,...pts.map(k=>Math.abs(k.d)));
  // teams: every pick credited to the team that made it, wherever the player is now
  const teams={};DATA.teams.forEach(t=>{const ks=picks.filter(k=>k.by===t.id),q=ks.filter(k=>k.v!=null);
    const best=q.reduce((m,k)=>!m||k.d>m.d?k:m,null),worst=q.reduce((m,k)=>!m||k.d<m.d?k:m,null);
    teams[t.id]={id:t.id,slot:t2s[t.id]??null,ks,nq:q.length,val:q.reduce((s,k)=>s+k.v,0),exp:q.reduce((s,k)=>s+k.e,0),sur:q.reduce((s,k)=>s+k.d,0),best,worst,
      steals:q.filter(k=>k.d>=T[1]).length,reaches:q.filter(k=>k.d<=-T[1]).length,kept:ks.filter(k=>k.p&&k.p.team===t.id).length}});
  const TL=Object.values(teams),sm=mean(TL.map(x=>x.sur)),ss=sdev(TL.map(x=>x.sur));
  TL.forEach(x=>{x.z=(x.sur-sm)/ss;x.grade=x.z>=.9?'A':x.z>=.35?'B+':x.z>=-.3?'B':x.z>=-.9?'C+':'C'});
  [...TL].sort((x,y)=>y.sur-x.sur).forEach((x,i)=>x.rk=i+1);[...TL].sort((x,y)=>y.val-x.val).forEach((x,i)=>x.vrk=i+1);
  const rounds=[];for(let r=1;r<=R;r++){const ks=picks.filter(k=>k.r===r),q=ks.filter(k=>k.v!=null);
    rounds.push({r,ks,nq:q.length,avg:q.length?mean(q.map(k=>k.v)):null,exp:mean(ks.map(k=>k.e)),hits:q.filter(k=>k.d>0).length,
      best:q.reduce((m,k)=>!m||k.d>m.d?k:m,null),worst:q.reduce((m,k)=>!m||k.d<m.d?k:m,null),top:q.reduce((m,k)=>!m||k.v>m.v?k:m,null),mine:ks.find(k=>k.by===ME)||null})}
  return {vk,NT,N,NN,R,picks,dups,s2t,t2s,support,fit:{a,b,r2,sd,E,T,n:pts.length,drop:-b*Math.LN2},cls,teams,rounds,dmax,
    kept:picks.filter(k=>k.p&&k.by!=null&&k.p.team===k.by).length,known:picks.filter(k=>k.p).length}})}
LAB.draftBoard=vk=>board(vk);
LAB.draftExpected=n=>{const B=board('tv');return B.N?B.fit.E(+n):null};

/* position runs: a stretch where one position went far more often than its overall rate */
function binTail(n,k,p){let s=0;for(let j=k;j<=n;j++){let c=1;for(let i=0;i<j;i++)c=c*(n-i)/(i+1);s+=c*Math.pow(p,j)*Math.pow(1-p,n-j)}return s}
const elig=k=>k.p?String(k.p.pos||'').split('/'):[];
function runs(){return memo(NS+'.runs',()=>{const B=board('tv'),out=[],known=Math.max(1,B.known);
  POS.forEach(X=>{const has=B.picks.map(k=>elig(k).includes(X)),p=has.filter(Boolean).length/known,idx=has.map((h,i)=>h?i:-1).filter(i=>i>=0),cand=[];
    if(p<=0||p>=1)return;
    for(let a=0;a<idx.length;a++)for(let b=a+2;b<idx.length;b++){const n=idx[b]-idx[a]+1;if(n>12)break;const k=b-a+1;cand.push({X,i0:idx[a],i1:idx[b],n,k,p,tail:binTail(n,k,p)})}
    cand.filter(c=>c.tail<=.02).sort((x,y)=>x.tail-y.tail||y.k-x.k).forEach(c=>{if(!out.some(o=>o.X===c.X&&!(c.i1<o.i0||c.i0>o.i1)))out.push(c)})});
  return out.sort((a,b)=>a.i0-b.i0||POS.indexOf(a.X)-POS.indexOf(b.X))})}

/* ---------- small pieces ---------- */
const vseg=vk=>`<div class="seg" role="group" aria-label="Value used">${[['tv','Trade value'],['model','Model only']].map(([v,l])=>`<button type="button" data-set="draft.v=${v}" aria-pressed="${v===vk}">${l}</button>`).join('')}</div>`;
const mbar=(d,mx)=>{if(d==null)return '';const w=Math.min(50,Math.abs(d)/mx*50);return `<span class="h5-mb" aria-hidden="true"><i class="${d>=0?'pos':'neg'}" style="${d>=0?'left:50%':'right:50%'};width:${w.toFixed(1)}%"></i></span>`};
const nowTxt=k=>!k.p?'':k.p.team===0?'now a free agent':k.moved?`now on ${esc(tAb(k.p.team))}`:'';
const pName=k=>k.p?esc(k.p.name):'<i>Not in the data</i>';
const tipOf=(k,B)=>k.p?`${pl(k.n)} (pick ${k.n}) · ${k.p.name}, ${k.p.pos} · by ${tNm(k.by)}${k.moved?' · now '+(k.p.team?tNm(k.p.team):'a free agent'):''} · ${k.v==null?'no projection':`${VL[B.vk].toLowerCase()} ${n0(k.v)}, usually ${n0(k.e)} here (${sgn(k.d)})`}`:`${pl(k.n)} (pick ${k.n}): no player recorded`;
const grd=g=>`<span class="grade g-${gcls(g)}" style="font-size:.95rem;min-width:1.9em;padding:2px 5px">${g}</span>`;
// one table row per pick (rows open the pick); team column optional
function pickRows(ks,B,o={}){return `<div class="scroll"><table class="h5-t"><thead><tr><th class="l stick" scope="col">Pick</th><th class="l" scope="col">Player</th><th scope="col" title="Today's value, and what this pick usually returns">Value</th><th scope="col">vs slot</th></tr></thead><tbody>
  ${ks.map(k=>`<tr class="click ${k.n===o.sel?'sel':''} ${o.team&&k.by===ME?'me':''}" ${sx('dpk|'+k.n)} tabindex="0" data-tip="${esc(tipOf(k,B))}"><td class="l stick num">${pl(k.n)}<span class="rk">#${k.n}</span></td><td class="l wrap"><b style="font-weight:600">${pName(k)}</b>${k.p?pills(k.p):''}<small>${k.p?esc(k.p.pos)+' · '+esc(k.p.nba):''}${o.team?' · by '+esc(tAb(k.by)):''}${nowTxt(k)?' · '+nowTxt(k):''}</small></td><td class="num"><b>${n0(k.v)}</b><span class="rk">usually ${n0(k.e)}</span></td><td class="num z ${k.c}" style="text-align:right">${sgn(k.d)}${mbar(k.d,B.dmax)}</td></tr>`).join('')}</tbody></table></div>`}
const dleg=B=>legend([['p3',`Big steal, ${B.fit.T[2]}+ above`],['p2',`Steal, ${B.fit.T[1]}+`],['p1',`${B.fit.T[0]}+`],['h5-0',`Within ${B.fit.T[0]}`],['n1',`${B.fit.T[0]}+ below`],['n2',`Reach, ${B.fit.T[1]}+`],['n3',`Big reach, ${B.fit.T[2]}+`]]);
const noDraft=()=>`<div class="empty">No draft picks are in the data yet.</div>`;
const fitHow=B=>`The usual return of a pick is a smooth curve fitted to all ${B.fit.n} drafted players with a projection: least squares of ${VL[B.vk].toLowerCase()} against the logarithm of the pick number, floored at 0. It says a pick loses about ${B.fit.drop.toFixed(0)} points of value each time the pick number doubles (pick 5 to 10, 10 to 20, and so on), and it explains ${pc(B.fit.r2)} of the differences between picks; a typical pick lands ${B.fit.sd.toFixed(0)} points off it. Colours mark how far a pick sits from the curve: ${B.fit.T[0]}, ${B.fit.T[1]} and ${B.fit.T[2]} points (half, one and two typical misses).`;
const valHow=()=>`Values are today's${preseason?' preseason':''} projections, not draft-day ones. Trade value already counts the draft slot (${pc(BLEND.W?BLEND.W.draft:0)} of the blend now, shrinking each week), which pulls every player toward where they went; "Model only" uses the category model alone (per-game value across all nine categories, games, health, above replacement), so it shows steals and reaches more starkly.`;
const slotHow=B=>{const me=B.t2s[ME];return `Which team picked in which slot is inferred, not read from ESPN: in a ${B.NT}-team snake, slot s picks s-th in odd rounds and ${B.NT+1}−s-th in even rounds, so each slot owns one pick per round; each slot goes to the team that rosters most of the players taken with those picks today. ${Object.values(B.support).every(x=>x.of&&x.n===x.of)?`Every slot is unanimous (all of its picks are still on one team).`:`Support ranges from ${Math.min(...Object.values(B.support).map(x=>x.of?x.n/x.of:0)).toFixed(2).replace(/^0/,'')} to 1 of each slot's picks.`} ${me!=null?(me===KNOWN_SLOT?`Your team maps to slot ${me}, which matches the slot you are known to have drafted from.`:`Your team maps to slot ${me}, but you are known to have drafted ${ord(KNOWN_SLOT)}: treat the mapping with care.`):''}`};

/* =====================================================================================
   dpk|<pick>
   ===================================================================================== */
DRILL.dpk=pick=>{const n=parseInt(pick,10),B=board();if(!Number.isFinite(n)||String(n)!==String(pick).trim()||n<1||!B.N||n>B.NN)return null;css();
  const k=B.picks[n-1],p=k.p,vk=B.vk,NT=B.NT,vl=VL[vk].toLowerCase();
  const base={eyebrow:`Draft · round ${k.r}, pick ${k.i} of ${NT}`,title:p?`${esc(p.name)} at ${pl(n)}`:`Pick ${pl(n)}`,back:`Pick ${pl(n)}`,
    sub:`Pick ${n} of ${B.NN}, by ${k.by!=null?esc(tNm(k.by)):'an unknown team'}${k.by===ME?' (you)':''}${p&&k.moved?` · ${p.team?'now on '+esc(tNm(p.team)):'now a free agent'}`:''}`};
  const lead=p&&k.v!=null?`${esc(p.name)} went ${ord(n)} overall. A ${ord(n)} pick usually returns about <b>${n0(k.e)}</b> in ${vl}; they are worth <b>${n0(k.v)}</b>, ${Math.abs(Math.round(k.d))} ${k.d>=0?'more':'less'}: ${VERD[k.c]}. On current values they are the ${ord(k.vr)} most valuable of the ${B.fit.n} drafted players, so a re-draft would take them around pick ${pl(k.vr)}.`
    :p?`${esc(p.name)} went ${ord(n)} overall but has no projection or stats yet, so the board can't value the pick. A ${ord(n)} pick usually returns about <b>${n0(k.e)}</b> in ${vl}.`
    :`No player in the data carries this pick (they may have been dropped and left the free-agent list). A ${ord(n)} pick usually returns about <b>${n0(k.e)}</b> in ${vl}.`;
  const tier=k.v!=null?tierOf(p.tv):null;
  let h=`<p class="h5-lead">${lead}</p><div class="filters"><span class="lbl">Value</span>${vseg(vk)}</div>`;
  h+=facts([k.v!=null?fact(VL[vk],n0(k.v),vk==='tv'?`${tier?tier[1]:''} · #${p.tvRank??'–'} on the trade chart`:`Trade value ${n0(p.tv)}`,'ptv|'+p.name):'',
    fact(`A ${ord(n)} pick usually returns`,n0(k.e),'the fitted curve at this pick'),
    k.v!=null?fact('Against the slot',sgn(k.d),VERD[k.c]):'',
    k.v!=null?fact('Re-draft spot',pl(k.vr),`${ord(k.vr)} most valuable drafted`):'',
    k.by!=null?fact('Drafted by',esc(tAb(k.by)),`${ord(B.teams[k.by].rk)} best draft · grade ${B.teams[k.by].grade}`,'tdr|'+k.by):'',
    fact('Round',k.r,`pick ${k.i} of ${NT} in the round`,'drd|'+k.r)]);
  // around the curve
  const lo=Math.max(1,n-15),hi=Math.min(B.NN,n+15),win=B.picks.slice(lo-1,hi),vals=win.filter(x=>x.v!=null);
  const y1=Math.max(10,Math.ceil(Math.max(...vals.map(x=>x.v),B.fit.E(lo))/10)*10),hasMe=vals.some(x=>x.by===ME&&x!==k);
  h+=drillSec('Against the curve',`Picks ${lo} to ${hi}. The dashed line is what each pick usually returns; dots above it beat their slot.`,
    `<div class="h5-sc">${CH.scatter(vals.map(x=>({x:x.n,y:x.v,hi:x===k,me:x.by===ME&&x!==k,tip:tipOf(x,B),stat:x===k?null:'dpk|'+x.n})),{xl:'Pick number',yl:VL[vk],fx:v=>String(Math.round(v)),fy:v=>String(Math.round(v)),ref:B.fit.E,x0:lo,x1:hi,y0:0,y1,h:250,label:'Value against pick number near this pick'})}</div>`
    +legend([...(k.v!=null?[['hi','This pick']]:[]),...(hasMe?[['me','Your picks']]:[]),['mut','Other picks'],['h5-md','What the pick usually returns']]));
  // the picks around it
  h+=drillSec('Just before and after','Tap a pick to move to it.',pickRows(B.picks.slice(Math.max(0,n-4),Math.min(B.NN,n+3)),B,{team:true,sel:n}));
  // hindsight
  if(k.v!=null){const later=B.picks.filter(x=>x.n>n&&x.v!=null&&x.v>k.v).sort((x,y)=>y.v-x.v),earlier=B.picks.filter(x=>x.n<n&&x.v!=null&&x.v<k.v);
    h+=drillSec('Hindsight',`${later.length?`${later.length} player${later.length>1?'s':''} taken later ${later.length>1?'are':'is'} worth more today.`:'Nobody taken after this pick is worth more today: on current values it was the right call.'} ${earlier.length?`${earlier.length} player${earlier.length>1?'s':''} taken earlier ${earlier.length>1?'are':'is'} worth less.`:''}`,
      later.length?CH.hbars(later.slice(0,4).map(x=>({label:`${pl(x.n)} ${esc(x.p.name)}<small>${esc(tAb(x.by))}</small>`,v:x.v-k.v,txt:'+'+Math.round(x.v-k.v),cls:'pos',stat:'dpk|'+x.n,tip:`${x.p.name} went ${x.n-n} picks later and is worth ${n0(x.v)}, ${Math.round(x.v-k.v)} more`})),{stack:true,label:'Later picks worth more'}):'')}
  // position context
  if(p){const lines=elig(k).filter(X=>POS.includes(X)).map(X=>{const xs=B.picks.filter(x=>elig(x).includes(X)),i=xs.indexOf(k),prev=xs[i-1],next=xs[i+1];
      const run=runs().find(u=>u.X===X&&k.n-1>=u.i0&&k.n-1<=u.i1);
      return `<li><b>${ord(i+1)} ${X} taken</b><p>${prev?`Previous: ${sbtn('dpk|'+prev.n,`${pl(prev.n)} ${esc(prev.p.name)}`)}. `:'The first one off the board. '}${next?`Next: ${sbtn('dpk|'+next.n,`${pl(next.n)} ${esc(next.p.name)}`)}${next.n-n>1?`, ${next.n-n} picks later`:', the very next pick'}.`:'The last one taken.'}${run?` Part of a run: ${run.k} ${POSN[X]} in ${run.n} picks (${pl(run.i0+1)} to ${pl(run.i1+1)}).`:''}</p></li>`});
    if(lines.length)h+=drillSec('Position',`${esc(p.pos)}. Players with two positions count for both.`,`<ul class="h5-runs">${lines.join('')}</ul>`)}
  // the team's draft around it
  if(k.by!=null){const tk=B.teams[k.by].ks,j=tk.indexOf(k),pv=tk[j-1],nx=tk[j+1];
    h+=drillSec(`${esc(tNm(k.by))}'s draft`,`Their ${ord(j+1)} pick of ${tk.length}.${pv?` Before it: ${sbtn('dpk|'+pv.n,`${pl(pv.n)} ${pv.p?esc(pv.p.name):'unknown'}`)}.`:''}${nx?` After it: ${sbtn('dpk|'+nx.n,`${pl(nx.n)} ${nx.p?esc(nx.p.name):'unknown'}`)}.`:''}`,'')}
  h+=`<div class="h5-acts">${p?`<button type="button" class="btn sm ghost" data-player="${esc(p.name)}">Player profile</button>`:''}${k.by!=null?`<button type="button" class="btn sm ghost" ${sx('tdr|'+k.by)}>${esc(tAb(k.by))} draft</button>`:''}<button type="button" class="btn sm ghost" ${sx('drd|'+k.r)}>Round ${k.r}</button>${n>1?`<button type="button" class="btn sm ghost" ${sx('dpk|'+(n-1))}>Pick ${pl(n-1)}</button>`:''}${n<B.NN?`<button type="button" class="btn sm ghost" ${sx('dpk|'+(n+1))}>Pick ${pl(n+1)}</button>`:''}</div>`;
  h+=how([fitHow(B),valHow(),slotHow(B)+` "Re-draft spot" ranks every drafted player by today's value; hindsight compares the same values, so it is wiser than anyone could have been on draft day.`]);
  return {...base,html:h}};

/* =====================================================================================
   tdr|<teamId>
   ===================================================================================== */
DRILL.tdr=id=>{const tid=parseInt(id,10),t=Number.isFinite(tid)?tm(tid):null;if(!t)return null;const B=board();if(!B.N)return null;css();
  const x=B.teams[tid],NT=B.NT,vk=B.vk,vl=VL[vk].toLowerCase(),me=tid===ME;
  const base={eyebrow:`Draft · ${x.slot!=null?ord(x.slot)+' slot':'slot unknown'}`,title:`${esc(t.name)}: draft`,back:`${t.abbr} draft`,sub:`${esc(t.mgr)}${me?' (you)':''} · ${x.ks.length} picks · grade ${x.grade}`};
  if(!x.ks.length)return {...base,html:`<div class="empty">No picks map to this team. The slot mapping is inferred from current rosters, and none of them point here.</div>`};
  const firsts=x.ks.slice(0,4).map(k=>k.n).join(', ');
  const lead=`${me?'You':esc(t.name)} picked ${ord(x.slot)} in odd rounds and ${ord(NT+1-x.slot)} in even rounds (picks ${firsts} and so on). ${me?'Your':'Their'} ${x.nq} valued picks are worth <b>${n0(x.val)}</b> in ${vl}, <b>${sgn(x.sur)}</b> against what those slots usually return: ${ord(x.rk)} of ${NT}, grade <b>${x.grade}</b>.${x.best?` Best pick: ${esc(x.best.p.name)} (${sgn(x.best.d)}). Worst: ${esc(x.worst.p.name)} (${sgn(x.worst.d)}).`:''}`;
  let h=`<p class="h5-lead">${lead}</p><div class="filters"><span class="lbl">Value</span>${vseg(vk)}</div>`;
  h+=facts([fact('Draft grade',x.grade,`${ord(x.rk)} of ${NT} against the slots`),fact('Against the slots',sgn(x.sur),`${x.steals} steal${x.steals===1?'':'s'}, ${x.reaches} reach${x.reaches===1?'':'es'}`),
    fact('Total value',n0(x.val),`${ord(x.vrk)} of ${NT}; slots usually return ${n0(x.exp)}`),
    x.best?fact('Best pick',sgn(x.best.d),`${esc(x.best.p.name)}, ${pl(x.best.n)}`,'dpk|'+x.best.n):'',x.worst?fact('Worst pick',sgn(x.worst.d),`${esc(x.worst.p.name)}, ${pl(x.worst.n)}`,'dpk|'+x.worst.n):'',
    fact('Still on the roster',`${x.kept} of ${x.ks.length}`,x.kept===x.ks.length?'every pick kept':'the rest traded or dropped')]);
  h+=drillSec('Pick by pick',`Value against what each pick usually returns. Tap a pick for the full story.`,pickRows(x.ks,B));
  // early, middle and late
  const thirds=[[1,5],[6,10],[11,B.R]].filter(([a,b])=>a<=B.R).map(([a,b])=>{const q=x.ks.filter(k=>k.r>=a&&k.r<=Math.min(b,B.R)&&k.v!=null);return [a,Math.min(b,B.R),q.reduce((s,k)=>s+k.d,0)]});
  h+=drillSec('Where the edge came from','Value against the slots, by stage of the draft.',facts(thirds.map(([a,b,s])=>fact(`Rounds ${a} to ${b}`,sgn(s),s>=0?'beat the slots':'below the slots'))));
  const TL=Object.values(B.teams).filter(y=>y.ks.length).sort((a,b)=>b.sur-a.sur);
  h+=drillSec('Against the league','Every team\'s value against its slots. Tap a team for its draft.',CH.hbars(TL.map(y=>({label:`${esc(tAb(y.id))}<small>${esc(teamById[y.id].mgr)}${y.id===ME?' (you)':''} · ${y.grade}</small>`,v:y.sur,txt:sgn(y.sur),cls:y.sur>=0?'pos':'neg',hi:y.id===tid,stat:y.id===tid?null:'tdr|'+y.id,tip:`${tNm(y.id)}: ${sgn(y.sur)} against their slots, grade ${y.grade}`})),{center:true,stack:true,label:'Value against slots by team'}));
  // position mix against the league average
  const cnt=ks=>{const o={};POS.forEach(X=>o[X]=ks.filter(k=>elig(k).includes(X)).length);return o},mine=cnt(x.ks),all=cnt(B.picks.filter(k=>k.by!=null)),nt=Object.values(B.teams).filter(y=>y.ks.length).length||1;
  h+=drillSec('Position mix',`How many players at each position ${me?'you':'they'} drafted, against the league average per team. Players with two positions count for both.`,
    `<div class="scroll"><table class="h5-t"><thead><tr><th class="l stick" scope="col"></th>${POS.map(X=>`<th scope="col">${X}</th>`).join('')}</tr></thead><tbody>
    <tr><td class="l stick"><b>${esc(t.abbr)}</b></td>${POS.map(X=>{const d=mine[X]-all[X]/nt;return `<td class="num z ${d>=2?'p2':d>=1?'p1':d<=-2?'n2':d<=-1?'n1':''}" ${sx('pos|'+X)} data-tip="${esc(`${mine[X]} ${POSN[X]} drafted; the average team took ${(all[X]/nt).toFixed(1)}`)}">${mine[X]}</td>`}).join('')}</tr>
    <tr><td class="l stick">League average</td>${POS.map(X=>`<td class="num">${(all[X]/nt).toFixed(1)}</td>`).join('')}</tr></tbody></table></div>`);
  h+=`<div class="h5-acts"><button type="button" class="btn sm ghost" data-team="${tid}">Team page</button><button type="button" class="btn sm ghost" ${sx('tval|'+tid)}>Team value today</button></div>`;
  h+=how([`Each pick's value minus what that pick usually returns, added up over the team's picks, is the team's value against its slots. The grade compares that total with the other teams: A is about one standard deviation above the league, B is about average, C about one below. Players count for the team that drafted them, even if they have since been traded or dropped; picks with no projection are left out.`,fitHow(B),valHow(),slotHow(B)]);
  return {...base,html:h}};

/* =====================================================================================
   drd|<round>
   ===================================================================================== */
DRILL.drd=r=>{const B=board(),rn=parseInt(r,10);if(!B.N||!Number.isFinite(rn)||rn<1||rn>B.R)return null;css();
  const R=B.rounds[rn-1],vk=B.vk,mine=R.mine,cnt=POS.map(X=>[X,R.ks.filter(k=>elig(k).includes(X)).length]);
  const base={eyebrow:`Draft · round ${rn} of ${B.R}`,title:`Round ${rn}`,back:`Round ${rn}`,sub:`Picks ${R.ks[0].n} to ${R.ks[R.ks.length-1].n}, ${rn%2?'slot 1 first':`slot ${B.NT} first (the snake turns)`}`};
  let h=`<p class="h5-lead">The average pick in round ${rn} is worth <b>${n0(R.avg)}</b> in ${VL[vk].toLowerCase()}, against <b>${n0(R.exp)}</b> usually. ${R.hits} of ${R.nq} picks beat their slot.</p><div class="filters"><span class="lbl">Value</span>${vseg(vk)}</div>`;
  h+=facts([fact('Average pick',n0(R.avg),`usually ${n0(R.exp)}`),R.best?fact('Best pick',sgn(R.best.d),`${esc(R.best.p.name)}, ${pl(R.best.n)}`,'dpk|'+R.best.n):'',R.worst?fact('Worst pick',sgn(R.worst.d),`${esc(R.worst.p.name)}, ${pl(R.worst.n)}`,'dpk|'+R.worst.n):'',
    mine?fact('Your pick',mine.v!=null?sgn(mine.d):'–',`${pName(mine)}, ${pl(mine.n)}`,'dpk|'+mine.n):'']);
  h+=drillSec('The picks',`Positions taken: ${cnt.filter(c=>c[1]).map(([X,c])=>`${c} ${X}`).join(', ')}.`,pickRows(R.ks,B,{team:true}));
  h+=`<div class="h5-acts">${rn>1?`<button type="button" class="btn sm ghost" ${sx('drd|'+(rn-1))}>Round ${rn-1}</button>`:''}${rn<B.R?`<button type="button" class="btn sm ghost" ${sx('drd|'+(rn+1))}>Round ${rn+1}</button>`:''}</div>`;
  h+=how([fitHow(B),valHow(),slotHow(B)]);
  return {...base,html:h}};

/* =====================================================================================
   The Draft view
   ===================================================================================== */
function vDraft(){const B=board();css();if(!B.N)return `<section class="panel">${head('Draft','')}${noDraft()}</section>`;
  const vk=B.vk,NT=B.NT,vl=VL[vk].toLowerCase(),my=B.teams[ME],src=DATA.draftSource||'this league\'s draft';
  const q=B.picks.filter(k=>k.v!=null),steals=[...q].sort((a,b)=>b.d-a.d),reaches=[...q].sort((a,b)=>a.d-b.d),bestT=Object.values(B.teams).sort((a,b)=>a.rk-b.rk)[0];
  const slots=[...Array(NT)].map((_,i)=>i+1);
  // 1. the board
  let h=`<section class="panel">${head('Draft board',`${esc(src.charAt(0).toUpperCase()+src.slice(1))}: ${B.NN} picks in ${B.R} rounds. Each square is a pick, coloured by its ${vl} against what that pick usually returns. Tap any pick, team or round.`,vseg(vk))}
    ${facts([my&&my.slot!=null?fact('Your draft slot',ord(my.slot),my.slot===KNOWN_SLOT?'matches your known draft position':'inferred; check it','tdr|'+ME):'',
      my?fact('Your draft grade',my.grade,`${sgn(my.sur)} against your slots · ${ord(my.rk)} of ${NT}`,'tdr|'+ME):'',
      steals[0]?fact('Biggest steal',sgn(steals[0].d),`${esc(steals[0].p.name)}, ${pl(steals[0].n)}`,'dpk|'+steals[0].n):'',
      reaches[0]?fact('Biggest reach',sgn(reaches[0].d),`${esc(reaches[0].p.name)}, ${pl(reaches[0].n)}`,'dpk|'+reaches[0].n):'',
      bestT?fact('Best draft',esc(tAb(bestT.id)),`grade ${bestT.grade} · ${sgn(bestT.sur)} against the slots`,'tdr|'+bestT.id):'',
      fact('Kept by their drafter',`${B.kept} of ${B.known}`,B.kept===B.known?'no draft pick has moved yet':'the rest were traded or dropped')])}
    <div class="scroll"><table class="h5-bd"><thead><tr><th class="h5-rd" scope="col"><span class="lbl">Rd</span></th>${slots.map(s=>{const id=B.s2t[s],x=id!=null?B.teams[id]:null,t=id!=null?teamById[id]:null;
      return `<th scope="col">${t?`<button type="button" class="h5-th ${id===ME?'me':''}" ${sx('tdr|'+id)} data-tip="${esc(`Slot ${s}: ${t.name} (${t.mgr})${id===ME?', you':''}. Grade ${x.grade}, ${sgn(x.sur)} against the slots. Supported by ${B.support[s].n} of ${B.support[s].of} picks.`)}"><small>Slot ${s}</small><b>${esc(t.abbr)}</b><small>${esc(t.mgr)} · ${x.grade}</small></button>`:`<span class="h5-th"><small>Slot ${s}</small><b>?</b></span>`}</th>`}).join('')}</tr></thead><tbody>
    ${B.rounds.map(R=>`<tr><th class="h5-rd" scope="row"><button type="button" ${sx('drd|'+R.r)} data-tip="${esc(`Round ${R.r}: average ${n0(R.avg)}, usually ${n0(R.exp)}; ${R.hits} of ${R.nq} beat their slot`)}">${R.r}<small>${R.r%2?'→':'←'}</small></button></th>${slots.map(s=>{const k=B.picks[pickAt(s,R.r,NT)-1];if(!k)return '<td></td>';
      return `<td><button type="button" class="h5-c ${k.p?(k.c||'h5-0'):'h5-x'} ${k.by===ME?'me':''}" ${sx('dpk|'+k.n)} data-tip="${esc(tipOf(k,B))}"><span class="h5-nm">${k.p?esc(shortName(k.p.name)):'Unknown'}</span><span class="h5-ln"><span>${k.p?esc(k.p.pos):''}</span><span>${k.p&&k.moved?'→'+esc(tAb(k.p.team)):''}</span></span><span class="h5-ln"><span>${pl(k.n)}</span><span>${k.v==null?'–':`${n0(k.v)} ${sgn(k.d)}`}</span></span></button></td>`}).join('')}</tr>`).join('')}</tbody></table></div>
    ${dleg(B)}<p class="note">Each square shows the player, their position, the pick, today's ${vl} and how far that is from the pick's usual return. Your picks have a blue outline. Rounds run left to right in odd rounds and right to left in even ones. An arrow (→) marks a player now on another team. Which team picked in which slot is inferred from today's rosters (see How this works).</p>
    ${how([slotHow(B),fitHow(B),valHow()])}</section>`;
  // 2. pick against value
  const pts=q.map(k=>({x:k.n,y:k.v,me:k.by===ME,tip:tipOf(k,B),stat:'dpk|'+k.n}));
  const ys=[1,5,10,25,50,100,B.NN].filter((v,i,a)=>v<=B.NN&&a.indexOf(v)===i);
  h+=`<section class="panel">${head('Pick against value',`Every drafted player by pick number and today's ${vl}. The dashed curve is what each pick usually returns; dots above it beat their slot.`)}
    <div class="h5-sc">${CH.scatter(pts,{xl:'Pick number',yl:VL[vk],fx:v=>String(Math.round(v)),fy:v=>String(Math.round(v)),ref:B.fit.E,x0:1,x1:B.NN,y0:0,y1:Math.max(10,Math.ceil(Math.max(...q.map(k=>k.v))/10)*10),h:320,label:'Value against pick number'})}</div>
    ${legend([['me','Your picks'],['mut','Other picks'],['h5-md','What the pick usually returns']])}
    ${facts(ys.map(n=>fact(n===1?'Pick 1 usually returns':`Pick ${n}`,n0(B.fit.E(n)),pl(n),'dpk|'+n)))}
    <p class="note">A pick loses about ${B.fit.drop.toFixed(0)} points each time the pick number doubles. The curve explains ${pc(B.fit.r2)} of the differences between picks; a typical pick lands ${B.fit.sd.toFixed(0)} points off it.</p></section>`;
  // 3. steals and reaches
  const mx=Math.max(1,...steals.slice(0,8).map(k=>Math.abs(k.d)),...reaches.slice(0,8).map(k=>Math.abs(k.d)));
  const lst=(ks,neg)=>CH.hbars(ks.slice(0,8).map(k=>({label:`${pl(k.n)} ${esc(k.p.name)}<small>${esc(tAb(k.by))}</small>`,v:Math.abs(k.d),txt:sgn(k.d),cls:neg?'neg':'pos',me:k.by===ME,stat:'dpk|'+k.n,tip:`${k.p.name} (${tNm(k.by)}): worth ${n0(k.v)}, a ${ord(k.n)} pick usually returns ${n0(k.e)}`})),{max:mx,stack:true,label:neg?'Biggest reaches':'Best steals'});
  h+=`<section class="panel">${head('Steals and reaches',`The picks furthest above and below what their slot usually returns, in points of ${vl}.`)}
    <div class="cols"><div class="drill-sec"><h3>Best steals</h3>${lst(steals,false)}</div><div class="drill-sec"><h3>Biggest reaches</h3>${lst(reaches,true)}</div></div>
    <p class="note">${['p2','n2'].map(c=>{const m=q.filter(k=>k.by===ME&&k.c.slice(0,1)===c[0]&&Math.abs(k.d)>=B.fit.T[1]);return m.length?`Your ${c[0]==='p'?'steals':'reaches'}: ${m.map(k=>sbtn('dpk|'+k.n,`${esc(k.p.name)} (${sgn(k.d)})`)).join(', ')}.`:`You have no ${c[0]==='p'?'steals':'reaches'} of ${B.fit.T[1]}+ points.`}).join(' ')}</p>
    ${how([`A steal is a pick worth at least ${B.fit.T[1]} points more than its slot usually returns, a reach at least ${B.fit.T[1]} points less (one typical miss from the curve). Injuries count: a player drafted early and now hurt shows as a reach, because their value today is lower. Late picks can't fall far below the curve, because value bottoms out at 0 (replacement level).`])}</section>`;
  // 4. team grades
  const TL=Object.values(B.teams).filter(y=>y.ks.length).sort((a,b)=>a.rk-b.rk);
  h+=`<section class="panel">${head('Team draft grades','Each team\'s picks against what those slots usually return, added up. Tap a team for every pick.')}
    <div style="max-width:760px">${CH.hbars(TL.map(y=>({label:`${esc(tAb(y.id))}<small>${esc(teamById[y.id].mgr)}${y.id===ME?' (you)':''} · ${y.grade}</small>`,v:y.sur,txt:sgn(y.sur),cls:y.sur>=0?'pos':'neg',hi:y.id===ME,stat:'tdr|'+y.id,tip:`${tNm(y.id)}: ${sgn(y.sur)} against their slots, grade ${y.grade}`})),{center:true,stack:true,label:'Value against slots by team'})}${legend([['pos','Beat their slots'],['neg','Below their slots']])}</div>
    <div class="scroll"><table class="h5-t"><thead><tr><th class="l stick" scope="col">Team</th><th scope="col">Slot</th><th scope="col">Grade</th><th scope="col">vs slots</th><th scope="col">Value</th><th class="l" scope="col">Best pick</th><th class="l" scope="col">Worst pick</th></tr></thead><tbody>
    ${TL.map(y=>`<tr class="click ${y.id===ME?'me':''}" ${sx('tdr|'+y.id)} tabindex="0"><td class="l stick tname">${esc(tAb(y.id))}<small>${esc(teamById[y.id].mgr)}</small></td><td class="num">${y.slot??'?'}</td><td>${grd(y.grade)}</td><td class="num"><b>${sgn(y.sur)}</b></td><td class="num">${n0(y.val)}</td><td class="l">${y.best?sbtn('dpk|'+y.best.n,`${esc(shortName(y.best.p.name))} ${sgn(y.best.d)}`):'–'}</td><td class="l">${y.worst?sbtn('dpk|'+y.worst.n,`${esc(shortName(y.worst.p.name))} ${sgn(y.worst.d)}`):'–'}</td></tr>`).join('')}</tbody></table></div>
    ${how([`Value against slots adds up each pick's value minus what that pick usually returns, so a team isn't rewarded just for picking early. "Value" is the plain total. The grade compares value against slots with the other teams: A is about one standard deviation above the league, B is about average, C about one below. Players count for the team that drafted them, even after a trade or a drop. Draft grades judge draft-day choices with today's values, which is hindsight.`])}</section>`;
  // 5. value by round
  const mineR=B.rounds.filter(R=>R.mine&&R.mine.v!=null),ser=[{name:'Average pick',cls:'s1',pts:B.rounds.filter(R=>R.avg!=null).map(R=>[R.r,R.avg,'drd|'+R.r])},{name:'Your pick',cls:'s2',pts:mineR.map(R=>[R.r,R.mine.v,'dpk|'+R.mine.n])},{name:'Best pick',cls:'s3',pts:B.rounds.filter(R=>R.top).map(R=>[R.r,R.top.v,'dpk|'+R.top.n])}];
  h+=`<section class="panel">${head('Value by round',`${VL[vk]} of the average pick, the best pick and your pick in each round.`)}
    <div class="h5-sc">${CH.line(ser,{xl:x=>'R'+x,fmt:v=>String(Math.round(v)),y0:0,h:220,label:'Value by round'})}</div>
    <div class="scroll"><table class="h5-t"><thead><tr><th class="l stick" scope="col">Round</th><th scope="col">Average</th><th scope="col">Usual</th><th scope="col">Beat slot</th><th class="l" scope="col">Best pick</th><th class="l" scope="col">Worst pick</th><th class="l" scope="col">Your pick</th></tr></thead><tbody>
    ${B.rounds.map(R=>`<tr><td class="l stick">${sbtn('drd|'+R.r,`Round ${R.r}`)}<small>${R.ks[0].n}–${R.ks[R.ks.length-1].n}</small></td><td class="num" ${sx('drd|'+R.r)}><b>${n0(R.avg)}</b></td><td class="num">${n0(R.exp)}</td><td class="num z ${R.nq&&R.hits/R.nq>=.7?'p2':R.nq&&R.hits/R.nq<=.3?'n1':''}" ${sx('drd|'+R.r)}>${R.hits} of ${R.nq}</td><td class="l">${R.best?sbtn('dpk|'+R.best.n,`${esc(shortName(R.best.p.name))} ${sgn(R.best.d)}`):'–'}</td><td class="l">${R.worst?sbtn('dpk|'+R.worst.n,`${esc(shortName(R.worst.p.name))} ${sgn(R.worst.d)}`):'–'}</td><td class="l">${R.mine?sbtn('dpk|'+R.mine.n,`${R.mine.p?esc(shortName(R.mine.p.name)):'?'} ${sgn(R.mine.d)}`):'–'}</td></tr>`).join('')}</tbody></table></div>
    ${how([`"Average" is the mean ${vl} of the round's picks; "Usual" is the curve's average over the same picks; "Beat slot" counts picks above the curve. Best and worst are measured against the slot, not raw value.`])}</section>`;
  // 6. position runs
  const RU=runs(),W=1100,pL=34,pR=6,top=6,rh=24,H=top+POS.length*rh+26,cw=(W-pL-pR)/B.NN;
  const inRun=(X,i)=>RU.some(u=>u.X===X&&i>=u.i0&&i<=u.i1);
  let sv=`<svg class="ch h5-strip" viewBox="0 0 ${W} ${H}" role="img" aria-label="Positions in draft order">`;
  for(let r=0;r<=B.R;r++){const x=pL+r*NT*cw;sv+=`<line class="gr" x1="${x.toFixed(1)}" x2="${x.toFixed(1)}" y1="${top}" y2="${top+POS.length*rh}"/>`;if(r<B.R)sv+=`<text x="${(x+NT*cw/2).toFixed(1)}" y="${H-6}" text-anchor="middle">${r+1}</text>`}
  sv+=`<text x="${pL-6}" y="${H-6}" text-anchor="end">Rd</text>`;
  POS.forEach((X,j)=>{const y=top+j*rh;sv+=`<text class="ink" x="${pL-6}" y="${y+rh/2+5}" text-anchor="end">${X}</text>`;
    RU.filter(u=>u.X===X).forEach(u=>{sv+=`<rect class="h5-band" x="${(pL+u.i0*cw).toFixed(1)}" y="${y+1}" width="${((u.i1-u.i0+1)*cw).toFixed(1)}" height="${rh-2}" rx="3" data-tip="${esc(`Run: ${u.k} ${POSN[X]} in ${u.n} picks, ${pl(u.i0+1)} to ${pl(u.i1+1)}`)}"/>`});
    B.picks.forEach((k,i)=>{if(!elig(k).includes(X))return;sv+=`<rect class="h5-tk ${inRun(X,i)?'on':''}" x="${(pL+i*cw+.5).toFixed(1)}" y="${y+4}" width="${Math.max(1.5,cw-1).toFixed(1)}" height="${rh-8}" rx="1" data-tip="${esc(`${pl(k.n)} ${k.p.name} (${k.p.pos})`)}" ${sx('dpk|'+k.n)}/>`})});
  sv+='</svg>';
  const pc2=X=>B.picks.filter(k=>elig(k).includes(X)).length;
  const heat=POS.map(X=>B.rounds.map(R=>R.ks.filter(k=>elig(k).includes(X)).length)),hmx=Math.max(1,...heat.flat());
  h+=`<section class="panel">${head('Position runs','Every pick in draft order, one row per position. Highlighted stretches are runs: one position going far faster than its usual rate.')}
    <div class="scroll">${sv}</div>${legend([['h5-bnd','A run'],['hi','Picks in a run'],['mut','Other picks at that position']])}
    ${RU.length?`<ul class="h5-runs">${RU.map(u=>{const ks=B.picks.slice(u.i0,u.i1+1).filter(k=>elig(k).includes(u.X));return `<li><b>${u.k} ${POSN[u.X]} in ${u.n} picks · ${pl(u.i0+1)} to ${pl(u.i1+1)}</b><p>${ks.map(k=>sbtn('dpk|'+k.n,`${esc(k.p.name)} (${esc(tAb(k.by))})`)).join(', ')}. Usually ${Math.round(u.p*100)}% of picks are ${u.X}-eligible.</p></li>`}).join('')}</ul>`:'<p class="note">No position went unusually fast in any stretch of this draft.</p>'}
    <h3>Positions by round</h3><p class="note">How many players eligible at each position went in each round. Darker means more. Tap a cell for the round.</p>
    <div class="scroll"><table class="hm h5-t"><thead><tr><th class="l stick" scope="col">Pos</th>${B.rounds.map(R=>`<th scope="col">${R.r}</th>`).join('')}<th scope="col">Total</th><th scope="col">First</th></tr></thead><tbody>
    ${POS.map((X,j)=>{const first=B.picks.find(k=>elig(k).includes(X));return `<tr><td class="l stick"><b>${X}</b></td>${heat[j].map((c,i)=>`<td style="${CH.seq(c/hmx)}" ${sx('drd|'+(i+1))} data-tip="${esc(`Round ${i+1}: ${c} ${POSN[X]}`)}">${c||''}</td>`).join('')}<td><b>${pc2(X)}</b></td><td>${first?sbtn('dpk|'+first.n,pl(first.n)):'–'}</td></tr>`}).join('')}</tbody></table></div>

  const crow=[...combos.entries()].map(([k,ps])=>({k,ps,spots:spotsOf(ps[0]).length,types:spotTypes(ps[0]),ro:ps.filter(p=>p.team).length,fa:ps.filter(p=>!p.team).length,best:[...ps].sort((a,b)=>b.value-a.value)[0]}))

  const B=benchSplit(),bt=ts.map(t=>({t,b:B.o[t.id],multi:t.roster.filter(p=>posOf(p).length>1).length,cOnly:t.roster.filter(p=>posOf(p).join('/')==='C').length,avgS:mean(t.roster.map(p=>spotsOf(p).length))}));
  const totPos=bt.reduce((s,x)=>s+x.b.pos,0),totCap=bt.reduce((s,x)=>s+x.b.cap,0);
  const flexTop=m.pool.filter(p=>spotsOf(p).length>=8).sort((a,b)=>b.value-a.value).slice(0,6);
  h+=`<section class="panel">${head('Multi-position flexibility',`Who fills the most of the ${m.perTeam} daily spots, and what positions actually cost each team.`)}
    <div class="scroll"><table><thead><tr><th class="l stick" scope="col">Eligible at</th><th scope="col">Daily spots</th><th class="l" scope="col">Which spots</th><th scope="col">Rostered</th><th scope="col">Free agents</th><th class="l" scope="col">Best of them</th></tr></thead><tbody>
    ${crow.map(r=>`<tr><td class="l stick"><b>${esc(r.k)}</b></td><td class="num"><b>${r.spots}</b> of ${m.perTeam}</td><td class="l">${r.types.join(', ')}</td><td class="num">${r.ro}</td><td class="num">${r.fa}</td><td class="l">${r.best?`${plink(r.best)} <button type="button" class="sx" data-stat="${esc('pv|'+r.best.name)}">${V(r.best.value)}</button>`:'–'}</td></tr>`).join('')}</tbody></table></div>
    ${flexTop.length?`<p class="note">Most flexible players worth knowing (8 of ${m.perTeam} spots): ${flexTop.map(p=>`${sbtn('pv|'+p.name,esc(p.name))} (${p.pos}, ${abbr(p)}, ${V(p.value)})`).join(', ')}.</p>`:''}
    <h3>What positions cost each team</h3>
    <p class="note">Over ${B.po?'the playoff weeks left':'the rest of the regular season'} (${plural(B.weeks.length,'week')}), on the real NBA schedule: games that sat only because no eligible spot was open, against games that sat because more than ${m.perTeam} players had games. League-wide, positions cost <b>${totPos}</b> player-game${totPos===1?'':'s'}; the ${m.perTeam}-starter cap costs <b>${totCap}</b>. ${totPos<=totCap/10?'In this league, games and value matter far more than position eligibility.':'Position balance matters here: some rosters leave real games on the bench.'}</p>
    <div class="scroll"><table><thead><tr><th class="l stick" scope="col">Team</th><th scope="col" title="Games benched because no eligible spot was open">Lost to positions</th><th scope="col" title="Games benched because more than 11 players had games">Lost to the cap</th><th scope="col">Two-position players</th><th scope="col">Pure centers</th><th scope="col" title="Average number of the 11 daily spots each rostered player can fill">Spots per player</th></tr></thead><tbody>
    ${bt.map(x=>`<tr class="${x.t.id===ME?'me':''}"><td class="l stick tname">${tlink(x.t)}</td><td class="num ${x.b.pos>0?'warnc':''}" ${sx('tgm|'+x.t.id)}><b>${x.b.pos}</b></td><td class="num" ${sx('tgm|'+x.t.id)}>${x.b.cap}</td><td class="num">${x.multi} of ${x.t.roster.length}</td><td class="num">${x.cOnly}</td><td class="num">${x.avgS.toFixed(1)}</td></tr>`).join('')}</tbody></table></div>
    ${how([`Daily spots: a PG or SG also fits G, an SF or PF also fits F, and everyone fits the four UTIL spots. So a pure center can fill ${spotsOf({pos:'C'}).length} of the ${m.perTeam} spots, a single-position guard or forward ${spotsOf({pos:'PG'}).length}, and an SG/SF or PG/PF ${spotsOf({pos:'SG/SF'}).length}.`,
      `The lost-games columns replay each remaining day with the board's lineup logic (best players first, real NBA games, expected rest and injuries). A game lost to positions is one where fewer than ${m.perTeam} players had games but a player still sat because every spot they fit was taken. Everything else on the bench is the cap. The numbers are whole expected games, so small differences are noise.`])}</section>`;

  // best free agent at each position
  const mine=me.roster;
  h+=`<section class="panel">${head('Best free agent at each position',`The top unrostered player eligible at each spot, measured against replacement level and against your weakest player there.`,`<button type="button" class="btn ghost" data-go="waivers" data-wmode="ros">Waivers</button>`)}
    <div class="scroll"><table><thead><tr><th class="l stick" scope="col">Pos</th><th class="l" scope="col">Best free agent</th><th scope="col">Value</th><th scope="col" title="Value minus the position's replacement level">Vs replacement</th><th scope="col" title="Rostered players eligible here with lower value">Beats</th><th class="l" scope="col">Your weakest there</th><th scope="col" title="The free agent's value minus your weakest eligible player's value">Swap gain</th></tr></thead><tbody>
    ${POS.map(x=>{const Q=P[x],f=Q.bestFA,w=mine.filter(p=>p.value!=null&&elig(p,x)).sort((a,b)=>a.value-b.value)[0]||null,g=f&&w?f.value-w.value:null,beats=f?Q.list.filter(p=>p.team&&p.value<f.value).length:0;
      return `<tr><td class="l stick"><button type="button" class="sx" data-stat="${esc('pos|'+x)}"><b>${x}</b></button></td>
      <td class="l h6-name">${f?`${plink(f)}${pills(f)}<small>${f.nba==='?'?'Unsigned':esc(f.nba)} · ${f.pos}</small>`:'<span class="note">None with stats</span>'}</td>
      <td class="num" ${f?sx('pv|'+f.name):''}><b>${f?V(f.value):'–'}</b></td><td class="num ${f&&f.value>=Q.repl?'up':'down'}" ${f?sx('pos|'+x):''}>${f?V(f.value-Q.repl):'–'}</td>
      <td class="num" ${sx('pos|'+x)}>${f?`${beats} of ${Q.rostered}`:'–'}</td>
      <td class="l h6-name">${w?`${plink(w)}<small>${w.pos} · ${V(w.value)}</small>`:'<span class="note">None</span>'}</td>
      <td class="num ${g==null?'':g>0?'up':'down'}" ${sx('pos|'+x+'|'+ME)}><b>${V(g)}</b></td></tr>`}).join('')}</tbody></table></div>
    ${how(['Free agents use their 2025-26 per-game stats; rostered players use ESPN\'s 2026-27 projection, with the season so far blended in once games start. Swap gain compares values only. The Waivers tab runs a real swap through your schedule, opponents and daily lineup, which is the better guide before you make a move.'])}</section>`;
  return h}

/* ---------- the drill: one position ---------- */
function teamFocus(t,x,m){const P=m.P[x],c=m.T[t.id][x],mine=t.id===ME;
  const others=M.teams.filter(o=>o.id!==t.id).sort((a,b)=>m.T[b.id][x].sur-m.T[a.id][x].sur);
  const weakest=[...c.el].sort((a,b)=>a.value-b.value)[0]||null,fa=P.bestFA,gain=fa&&weakest?fa.value-weakest.value:null;
  // trade targets: above-replacement players at this position on the deepest other teams, skipping each team's best one there
  const targets=others.slice(0,4).flatMap(o=>m.T[o.id][x].el.slice(1).filter(p=>p.value>P.repl).map(p=>({p,o})))
    .sort((a,b)=>b.p.value-a.p.value).slice(0,4);
  let h=facts([fact(`${mine?'Your':'Their'} rank at ${x}`,`#${c.rank}`,`of 10 · ${V(c.sur)} above replacement`),
    fact('Eligible players',c.n,`${c.nAbove} above replacement${c.noData?` · ${c.noData} with no stats`:''}`),
    fact('In the full-slate lineup',c.inLineup,`of their ${m.perTeam} starters can play ${x}`),
    weakest?fact(`Weakest ${x}`,V(weakest.value),esc(weakest.name),'pv|'+weakest.name):fact(`Weakest ${x}`,'–','no eligible players')]);
  h+=c.el.length?CH.hbars(c.el.map(p=>{const v=p.value-P.repl;return {label:`${esc(p.name)}<small>${p.pos}</small>`,v,txt:V(v),cls:pn(v),stat:'pv|'+p.name,
      tip:`${p.name}: value ${V(p.value)}, ${V(v)} against ${x} replacement (${V(P.repl)}). #${P.rank.get(p.name)} of ${P.list.length} at ${x}.`}}),{center:true,stack:true,label:`${t.name} at ${x}, value over replacement`})
    +legend([['pos','Above replacement'],['neg','At or below it']])
    :`<div class="empty">${esc(t.name)} has no ${x}-eligible players with stats.</div>`;
  const moves=[];
  if(fa&&weakest&&gain>0)moves.push(`Swap ${plink(weakest)} (${V(weakest.value)}) for the best free-agent ${x}, ${plink(fa)} (${V(fa.value)}): ${sbtn('pv|'+fa.name,V(gain))} value.`);
  else if(fa&&weakest)moves.push(`No free agent at ${x} beats ${mine?'your':'their'} weakest ${x}; the best one, ${plink(fa)}, is ${V(fa.value)}.`);
  if(targets.length)moves.push(`Spare ${x}s on the deepest teams (not their best one there): ${targets.map(({p,o})=>`${sbtn('ptv|'+p.name,esc(p.name))} (${esc(o.abbr)}, ${V(p.value)})`).join(', ')}.`);
  if(moves.length)h+=`<ul class="h6-sum">${moves.map(s=>`<li>${s}</li>`).join('')}</ul>`;
  return drillSec(`${esc(t.name)} at ${x}`,`Each bar is one eligible player's value minus the ${x} replacement level (${V(P.repl)}). Tap a bar for the player's value breakdown.`,h)}

DRILL.pos=(X,tid)=>{const x=String(X||'').trim().toUpperCase();if(!POS.includes(x))return null;css();
  const m=model(),P=m.P[x],t=tid!=null&&String(tid).trim()!==''?tm(parseInt(tid,10)):null;
  if(tid!=null&&String(tid).trim()!==''&&!t)return null;
  const me=tm(ME),myC=m.T[ME][x],[tg,cl]=scarceTag(m)(x),lst=P.list;
  let h='';
  if(t)h+=teamFocus(t,x,m);
  h+=facts([fact('Start each day',P.N,`of ${m.nStart} league-wide starters can play ${x}`),
    fact('Above the starter line',P.above,P.short>0?`${P.short} short of the ${P.N} spots`:`${-P.short} to spare for ${P.N} spots`),
    P.rp?fact('Replacement level',V(P.repl),`${esc(P.rp.name)}, ${ord(P.ri+1)} at ${x}`,'pv|'+P.rp.name):fact('Replacement level','–',''),
    fact('Scarcity',`<span class="pill ${cl}" style="margin:0;font-size:.8rem">${tg}</span>`,`${V(P.premium)} vs the starter line (${V(m.line)})`),
    P.bestFA?fact('Best free agent',V(P.bestFA.value),esc(P.bestFA.name),'pv|'+P.bestFA.name):fact('Best free agent','–','none with stats'),
    t&&t.id===ME?'':fact(`Your rank at ${x}`,`#${myC.rank}`,`${V(myC.sur)} above replacement`,`pos|${x}|${ME}`)]);
  // value curve against the other positions at the same rank
  const otherAvg=lst.map((_,i)=>{const v=POS.filter(y=>y!==x&&m.P[y].list[i]).map(y=>m.P[y].list[i].value);return v.length?mean(v):null});
  const s2=otherAvg.map((v,i)=>v==null?null:[i+1,v]).filter(Boolean);
  const tips=[...curveTips(x,P),...s2.map(([r,v])=>`Other positions, #${r} on average: ${f1(v)}`)];
  h+=drillSec('Value by rank',`Every ${x}-eligible player, best first, against the average of the other four positions at the same rank. The dashed line is ${x} replacement level (${V(P.repl)}).`,
    lineChart([{name:PNAME[x],cls:'s1',pts:curvePts(x,P)},{name:'Other positions (average)',cls:'s2',pts:s2}],{h:phone()?300:200,ref:P.repl,xl:r=>'#'+r,fmt:v=>String(Math.round(v*10)/10),label:`${PNAME[x]} value by rank`},tips));
  // what the position brings
  const shape=CATS.map(c=>({c,v:P.shape[c.k]}));
  const plus=shape.filter(s=>s.v>=.15).sort((a,b)=>b.v-a.v).map(s=>s.c.l),minus=shape.filter(s=>s.v<=-.15).sort((a,b)=>a.v-b.v).map(s=>s.c.l);
  h+=drillSec('What this position brings',`The ${P.N} best ${x}-eligible players (the league's starting share) against the average starter, per game, in z-scores. ${plus.length?`They add ${list(plus)}`:'They add nothing special'}${minus.length?`; they cost ${list(minus)}`:''}. Tap a category for the league picture.`,
    CH.hbars(shape.map(s=>({label:s.c.l,v:s.v,txt:f2(s.v),cls:S.punt.has(s.c.k)?'mut':pn(s.v),stat:'lc|'+s.c.k,
      tip:`${s.c.n}: ${x} starters average ${f2(s.v)} z against the average starter${s.c.neg?' (fewer turnovers is better, so plus means fewer)':''}${S.punt.has(s.c.k)?'. You punt this one.':''}`})),{center:true,label:`${x} category shape`})
    +legend([['pos','Better than the average starter'],['neg','Worse'],...(S.punt.size?[['mut','Punted']]:[])]));
  // ranked list
  const cutAt=P.ri;
  h+=drillSec(`Every ${PONE[x]}, ranked`,`${lst.length} eligible: ${P.rostered} rostered, ${lst.length-P.rostered} free agents. Over repl. is value minus replacement (${V(P.repl)}). Your players are highlighted.`,
    `<div class="scroll tall"><table><thead><tr><th class="l stick" scope="col">Player</th><th class="l" scope="col">Team</th><th scope="col">Value</th><th scope="col">Over repl.</th><th scope="col">Trade value</th><th scope="col" title="Daily spots this player can fill">Spots</th></tr></thead><tbody>
    ${lst.map((p,i)=>`${i===cutAt+1?`<tr class="h6-cut"><td colspan="6">Replacement level: ${V(P.repl)} · the ${P.N} who would start are above</td></tr>`:''}<tr class="${p.team===ME?'me':''} ${t&&p.team===t.id&&t.id!==ME?'h6-foc':''}">
      <td class="l stick h6-name"><span class="h6-i">${i+1}</span>${plink(p)}${pills(p)}<small>${p.nba==='?'?'Unsigned':esc(p.nba)} · ${p.pos}</small></td>
      <td class="l">${p.team&&teamById[p.team]?`<button type="button" class="tlink" data-team="${p.team}">${abbr(p)}</button>`:'FA'}</td>
      <td class="num" ${sx('pv|'+p.name)}><b>${V(p.value)}</b></td><td class="num ${p.value-P.repl>0?'up':p.value-P.repl<0?'down':''}" ${sx('pv|'+p.name)}>${V(p.value-P.repl)}</td>
      <td class="num" ${sx('ptv|'+p.name)}>${p.tv!=null?p.tv.toFixed(0):'–'}</td><td class="num">${spotsOf(p).length}</td></tr>`).join('')}</tbody></table></div>`);
  // free agents
  const fas=P.fas.slice(0,5),myW=me.roster.filter(p=>p.value!=null&&elig(p,x)).sort((a,b)=>a.value-b.value)[0]||null;
  h+=drillSec(`Best free agents at ${x}`,fas.length?`Each free agent's value against ${x} replacement. ${myW?`Your weakest ${x} is ${plink(myW)} (${V(myW.value)}).`:`You have no ${x}-eligible players.`}`:'',
    fas.length?CH.hbars(fas.map(p=>{const v=p.value-P.repl,beats=lst.filter(q=>q.team&&q.value<p.value).length;return {label:`${esc(p.name)}<small>${p.pos}</small>`,v,txt:V(v),cls:pn(v),stat:'pv|'+p.name,
      tip:`${p.name}: value ${V(p.value)}, better than ${beats} of ${P.rostered} rostered ${x}s${myW?`; ${V(p.value-myW.value)} against your ${myW.name}`:''}`}}),{center:true,stack:true,label:`Best free agents at ${x}`})
      :`<div class="empty">No free agent eligible at ${x} has stats right now.</div>`);
  // teams
  const ts=[...M.teams].sort((a,b)=>m.T[b.id][x].sur-m.T[a.id][x].sur),thin=ts.slice(-3).reverse(),deepT=ts[0];
  h+=drillSec('Deep and thin teams',`Value above ${x} replacement, added up over each team's eligible players. Thinnest: ${list(thin.map(o=>`${tlink(o)} (${V(m.T[o.id][x].sur)}, ${plural(m.T[o.id][x].nAbove,'player')} above)`))}. Deepest: ${tlink(deepT)}. Tap a team for its ${x} group.`,
    CH.hbars(ts.map(o=>{const c=m.T[o.id][x];return {label:`${esc(o.name)}<small>${c.n} eligible</small>`,v:c.sur,txt:c.sur.toFixed(1),hi:t&&o.id===t.id,me:o.id===ME&&!(t&&o.id===t.id),stat:`pos|${x}|${o.id}`,
      tip:`${o.name}: ${plural(c.n,'eligible player')}, ${c.nAbove} above replacement, ${V(c.sur)} in all, #${c.rank} of 10`}}),{stack:true,label:`Teams at ${x}`})
    +legend([...(t?[['hi',esc(t.abbr)]]:[]),...(!t||t.id!==ME?[['me','Your team']]:[]),['mut','Other teams']]));
  h+=how([`Replacement level is the value of the ${ord(Math.max(1,P.N))}-best ${x}-eligible player, rostered or free agent, because ${P.N} of the league's ${m.nStart} daily starters can play ${x}. That count comes from filling every team's lineup (PG, SG, SF, PF, C, G, F and four UTIL) for a day when all of its healthy players have games, best players first. Multi-position players count at every position they can play.`,
    `The starter line is the ${ord(m.nStart)}-best player overall (${V(m.line)}). A position whose replacement sits below it is scarce: the league has to dig deeper there than anywhere else. Values follow your build (${S.punt.size?'punts left out, ':''}${per()}); free agents use their 2025-26 stats, so their numbers are a little less certain.`]);
  return {eyebrow:`Position · ${x}${t?' · '+esc(t.name):''}`,title:PNAME[x],back:x+(t?' · '+t.abbr:''),
    sub:`${P.rostered} rostered and ${lst.length-P.rostered} free agents eligible. Replacement level ${V(P.repl)}; ${tg.toLowerCase()} of the five positions.`,html:h}};

/* ---------- registration ---------- */
HUB.push({k:'pos',label:'Positions',order:60,note:'Positional scarcity: how deep each position runs, where replacement level sits, and which teams are thin where.',render:vPos});
CMDS.push({label:'Positional scarcity',sub:'Stats lab: replacement level, value curves and team strength by position',kw:'positions position scarcity replacement depth thin guard forward center',tag:'Stats',act:()=>go('stats',{hub:'pos'})});
POS.forEach(x=>CMDS.push({label:`${PNAME[x]} (${x})`,sub:'Ranked by value, replacement level, best free agents, thin teams',kw:`${x} position ${PONE[x]} scarcity`,tag:'Drill',act:()=>openStat('pos|'+x)}));
CMDS.push({label:'My team by position',sub:'Where your roster is deep or thin',kw:'my team position depth thin weakest position',tag:'Drill',act:()=>{const m=model(),o=m.T[ME],x=[...POS].sort((a,b)=>o[b].rank-o[a].rank)[0];openStat('pos|'+x+'|'+ME)}});
})();

</script>
<script>
(async()=>{try{if(!window.claude||typeof window.claude.use!=='function')return;
  const u=await window.claude.use('user').catch(()=>null);if(u){try{CAN_SHARE=await u.canEdit()}catch(e){}}
  const db=await window.claude.use('db');if(!db)return;DB=db;
  db.doc('shared/ros').onSnapshot(s=>{if(s.exists){ROS=s.data();ROS_SHARED=true}else if(ROS_SHARED){ROS=store.get('ros',null);ROS_SHARED=false}else return;
    applyRos();recompute();render()},()=>{})}catch(e){}})();

/* ---------- boot ---------- */
document.getElementById('sub').textContent=`ESPN league 99907173 · ${updStr()}`;
readHash();recompute();try{SINCE=sinceLast()}catch(e){SINCE=null}render();
</script>
