    ${how(['Percentiles rank per-game z-scores (shooting by impact: percentage above league average times attempts) against every rostered player; TO counts fewer as better. Value ranks follow your build\'s punts; trade value ignores them.','Similar players are the nearest neighbours across all nine per-game z-scores, rostered or free agent. The line under each name says where they differ most.'])}</div>`});
})();

</script>
<script>/* module: d_team.js */
/* d_team.js: team drill-downs.
   tc|id|cat    one team in one category      tval|id   team value and grade     tpr|id   power rank breakdown
   tpo|id       playoff odds                  trec|id   category record vs field tgm|id   games by week
   h2h|a|b      roster against roster, category by category, with the players driving each edge and their real weeks
   Registers only; every computation runs at render time. Shared helpers go on window.LAB (catGap, h2hEdges, tprParts). */
(()=>{
const LAB=window.LAB=window.LAB||{};

/* ---------- small helpers ---------- */
const SEA=()=>S.mode==='season';
const per=()=>SEA()?'over the season':'a game';
const mult=p=>SEA()?(p.gp||0):1;
const pv=(p,key)=>p&&p.pg?(+p.pg[key]||0)*mult(p):0;           // a player's number, per game or season (S.mode)
const TM=id=>{const n=parseInt(id,10);return Number.isFinite(n)?(tm(n)||null):null};
const CT=k=>catOf(String(k||'').toLowerCase())||null;
const dp=()=>SEA()?0:1;
const fv=(c,v)=>v==null||!isFinite(v)?'–':c.pct?f3(v):v.toFixed(dp());
const up=(x,d)=>{const m=Math.pow(10,d);return Math.ceil(x*m-1e-9)/m};  // round up, so "passes" really passes
const nf=(x,d)=>x.toFixed(d);
const NOUN={pts:'PTS',reb:'REB',ast:'AST',stl:'STL',blk:'BLK',to:'TO',fg:'made field goals',ft:'made free throws',tp:'made threes'};
const ATT={fg:'FGA',ft:'FTA',tp:'3PA'};
const back=s=>`<span hidden> · ${s}</span>`;                       // extra words for the Back button label only
const lastName=n=>{const w=String(n).split(' ');return w.length>1?w.slice(1).join(' '):String(n)};
const done=w=>!!(PER[w]&&PER[w][PER[w].length-1]<todaySP);
const left=()=>WEEKS.filter(w=>w<=REGW&&w>=Math.max(1,curWeek));     // the weeks the season sim still plays
const hasRec=t=>!!(t.record&&(t.record.w+t.record.l+t.record.t)>0);
const meetings=(a,b)=>DATA.schedule.filter(m=>(m[1]===a&&m[2]===b)||(m[1]===b&&m[2]===a)).map(m=>m[0]).sort((x,y)=>x-y);
const byCat=k=>[...M.teams].sort((a,b)=>a.catRank[k]-b.catRank[k]);
const tlink=(t,txt)=>`<button type="button" class="tlink" data-team="${t.id}">${txt??esc(t.name)}</button>`;
const wkShort=w=>w>REGW?'P'+(w-REGW):'W'+w;
const legend=items=>`<div class="legend">${items.map(([cls,l,st])=>`<span><i class="${cls}"${st?` style="${st}"`:''}></i>${l}</span>`).join('')}</div>`;
const facts=a=>`<div class="facts">${a.join('')}</div>`;
const pctOf=(a,b)=>b?Math.round(a/b*100)+'%':'–';
// two values that would print the same get one more decimal, so a near tie still shows who leads
const fvPair=(c,a,b)=>{const x=fv(c,a),y=fv(c,b);if(x!==y||!c.pct)return [x,y];const g=v=>v.toFixed(4).replace(/^0/,'');return [g(a),g(b)]};
// colour for a signed bar, set explicitly so a chart with no negative values keeps its meaning
const pn=v=>v==null||!isFinite(v)||Math.abs(v)<1e-9?'mut':v>0?'pos':'neg';
const listOr=a=>a.length<2?a.join(''):a.slice(0,-1).join(', ')+' or '+a[a.length-1];

// rank of a hypothetical line among the other nine teams in one category
const rankAs=(line,id,k)=>ranksOf(line,id)[k];
// phone layout: bar charts whose labels are names put the label on its own line (layout only, theme tokens untouched)
function css(){if(document.getElementById('dteam-css'))return;const s=document.createElement('style');s.id='dteam-css';
  s.textContent='.dt-tight th,.dt-tight td{padding-left:6px;padding-right:6px}@media (min-width:561px){.dt-stack .hb-r{grid-template-columns:minmax(0,13.5em) minmax(0,1fr) 4.6em}}@media (max-width:560px){.dt-stack .hb-r{grid-template-columns:minmax(0,1fr) 4.2em;row-gap:2px}.dt-stack .hb-l{grid-column:1/-1}}';document.head.appendChild(s)}
const stack=html=>`<div class="dt-stack">${html}</div>`;
// a compact player cell for drill tables (the whole row opens a drill)
const ncell=(p,sub)=>`<td class="l stick" style="white-space:normal;min-width:7.5em;max-width:12em"><b style="font-weight:600">${esc(p.name)}</b>${pills(p)}<small style="display:block;color:var(--muted);font-size:.74rem">${sub}</small></td>`;
const psub=p=>`${p.nba==='?'?'Unsigned':esc(p.nba)} · ${p.pos}`;
// a 3px share bar under a number
const micro=f=>`<div style="height:3px;border-radius:2px;background:var(--soft);margin-top:4px;min-width:34px"><div style="height:3px;border-radius:2px;background:var(--accent);width:${Math.max(0,Math.min(100,f*100)).toFixed(0)}%"></div></div>`;

/* ---------- gaps: how much of a stat passes the team above, and the cushion over the team below ---------- */
function sums(t,c){const ro=t.roster.filter(p=>p.pg);return c.pct?{m:ro.reduce((s,p)=>s+pv(p,c.pct[0]),0),a:ro.reduce((s,p)=>s+pv(p,c.pct[1]),0)}:null}
// amount t needs to draw level with o: >0 means o is ahead. Counting stats in the stat's own units (fewer, for TO);
// percentages in made shots at the same attempts.
function needVs(t,o,c){if(c.pct){const s=sums(t,c);return o.line[c.k]*s.a-s.m}
  return c.neg?t.line[c.k]-o.line[c.k]:o.line[c.k]-t.line[c.k]}
const avgPlayer=c=>memo('dteam|avgp|'+c.k+'|'+S.mode,()=>mean(M.players.filter(p=>p.pg).map(p=>pv(p,c.pct?c.pct[0]:c.k))));
function catGap(id,k){const t=TM(id),c=CT(k);if(!t||!c)return null;const s=byCat(c.k),r=t.catRank[c.k],ab=s[r-2]||null,be=s[r]||null;
  return {rank:r,above:ab?{id:ab.id,need:needVs(t,ab,c)}:null,below:be?{id:be.id,cushion:-needVs(t,be,c)}:null}}
LAB.catGap=catGap;
function passTxt(c,need){const x=up(Math.max(need,0),c.pct?1:dp());
  if(c.pct)return `${nf(x,1)} more ${NOUN[c.k]} ${per()}`;
  return c.neg?`${nf(x,dp())} fewer TO ${per()}`:`+${nf(x,dp())} ${c.l} ${per()}`}
function cushTxt(c,cu){const x=Math.max(cu,0),d=x>0&&x<.1&&!SEA()?2:c.pct?1:dp();return c.pct?`${nf(x,d)} ${NOUN[c.k]} ${per()}`:`${nf(x,d)} ${c.l} ${per()}`}

/* ---------- roster contributions in one category ---------- */
// the average rostered player's numbers (per game, or per season in season mode)
const avgLine=()=>memo('dteam|avgline|'+S.mode,()=>{const q=M.players.filter(p=>p.pg),o={};KEYS.forEach(k=>o[k]=mean(q.map(p=>pv(p,k))));return o});
// the team's rank in a category if one player were swapped for an average rostered player: isolates what that player adds
function rankIfAvg(t,c,p){const A=avgLine();let v;
  if(c.pct){const s=sums(t,c),[mk,ak]=c.pct,den=s.a-pv(p,ak)+A[ak];v=den?(s.m-pv(p,mk)+A[mk])/den:0}
  else v=t.line[c.k]-pv(p,c.k)+A[c.k];
  return 1+M.teams.filter(o=>o.id!==t.id&&better(c,o.line[c.k],v)).length}
function contrib(t,c,noRank){const ro=t.roster.filter(p=>p.pg),tot=t.line[c.k],s=c.pct?sums(t,c):null;
  return ro.map(p=>{const ifAvg=noRank?null:rankIfAvg(t,c,p);
    if(c.pct){const m=pv(p,c.pct[0]),a=pv(p,c.pct[1]);return {p,v:a?m/a:null,m,a,share:s.a?a/s.a:0,imp:a?(m/a-M.lg[c.k])*a:0,ifAvg}}
    const v=pv(p,c.k);return {p,v,share:tot?v/tot:0,ifAvg}})
  .sort((x,y)=>c.pct?y.imp-x.imp:y.v-x.v)}
// the players on a roster who matter most in a category (for TO: the ones who commit the most)
function drivers(t,c,n){return contrib(t,c,true).slice(0,n)}

/* ---------- the clickable category strip (current category ringed) ---------- */
const catNav=(t,cur,type)=>`<div class="rkstrip" role="group" aria-label="Categories">${CATS.map(c=>{const r=t.catRank[c.k],on=c.k===cur;
  return `<button type="button" class="rkc ${rc(r)} ${S.punt.has(c.k)?'punted':''}" data-stat="${esc(type+'|'+t.id+'|'+c.k)}" ${on?'aria-current="true"':''} data-tip="${esc(c.n+': rank '+r+' of 10')}" style="border:0;cursor:pointer;${on?'box-shadow:inset 0 0 0 2px var(--accent)':''}"><span>${c.l}</span><b>#${r}</b></button>`}).join('')}</div>`;

/* =====================================================================================
   tc|<teamId>|<cat>: one team in one category
   ===================================================================================== */
DRILL.tc=(id,k)=>{const t=TM(id),c=CT(k);if(!t||!c)return null;css();
  const K=c.k,r=t.catRank[K],sorted=byCat(K),ab=sorted[r-2]||null,be=sorted[r]||null,avg=mean(M.teams.map(x=>x.line[K]));
  const me=t.id===ME,punted=me&&S.punt.has(K),unit=c.pct?'':` ${c.l}`;
  const diff=c.neg?avg-t.line[K]:t.line[K]-avg;   // >0 better than average
  const diffTxt=`${diff>=0?'+':'−'}${c.pct?f3(Math.abs(diff)):nf(Math.abs(diff),dp())}`;
  // this week's chance in the category and the average over the weeks left
  const w=Math.min(curWeek,REGW),opp=curWeek<=REGW?oppOf(t.id,w):null,o=opp!=null?mp(t.id,opp,w):null;
  const lw=left().map(x=>{const op=oppOf(t.id,x);return op==null?null:mp(t.id,op,x).p[K]}).filter(x=>x!=null),avgP=lw.length?mean(lw):null;
  let h=catNav(t,K,'tc');
  h+=facts([
    fact(`Team total, ${per()}`,fv(c,t.line[K]),`#${r} of 10 in ${c.l}`,'lc|'+K),
    fact('Against the average',diffTxt,`League average ${fv(c,avg)}${c.neg?' (fewer is better)':''}`),
    fact('Teams beaten',`${10-r} of 9`,'Roster against roster','trec|'+t.id),
    fact('Category z',f1(t.catZ[K]),'Summed player z-scores','tval|'+t.id),
    o?fact(`${weekName(w)} chance`,pc(o.p[K]),`vs ${esc(teamById[opp].name)}`,`mc|${t.id}|${opp}|${w}|${K}`):'',
    avgP!=null?fact('Average weekly chance',pc(avgP),`Over the ${lw.length} week${lw.length===1?'':'s'} left`):''].filter(Boolean));
  if(punted)h+=`<p class="note">You are punting ${c.n.toLowerCase()}, so it is left out of your player values. Matchups still count it.</p>`;

  // gaps above and below, in plain numbers
  const avgP1=avgPlayer(c),gapLi=[];
  const ppTxt=o=>{const x=Math.abs(o.line[K]-t.line[K])*100;return `${x<.1?nf(x,2):nf(x,1)} percentage points`};
  if(ab){const need=needVs(t,ab,c);
    const ctx=c.pct?` That is ${ppTxt(ab)} of ${c.l}, at the same attempts.`:avgP1?` That is about ${pctOf(Math.max(need,0),avgP1)} of ${c.neg?'an average rostered player\'s turnovers':'what an average rostered player adds'}.`:'';
    gapLi.push(['move',`${passTxt(c,need)} passes ${esc(ab.name)}`,`They are #${r-1} at ${fv(c,ab.line[K])}.${ctx}`,`h2h|${t.id}|${ab.id}`])}
  if(r>2){const top=sorted[0],need=needVs(t,top,c);gapLi.push(['info',`${passTxt(c,need)} catches ${esc(top.name)} for #1`,`They lead the league at ${fv(c,top.line[K])}${c.pct?`, ${ppTxt(top)} ahead`:''}.`,`tc|${top.id}|${K}`])}
  if(be){const cu=-needVs(t,be,c);gapLi.push(['warn',`A cushion of ${cushTxt(c,cu)} over ${esc(be.name)}`,`They are #${r+1} at ${fv(c,be.line[K])}. Lose that much and they pass ${me?'you':'this team'}.`,`h2h|${t.id}|${be.id}`])}
  if(!ab)gapLi.unshift(['move','First in the league','Nobody is ahead in this category.','']);
  h+=drillSec('The race around them',`Plain-number gaps to the teams just above and below${c.pct?', counted in made shots at the same number of attempts':''}.`,
    `<ul class="todo">${gapLi.map(([cls,a,b,st])=>`<li class="${cls}"><span class="dot" aria-hidden="true"></span><div><b>${a}</b><p>${b}</p></div>${st?`<div class="act"><button type="button" class="btn sm ghost" data-stat="${esc(st)}">${st.startsWith('h2h')?'Head to head':'Their breakdown'}</button></div>`:''}</li>`).join('')}</ul>`);

  // all ten teams, centred on the league average
  const rows=sorted.map(x=>{const d=c.neg?avg-x.line[K]:x.line[K]-avg,hi=x.id===t.id,mine=x.id===ME&&!hi;
    return {label:`${esc(x.name)}`,v:c.pct?d*100:d,txt:fv(c,x.line[K]),hi,me:mine,cls:hi||mine?undefined:'mut',stat:`tc|${x.id}|${K}`,
      tip:`#${x.catRank[K]} ${x.name}: ${fv(c,x.line[K])}${unit} ${per()}, ${c.pct?f3(Math.abs(d)):nf(Math.abs(d),dp())} ${d>=0?'better':'worse'} than average`}});
  h+=drillSec('All ten teams',`Bars show the distance from the league average of ${fv(c,avg)}; right of the line is better${c.neg?' (fewer turnovers)':''}. The number is the team total. Tap a team for its own breakdown.`,
    stack(CH.hbars(rows,{label:`${c.n} by team`}))+legend([['hi',esc(t.name)],...(me?[]:[['me','Your team']]),['mut','Other teams']]));

  // every roster player's part
  const con=contrib(t,c),noData=t.roster.filter(p=>!p.pg);
  const rk=x=>{const d=x.ifAvg-r;return `<td class="num ${d>0?'down':d<0?'up':''}">${d?`#${x.ifAvg}`:'same'}</td>`};
  const carry=con.filter(x=>x.ifAvg>r),drag=con.filter(x=>x.ifAvg<r);
  const thW=`<th scope="col" title="The team's rank in ${c.l} if this player were swapped for an average rostered player (now #${r})">If average</th>`;
  let tb;
  if(c.pct){const s=sums(t,c);
    tb=`<div class="scroll dt-tight"><table><thead><tr><th class="l stick" scope="col">Player</th><th scope="col" title="Their ${c.l} and attempts ${per()}">${c.l}</th><th scope="col" title="Made shots above or below what a league-average shooter makes on the same attempts, and their share of the team's attempts">Impact</th>${thW}</tr></thead><tbody>
      ${con.map(x=>`<tr class="click" data-stat="${esc('pc|'+x.p.name+'|'+K)}" tabindex="0">${ncell(x.p,psub(x.p))}<td class="num"><b>${x.v==null?'–':f3(x.v)}</b><span class="rk">${nf(x.a,dp())} ${ATT[K]}</span></td><td class="num"><span class="${x.imp>0.05?'up':x.imp<-0.05?'down':''}" style="color:var(${x.imp>0.05?'--pos-fg':x.imp<-0.05?'--neg-fg':'--ink'})">${(x.imp>=0?'+':'−')+nf(Math.abs(x.imp),SEA()?0:2)}</span><span class="rk">${pc(x.share)} of ${ATT[K]}</span></td>${rk(x)}</tr>`).join('')}</tbody></table></div>`;
    h+=drillSec('Who makes the percentage',`The roster shoots ${f3(t.line[K])} on ${nf(s.a,dp())} ${ATT[K]} ${per()} (every player's attempts added up). Impact is made shots above or below a league-average shooter (${f3(M.lg[K])}) on the same attempts, so volume counts. "If average" is the team's rank if that player were swapped for an average rostered player (now #${r}). Tap a player for their breakdown.`,tb)}
  else{tb=`<div class="scroll dt-tight"><table><thead><tr><th class="l stick" scope="col">Player</th><th scope="col">${c.l}${SEA()?'':' / g'}</th><th scope="col">Share</th>${thW}</tr></thead><tbody>
      ${con.map(x=>`<tr class="click" data-stat="${esc('pc|'+x.p.name+'|'+K)}" tabindex="0">${ncell(x.p,psub(x.p))}<td class="num"><b>${nf(x.v,dp())}</b></td><td class="num">${pc(x.share)}${micro(x.share/.25)}</td>${rk(x)}</tr>`).join('')}</tbody></table></div>`;
    h+=drillSec(c.neg?'Who commits them':'Who produces it',`Each player's ${c.n.toLowerCase()} ${per()} and their share of the team's ${fv(c,t.line[K])} (the bar fills at 25%). "If average" is the team's rank if that player were swapped for an average rostered player (now #${r}): red means they carry the team here, green means they hold it back. Tap a player for their breakdown.`,tb)}
  const nm=a=>listOr(a.slice(0,3).map(x=>esc(x.p.name)))+(a.length>3?` (and ${a.length-3} more)`:'');
  h+=`<p class="note">${carry.length?`${nm(carry)} ${carry.length===1?'carries':'carry'} the team in ${c.l}: swap ${carry.length===1?'them':'any one of them'} for an average player and the rank drops.`:`No single player carries the team in ${c.l}: swapping any one for an average player leaves the rank at #${r} or better.`}${drag.length?` ${nm(drag)} ${drag.length===1?'holds':'hold'} it back${c.neg?' with more turnovers than average':c.pct?' by shooting below league average on real volume':''}.`:''}</p>`;
  if(noData.length)h+=`<p class="note">No projection yet for ${noData.map(p=>esc(p.name)).join(', ')}; they count as zero.</p>`;

  // best free agents for this category, run through the roster
  const drop=dropDefault(t.id),kept=t.roster.filter(p=>p.pg&&p.name!==drop);
  const fas=M.fas.filter(f=>f.pg&&f.zpg&&f.zpg[K]!=null).sort((a,b)=>b.zpg[K]-a.zpg[K]).slice(0,6).map(f=>({f,nr:rankAs(lineOf([...kept,f]),t.id,K)}));
  if(fas.length){const fcell=f=>c.pct?`<b>${f3(catV(f.pg,c))}</b><span class="rk">${nf(f.pg[c.pct[1]],1)} ${ATT[K]}</span>`:`<b>${nf(f.pg[K],1)}</b>`;
    h+=drillSec('Best free agents for it',`Ranked by their z-score in ${c.l} (the shading). "If added" swaps them in for ${drop==='none'?'nobody':esc(drop)}, ${me?'your':'the team\'s'} lowest-value player, and re-ranks the team (now #${r}). Value is their overall value. Free agents use 2025-26 per-game stats.`,
      `<div class="scroll dt-tight"><table><thead><tr><th class="l stick" scope="col">Player</th><th scope="col">${c.l}</th><th scope="col">If added</th><th scope="col">Value</th></tr></thead><tbody>
      ${fas.map(({f,nr})=>{const d=r-nr;return `<tr class="click" data-stat="${esc('pc|'+f.name+'|'+K)}" tabindex="0">${ncell(f,psub(f))}<td class="z ${zc(f.zpg[K])}" data-tip="${esc(`${f.name}: z ${f1(f.zpg[K])} in ${c.l}`)}">${fcell(f)}</td><td class="num ${d>0?'up':d<0?'down':''}">${d?`#${nr}`:'same'}</td><td class="num">${f.value==null?'–':f1(f.value)}</td></tr>`}).join('')}</tbody></table></div>`)}
  h+=`<div class="filters">${sbtn('lc|'+K,`The whole league in ${c.l}`,'linkbtn')}${sbtn('trec|'+t.id,'Category record vs the field','linkbtn')}</div>`;
  h+=how([`The team total adds up every rostered player's ${SEA()?'projected season':'per-game'} numbers (${c.pct?`made ${ATT[K].slice(0,-1)} divided by attempted, so high-volume shooters move it most`:'a roster-wide total, not one night\'s box score'}). This is how the board compares rosters head to head; the weekly matchup model adds the real NBA schedule and the 11-starter daily limit on top.`,
    `Gaps are the plain difference between the two team totals${c.pct?', turned into made shots: how many more makes, at the same attempts, would lift the percentage past the other team':''}, rounded up so the number shown really passes. Other teams are held fixed, which is assumed.`,
    '"If average" swaps one player for an average rostered player (the league-wide mean in every stat) and re-ranks the team, which isolates what that player adds; removing a player outright would mostly measure roster size, since every player adds to a counting total. "If added" swaps the free agent in for the lowest-value player on the roster; the other categories move too, so check the player\'s full value before adding them.',
    'Weekly chances come from the matchup model: projected totals for that week and how much the category usually swings.'] );
  return {eyebrow:esc(t.name),title:`${c.n}${back(esc(t.abbr))}`,sub:`#${r} of 10 · ${fv(c,t.line[K])}${unit} ${per()}${punted?' · punted':''}`,html:h}};

/* =====================================================================================
   tval|<teamId>: team value and grade
   ===================================================================================== */
const POS=['PG','SG','SF','PF','C'];
const posVal=()=>memo('dteam|pos',()=>{const o={};M.teams.forEach(t=>{const v={},n={};POS.forEach(x=>{v[x]=0;n[x]=0});
  t.roster.filter(p=>p.value!=null).forEach(p=>{const ps=p.pos.split('/').filter(x=>POS.includes(x));ps.forEach(x=>{v[x]+=p.value/ps.length;n[x]+=1})});o[t.id]={v,n}});
  const avg={},rank={};POS.forEach(x=>{avg[x]=mean(M.teams.map(t=>o[t.id].v[x]));const s=[...M.teams].sort((a,b)=>o[b.id].v[x]-o[a.id].v[x]);s.forEach((t,i)=>{(rank[t.id]=rank[t.id]||{})[x]=i+1})});
  return {o,avg,rank}});
const stars=()=>memo('dteam|stars',()=>{const o={};M.teams.forEach(t=>{const tv=t.roster.map(p=>p.tv||0).sort((a,b)=>b-a),sum=tv.reduce((s,x)=>s+x,0);
  o[t.id]={share:sum?(tv[0]+(tv[1]||0)+(tv[2]||0))/sum:0,solid:tv.filter(x=>x>=30).length,sum}});return o});
DRILL.tval=id=>{const t=TM(id);if(!t)return null;css();
  const byV=[...M.teams].sort((a,b)=>b.value-a.value),vr=byV.indexOf(t)+1,nvr=[...M.teams].sort((a,b)=>b.nv-a.nv).indexOf(t)+1,tvr=[...M.teams].sort((a,b)=>b.tvSum-a.tvSum).indexOf(t)+1;
  const st=stars(),my=st[t.id],avgShare=mean(M.teams.map(x=>st[x.id].share)),avgSolid=mean(M.teams.map(x=>st[x.id].solid));
  const punts=[...S.punt].map(k=>catOf(k).l);
  let h=facts([
    fact('Value, your build',f1(t.value),`#${vr} of 10${punts.length?' · without '+punts.join(', '):''}`),
    punts.length?fact('Value, all nine',f1(t.nv),`#${nvr} of 10`):'',
    fact('Grade',t.grade,`From the power score · #${t.pr}`,'tpr|'+t.id),
    fact('Trade value, total',t.tvSum.toFixed(0),`#${tvr} of 10 · league avg ${mean(M.teams.map(x=>x.tvSum)).toFixed(0)}`),
    fact('Top three share',pc(my.share),`League average ${pc(avgShare)}`),
    fact('Solid starters or better',String(my.solid),`Trade value 30+ · avg ${avgSolid.toFixed(1)}`),
    ...(punts.length?[]:(()=>{const b=[...t.roster].filter(p=>p.value!=null).sort((x,y)=>y.value-x.value)[0];return b?[fact('Most valuable',esc(lastName(b.name)),`${esc(b.name)} · ${f1(b.value)}`,'pv|'+b.name)]:[]})())].filter(Boolean));

  const ro=[...t.roster].sort((a,b)=>(b.value??-99)-(a.value??-99));
  h+=drillSec('Value by player',`Each player's value (summed z-scores${punts.length?' without your punts':''}, ${SEA()?'scaled by games played':'per game'}). Right of the line helps. Tap a player to see where it comes from.`,
    stack(CH.hbars(ro.map(p=>({label:`${esc(p.name)}<small>${p.pos}</small>`,v:p.value,txt:p.value==null?'No data':f1(p.value),cls:pn(p.value),stat:'pv|'+p.name,
      tip:`${p.name}: value ${p.value==null?'none':f1(p.value)}${p.rank?', #'+p.rank+' of '+M.players.length+' rostered':''}, trade value ${p.tv.toFixed(0)}`})),{label:'Value by player'})));

  const srt=[...M.teams].sort((a,b)=>st[b.id].share-st[a.id].share);
  h+=drillSec('Stars or depth',`Share of each team's total trade value held by its three most valuable players. High means a star-led roster; low means value spread through the depth chart.`,
    stack(CH.hbars(srt.map(x=>{const hi=x.id===t.id,mine=x.id===ME&&!hi;return {label:esc(x.name),v:st[x.id].share,txt:pc(st[x.id].share),hi,me:mine,cls:hi||mine?undefined:'mut',stat:'tval|'+x.id,
      tip:`${x.name}: top three hold ${pc(st[x.id].share)} of ${st[x.id].sum.toFixed(0)} trade value; ${st[x.id].solid} players at 30+`}}),{label:'Top three share by team',max:1}))+legend([['hi',esc(t.name)],...(t.id===ME?[]:[['me','Your team']]),['mut','Other teams']]));

  const P=posVal(),pvT=P.o[t.id];
  h+=drillSec('Value by position',`Value from the players eligible at each spot (a multi-position player's value is split evenly), shown as the difference from the league-average team. The small number is the league rank. Tap a position for scarcity across the league.`,
    CH.hbars(POS.map(x=>({label:`${x}<small>#${P.rank[t.id][x]}</small>`,v:pvT.v[x]-P.avg[x],txt:f1(pvT.v[x]-P.avg[x]),cls:pn(pvT.v[x]-P.avg[x]),stat:'pos|'+x,
      tip:`${x}: ${f1(pvT.v[x])} value from ${pvT.n[x]} eligible player${pvT.n[x]===1?'':'s'}, league average ${f1(P.avg[x])}, rank #${P.rank[t.id][x]}`})),{label:'Value by position vs average'}));

  h+=drillSec('Category z totals',`Summed z-scores by category, with the league rank. ${punts.length?'Punted categories are grey. ':''}Tap one to see the players behind it.`,
    CH.hbars(CATS.map(c=>({label:`${c.l}<small>#${t.catRank[c.k]}</small>`,v:t.catZ[c.k],txt:f1(t.catZ[c.k]),cls:S.punt.has(c.k)?'mut':pn(t.catZ[c.k]),stat:`tc|${t.id}|${c.k}`,
      tip:`${c.n}: z ${f1(t.catZ[c.k])}, rank #${t.catRank[c.k]}, team total ${fv(c,t.line[c.k])} ${per()}`})),{label:'Category z totals'}));
  h+=how([`A player's value adds up their z-scores: how far above or below an average rostered player they are in each category, in standard deviations, with turnovers flipped so fewer is better and the percentages weighted by attempts. Team value is the sum over the roster${punts.length?', leaving out the categories you punt':''}.`,
    'Trade value (0 to 100) is the league-wide chart from the Trades tab: it ignores punts and blends the model with draft slot'+(BLEND.hasRos?' and rest-of-season rank':'')+'. Top three share and the 30+ count use it because it is never negative.',
    'The grade comes from the power score, not value alone: A is a score of 0.9 or more, B+ 0.35, B −0.3, C+ −0.9, C below that. See the power rank breakdown for the score.']);
  return {eyebrow:esc(t.name),title:`Team value${back(esc(t.abbr))}`,sub:`Value ${f1(t.value)} (#${vr} of 10) · grade ${t.grade} · ${t.count} players`,html:h}};

/* =====================================================================================
   tpr|<teamId>: power rank breakdown
   ===================================================================================== */
function tprParts(){return memo('dteam|tpr',()=>{const ts=M.teams,zs=a=>{const m=mean(a),s=sdev(a);return {z:a.map(x=>(x-m)/s),m,s}};
  const V=zs(ts.map(t=>t.nv)),R=zs(ts.map(t=>t.rr)),played=ts.some(hasRec),alpha=played?weeksDone/(weeksDone+3):0;
  const wp=ts.map(t=>{const r=t.record||{w:0,l:0,t:0},n=r.w+r.l+r.t;return n?(r.w+r.t/2)/n:.5}),A=played?zs(wp):{z:ts.map(()=>0),m:.5,s:1};
  const o={};ts.forEach((t,i)=>o[t.id]={v:(1-alpha)*V.z[i]/3,r:(1-alpha)*R.z[i]*2/3,a:alpha*A.z[i],wp:wp[i],score:t.score});
  const rrRank={},nvRank={};[...ts].sort((a,b)=>b.rr-a.rr).forEach((t,i)=>rrRank[t.id]=i+1);[...ts].sort((a,b)=>b.nv-a.nv).forEach((t,i)=>nvRank[t.id]=i+1);
  return {o,alpha,V,R,A,played,rrRank,nvRank}})}
LAB.tprParts=tprParts;
DRILL.tpr=id=>{const t=TM(id);if(!t)return null;css();
  const P=tprParts(),me=P.o[t.id],al=P.alpha,ts=[...M.teams].sort((a,b)=>a.pr-b.pr),ab=ts[t.pr-2]||null,be=ts[t.pr]||null;
  let h=facts([
    fact('Power rank',`#${t.pr}`,`Score ${f2(t.score)} · grade ${t.grade}`),
    fact('Weekly strength',t.rr.toFixed(2),`Categories won in an average week · #${P.rrRank[t.id]}`,'trec|'+t.id),
    fact('Roster value',f1(t.nv),`All nine categories · #${P.nvRank[t.id]}`,'tval|'+t.id),
    fact('Real results weight',pc(al),P.played?`${weeksDone} week${weeksDone===1?'':'s'} played`:'No games yet')]);
  h+=drillSec('What the score is made of',`Each part is the team's distance from the league average in standard deviations, times its weight. They add up to the score of ${f2(t.score)}.`,
    stack(CH.hbars([
      {label:`Weekly strength <small>×${(2/3*(1-al)).toFixed(2)}</small>`,v:me.r,txt:f2(me.r),cls:pn(me.r),stat:'trec|'+t.id,tip:`${t.rr.toFixed(2)} categories a week vs a league average of ${P.R.m.toFixed(2)}`},
      {label:`Roster value <small>×${(1/3*(1-al)).toFixed(2)}</small>`,v:me.v,txt:f2(me.v),cls:pn(me.v),stat:'tval|'+t.id,tip:`Roster value ${f1(t.nv)} vs a league average of ${f1(P.V.m)}`},
      {label:`Real record <small>×${al.toFixed(2)}</small>`,v:me.a,txt:f2(me.a),cls:pn(me.a),stat:'trec|'+t.id,tip:P.played?`Win rate ${pc(me.wp)} vs a league average of ${pc(P.A.m)}`:'Counts once games are played'}],{label:'Power score parts'})));
  h+=drillSec('Power score, all ten teams','Tap a team for its own breakdown.',
    stack(CH.hbars(ts.map(x=>{const hi=x.id===t.id,mine=x.id===ME&&!hi;return {label:`${x.pr}. ${esc(x.name)}`,v:x.score,txt:f2(x.score),hi,me:mine,cls:hi||mine?undefined:'mut',stat:'tpr|'+x.id,
      tip:`#${x.pr} ${x.name}: score ${f2(x.score)}, ${x.rr.toFixed(2)} categories a week, roster value ${f1(x.nv)}`}}),{label:'Power score by team'}))+legend([['hi',esc(t.name)],...(t.id===ME?[]:[['me','Your team']]),['mut','Other teams']]));
  // the teams just above and below: who leads, by how much, and which part of the score makes the difference
  const card=(o,dir)=>{if(!o)return '';const q=P.o[o.id],L=dir>0?o:t,F=dir>0?t:o,lq=dir>0?q:me,fq=dir>0?me:q,gap=Math.abs(o.score-t.score),mx=M.mx[t.id][o.id];
    const kR=(1-al)*(2/3)/P.R.s,kV=(1-al)/3/P.V.s;
    const parts=[[lq.r-fq.r,'Weekly strength',`${L.rr.toFixed(2)} vs ${F.rr.toFixed(2)} categories a week`],[lq.v-fq.v,'Roster value',`${f1(L.nv)} vs ${f1(F.nv)}`],...(al?[[lq.a-fq.a,'Real record',`${pc(lq.wp)} vs ${pc(fq.wp)} of categories won`]]:[])].sort((a,b)=>Math.abs(b[0])-Math.abs(a[0]));
    const pass=kR>0?(dir>0?`To pass them on its own, this team needs about ${up(gap/kR,2).toFixed(2)} more categories won a week, or ${up(gap/kV,1).toFixed(1)} more roster value.`:`They pass this team with about ${up(gap/kR,2).toFixed(2)} more categories won a week, or ${up(gap/kV,1).toFixed(1)} more roster value.`):'';
    const res=mx.w>mx.l?`wins ${scoreStr(mx)}`:mx.w<mx.l?`loses ${scoreStr(mx)}`:`ties ${scoreStr(mx)}`;
    return `<div class="sub"><span class="lbl">${dir>0?'Just above':'Just below'} · #${o.pr}</span><h3>${tlink(o)}</h3>
      <p class="note" style="margin:0">${esc(L.name)} leads by ${gap.toFixed(2)}.</p>
      <ul class="note" style="margin:0;padding-left:18px">${parts.map(([d,l,raw])=>`<li>${l}: ${d>=0?'+':'−'}${Math.abs(d).toFixed(2)} for ${esc(L.name)} (${raw})</li>`).join('')}</ul>
      ${pass?`<p class="note" style="margin:0">${pass}</p>`:''}
      <p class="note" style="margin:0">Roster against roster, ${esc(t.name)} ${res} in categories.</p>
      <div class="filters"><button type="button" class="btn sm ghost" data-stat="${esc(`h2h|${t.id}|${o.id}`)}">Head to head</button><button type="button" class="btn sm ghost" data-stat="${esc('tpr|'+o.id)}">Their breakdown</button></div></div>`};
  if(ab||be)h+=drillSec('The teams around them','',`<div class="cols">${card(ab,1)}${card(be,-1)}</div>`);
  h+=how(['Power rank sorts teams by a score with two parts before games start. Weekly strength (two thirds) is the number of categories a team is expected to win in a week, against every other team, averaged over the weeks left; it runs through the real NBA schedule and the 11-starter daily limit and ignores who the team happens to draw. Roster value (one third) adds up every player\'s value across all nine categories, which rewards depth and trade assets.',
    `Each part is turned into standard deviations from the league average before weighting, so the parts are comparable. Once weeks are played, the real win rate takes a share of weeks played ÷ (weeks played + 3)${P.played?`, ${pc(al)} now`:''}, and the two model parts shrink to make room.`,
    'The "to pass them" amounts hold every other team fixed and ignore that one team\'s change also moves the league average a little, so treat them as close estimates.']);
  return {eyebrow:esc(t.name),title:`Power rank #${t.pr}${back(esc(t.abbr))}`,sub:`Score ${f2(t.score)} · ${t.rr.toFixed(2)} categories a week · roster value ${f1(t.nv)}`,html:h}};

/* =====================================================================================
   tpo|<teamId>: playoff odds from seasonSim()
   ===================================================================================== */
DRILL.tpo=id=>{const t=TM(id);if(!t)return null;css();
  const SS=seasonSim(),s=SS[t.id];if(!s)return null;
  const bye=s.seed.slice(0,3).reduce((a,x)=>a+x,0),avgS=avgSeed(s),mostI=s.seed.indexOf(Math.max(...s.seed));
  const lw=left(),rows=lw.map(w=>{const op=oppOf(t.id,w);if(op==null)return null;const q=mp(t.id,op,w);return {w,op,q}}).filter(Boolean);
  const expMw=rows.reduce((a,r)=>a+r.q.win,0),fav=rows.filter(r=>r.q.win>=.5).length;
  const stand=[...M.teams].sort((a,b)=>SS[b.id].w-SS[a.id].w),place=stand.indexOf(t)+1,fifth=stand[4],sixth=stand[5];
  const line=place<=5?`Projected ${ord(place)} by category wins. Cushion over ${esc(sixth.name)} (6th): ${(s.w-SS[sixth.id].w).toFixed(1)} category wins.`
    :`Projected ${ord(place)} by category wins, ${(SS[fifth.id].w-s.w).toFixed(1)} behind ${esc(fifth.name)} in 5th, the last playoff spot.`;
  let h=facts([
    fact('Playoff odds',pc(s.po),'Top five make it','ttl|'+t.id),
    fact('First-round bye',pc(bye),'Seeds 1 to 3 (assumed format)','ttl|'+t.id),
    fact('#1 seed',pc(s.top),`Most likely seed: ${mostI+1}`,'ttl|'+t.id),
    fact('Average finish',avgS.toFixed(1),'Of 10'),
    fact('Projected final record',`${Math.round(s.w)}-${Math.round(s.l)}`,hasRec(t)?`Now ${scoreStr(t.record)}; category wins`:'Category wins and losses','trec|'+t.id),
    rows.length?fact('Matchups won',`${expMw.toFixed(1)} of ${rows.length}`,`Favored in ${fav} week${fav===1?'':'s'} left`):'']);
  h+=`<p class="note">${line}</p>`;
  h+=drillSec('Where they finish',`Share of 4,000 simulated seasons ending in each seed. Green seeds make the playoffs.`,
    CH.dist(s.seed.map((p,i)=>({x:i+1,p,cls:i<5?'bar-w':'bar-n',tip:`Seed ${i+1}`,em:i===mostI})),{label:'Seed probabilities',legend:legend([['w','Makes the playoffs'],['mut','Misses']])}));
  if(rows.length){const cls=t.id===ME?'s2':'s1';
    h+=drillSec('Win chance, week by week',`Chance to win each remaining regular-season week (5 or more of the 9 categories). The dashed line is a coin flip. Tap a point for the matchup.`,
      CH.line([{name:esc(t.name),cls,pts:rows.map(r=>[r.w,r.q.win,`mw|${t.id}|${r.op}|${r.w}`])}],{y0:0,y1:1,ref:.5,fmt:pc,xl:x=>'W'+x,label:'Weekly win chance'}));
    const srt=[...rows].sort((a,b)=>a.q.win-b.q.win),n2=rows.length>=4?2:1,pick=[...srt.slice(0,n2).map(r=>['Hardest',r]),...srt.slice(-n2).reverse().map(r=>['Easiest',r])];
    const wf=([lab,r])=>fact(`${lab}: ${weekName(r.w)}`,pc(r.q.win),`vs ${esc(teamById[r.op].name)} · ${r.q.exp.toFixed(1)}–${r.q.expL.toFixed(1)} cats`,`mw|${t.id}|${r.op}|${r.w}`);
    if(rows.length>=2)h+=facts(pick.map(wf));
    h+=drillSec('The schedule left','Win chance and expected categories (for–against) for every week. Tap a week for the full matchup.',
      `<div class="scroll"><table><thead><tr><th scope="col">Wk</th><th class="l" scope="col">Opponent</th><th class="l" scope="col">Win chance · exp. cats</th></tr></thead><tbody>
      ${rows.map(r=>`<tr class="click ${r.op===ME?'me':''}" data-stat="${esc(`mw|${t.id}|${r.op}|${r.w}`)}" tabindex="0"><td class="num">${r.w}</td><td class="l tname" style="white-space:normal">${esc(teamById[r.op].name)}<small>${weekLabel(r.w)} · power #${tm(r.op).pr}</small></td><td class="l"><div class="wp" style="min-width:112px"><span style="width:${pc(r.q.win)}"></span><em>${pc(r.q.win)} · ${r.q.exp.toFixed(1)}–${r.q.expL.toFixed(1)}</em></div></td></tr>`).join('')}</tbody></table></div>`)}
  else h+=`<div class="empty">The regular season is over; the seeds are set.</div>`;
  h+=how(['The board plays out the rest of the regular season 4,000 times. In each simulated week, every category of every matchup goes to one team or the other with the chance from the matchup model (projected totals through the real NBA schedule and the 11-starter limit, and how much each category usually swings). Categories are drawn independently, which is assumed; real weeks have some streakiness.',
    `Standings rank teams by category win percentage, the way this league keeps them, and the top five make the playoffs. Ties are broken at random (ESPN's tiebreakers are not modelled). ${hasRec(t)?'Results already played are locked in. ':''}The projected final record is the average over all simulations.`,
    'The bye assumes the ESPN format for a 5-team bracket over weeks 21 to 23: seeds 4 and 5 meet in round one while seeds 1 to 3 rest, then 1 plays the lowest seed left and 2 plays 3, then the final.']);
  return {eyebrow:esc(t.name),title:`Playoff odds ${pc(s.po)}${back(esc(t.abbr))}`,sub:`Average finish ${avgS.toFixed(1)} · projected ${Math.round(s.w)}-${Math.round(s.l)} in categories`,html:h}};

/* =====================================================================================
   trec|<teamId>: category record vs the field
   ===================================================================================== */
DRILL.trec=id=>{const t=TM(id);if(!t)return null;css();
  const others=[...M.teams].filter(x=>x.id!==t.id).sort((a,b)=>a.pr-b.pr),recRank=[...M.teams].sort((a,b)=>(b.rec.w-b.rec.l)-(a.rec.w-a.rec.l)).indexOf(t)+1;
  const byC=CATS.map(c=>{let w=0,l=0,tt=0;others.forEach(o=>{const x=t.line[c.k],y=o.line[c.k];if(Math.abs(x-y)<1e-9)tt++;else if(better(c,x,y))w++;else l++});return {c,w,l,t:tt}});
  const best=[...byC].sort((a,b)=>b.w-a.w)[0],worst=[...byC].sort((a,b)=>a.w-b.w)[0],R=t.record||{w:0,l:0,t:0},n=R.w+R.l+R.t;
  const proj=t.rec.w+t.rec.l+t.rec.t?(t.rec.w+t.rec.t/2)/(t.rec.w+t.rec.l+t.rec.t):.5,real=n?(R.w+R.t/2)/n:null;
  const stRank=n?[...M.teams].sort((a,b)=>{const ra=a.record||{w:0,l:0,t:0},rb=b.record||{w:0,l:0,t:0},na=ra.w+ra.l+ra.t,nb=rb.w+rb.l+rb.t;return (nb?(rb.w+rb.t/2)/nb:0)-(na?(ra.w+ra.t/2)/na:0)}).indexOf(t)+1:null;
  let h=facts([
    fact('Vs the field',scoreStr(t.rec),`#${recRank} · favored against ${t.rec.mw} of 9`),
    fact('Best category',best.c.l,`Beats ${best.w} of 9`,`tc|${t.id}|${best.c.k}`),
    fact('Weakest category',worst.c.l,`Beats ${worst.w} of 9`,`tc|${t.id}|${worst.c.k}`),
    fact('Real record',n?scoreStr(R):'0-0',n?`${pc(real)} of categories · #${stRank} in standings`:'No games played yet','tpo|'+t.id)]);
  if(n){const d=real-proj;h+=`<p class="note">Real results run ${Math.abs(d)<.02?'right in line with':`${Math.round(Math.abs(d)*100)} points ${d>0?'above':'below'}`} what the rosters suggest (${pc(proj)} of categories against the field). ${Math.abs(d)>=.05?(d>0?'Some of that is schedule and luck; expect a little regression.':'Some of that is schedule and bad luck; better weeks are likely.'):''}</p>`}
  h+=drillSec('Against each team','Categories won of the nine, roster against roster. Green bars win the matchup (5 or more). Tap a team for the full head to head.',
    stack(CH.hbars(others.map(o=>{const r=M.mx[t.id][o.id],wc=CATS.filter(c=>better(c,t.line[c.k],o.line[c.k])).map(c=>c.l);
      return {label:`${esc(o.name)}`,v:r.w,txt:scoreStr(r),cls:r.w>r.l?'pos':r.w<r.l?'neg':'mut',stat:`h2h|${t.id}|${o.id}`,tip:`vs ${o.name}: ${scoreStr(r)}. Wins ${wc.join(', ')||'nothing'}`}}).sort((a,b)=>b.v-a.v),{label:'Categories won by opponent',max:9}))
    +legend([['w','Wins more categories',''],['l','Loses more','background:var(--neg-3)']]));
  h+=drillSec('By category','How many of the nine other teams they beat in each category; green when they beat most of them. Tap a category for the team\'s breakdown.',
    CH.hbars(byC.map(x=>({label:`${x.c.l}<small>#${t.catRank[x.c.k]}</small>`,v:x.w,txt:`${x.w}-${x.l}${x.t?'-'+x.t:''}`,cls:S.punt.has(x.c.k)&&t.id===ME?'mut':x.w>x.l?'pos':x.w<x.l?'neg':'mut',stat:`tc|${t.id}|${x.c.k}`,
      tip:`${x.c.n}: beats ${x.w} of 9 teams, rank #${t.catRank[x.c.k]}`})),{label:'Teams beaten by category',max:9}));
  h+=drillSec('Every result','Each cell is this roster against that one in a category: W, L or T. Hover or focus a cell for both totals.',
    `<div class="scroll"><table class="hm"><thead><tr><th class="l stick" scope="col">Opponent</th>${CATS.map(c=>`<th scope="col" class="${S.punt.has(c.k)&&t.id===ME?'punted':''}">${sbtn(`tc|${t.id}|${c.k}`,c.l)}</th>`).join('')}<th scope="col">Result</th></tr></thead><tbody>
    ${others.map(o=>{const r=M.mx[t.id][o.id];return `<tr class="${o.id===ME?'me':''}"><td class="l stick" style="text-align:left;font-family:var(--body)"><button type="button" class="sx" data-stat="${esc(`h2h|${t.id}|${o.id}`)}" data-tip="${esc(o.name)}" style="display:block;max-width:9.5em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(o.name)}</button></td>${CATS.map(c=>{const x=t.line[c.k],y=o.line[c.k],tie=Math.abs(x-y)<1e-9,win=better(c,x,y);
      return `<td class="${tie?'':win?'p1':'n1'} ${S.punt.has(c.k)&&t.id===ME?'punted':''}" data-tip="${esc(`${c.l}: ${fv(c,x)} vs ${fv(c,y)} (${o.name})`)}" data-stat="${esc(`h2h|${t.id}|${o.id}`)}" tabindex="0">${tie?'T':win?'W':'L'}</td>`}).join('')}<td><b>${scoreStr(r)}</b></td></tr>`}).join('')}</tbody></table></div>`);
  h+=how([`"Vs the field" compares this roster's category totals (${SEA()?'over the season':'per game'}, every rostered player added up) with each other team's, one category at a time. It ignores the weekly schedule, so it measures the roster, not the luck of the draw.`,
    'A favored matchup is one where the roster wins at least five of the nine categories. The real record counts category wins, losses and ties from games played, the way this league keeps standings.']);
  return {eyebrow:esc(t.name),title:`Category record${back(esc(t.abbr))}`,sub:`${scoreStr(t.rec)} against the field · favored against ${t.rec.mw} of 9${n?' · real '+scoreStr(R):''}`,html:h}};

/* =====================================================================================
   tgm|<teamId>: games by week
   ===================================================================================== */
const gmAll=()=>memo('dteam|gm',()=>{const per={};M.teams.forEach(t=>per[t.id]=WEEKS.map(w=>{const P=projTeam(t.id,w,0);return {g:P.games,b:P.bench}}));
  const avg=WEEKS.map((_,i)=>mean(M.teams.map(t=>per[t.id][i].g))),avgB=WEEKS.map((_,i)=>mean(M.teams.map(t=>per[t.id][i].b)));
  const tot={};M.teams.forEach(t=>{const a=per[t.id];tot[t.id]={reg:a.filter((_,i)=>WEEKS[i]<=REGW).reduce((s,x)=>s+x.g,0),po:a.filter((_,i)=>WEEKS[i]>REGW).reduce((s,x)=>s+x.g,0),bench:a.filter((_,i)=>WEEKS[i]<=REGW).reduce((s,x)=>s+x.b,0)}});
  const rk=f=>{const o={};[...M.teams].sort((a,b)=>f(b)-f(a)).forEach((t,i)=>o[t.id]=i+1);return o};

DRILL.tgm=id=>{const t=TM(id);if(!t)return null;css();
  const G=gmAll(),a=G.per[t.id],T=G.tot[t.id],lgReg=mean(M.teams.map(x=>G.tot[x.id].reg)),lgPo=mean(M.teams.map(x=>G.tot[x.id].po)),lgB=mean(M.teams.map(x=>G.tot[x.id].bench));
  const diffs=WEEKS.map((w,i)=>({w,i,d:a[i].g-G.avg[i]})).filter(x=>x.w<=REGW&&!done(x.w)),bestW=[...diffs].sort((x,y)=>y.d-x.d)[0],worstW=[...diffs].sort((x,y)=>x.d-y.d)[0];
  const mwOf=w=>{const op=oppOf(t.id,w);return op==null?null:`mw|${t.id}|${op}|${w}`};

    (()=>{const w=Math.min(curWeek,REGW),i=WEEKS.indexOf(w);return i<0||curWeek>REGW?'':fact(`${weekName(w)} games`,a[i].g.toFixed(0),`League average ${G.avg[i].toFixed(1)}${a[i].b?` · ${a[i].b} benched`:''}`,mwOf(w))})(),

    worstW?fact('Thinnest week',`${weekName(worstW.w)}`,`${sg(Math.round(worstW.d*10)/10)} games vs average`,mwOf(worstW.w)):'']);
  const me=t.id===ME,series=[{name:esc(t.name),cls:me?'s2':'s1',pts:WEEKS.map((w,i)=>[w,a[i].g,w<=REGW?mwOf(w):null])}];
  if(!me)series.push({name:'Your team',cls:'s2',pts:WEEKS.map((w,i)=>[w,G.per[ME][i].g])});

  h+=drillSec('Player-games by week',`Expected games that count each week, after the daily 11-starter limit and expected rest. ${PO_WEEKS.map(wkShort).join(', ')} are the fantasy playoffs. Week 1 is six days.`,
    CH.line(series,{xl:wkShort,fmt:v=>v.toFixed(0),label:'Games by week'}));
  const cell=d=>d>=2.5?'p3':d>=1?'p2':d>=.4?'p1':d<=-2.5?'n3':d<=-1?'n2':d<=-.4?'n1':'';

    `<div class="gchips">${WEEKS.map((w,i)=>{const d=a[i].g-G.avg[i],st=w<=REGW?mwOf(w):null,tip=`${weekName(w)} (${weekLabel(w)}): ${a[i].g.toFixed(1)} games, league average ${G.avg[i].toFixed(1)}${a[i].b?`, ${a[i].b} benched`:''}`;
      const inner=`<b>${a[i].g.toFixed(0)}</b><small>${wkShort(w)}</small>`;
      return st?`<button type="button" class="gc ${cell(d)}" data-stat="${esc(st)}" data-tip="${esc(tip)}" style="border:0;font:inherit;cursor:pointer;${done(w)?'opacity:.55':''}">${inner}</button>`:`<span class="gc ${cell(d)}" data-tip="${esc(tip)}" tabindex="0">${inner}</span>`}).join('')}</div>`);
  const ro=t.roster.filter(p=>p.pg).map(p=>({p,g:poGames(p)})).sort((x,y)=>y.g-x.g),avgPo=mean(M.players.filter(p=>p.pg).map(poGames));
  const groups=[...new Set(ro.map(x=>x.g))].sort((a,b)=>b-a).map(g=>({g,ps:ro.filter(x=>x.g===g)}));
  h+=drillSec('Playoff games by player',`NBA games in weeks ${PO_WEEKS[0]} to ${PO_WEEKS[PO_WEEKS.length-1]} for each player's team. An average rostered player has ${avgPo.toFixed(1)}; green is more, red fewer. Tap a player for their week-by-week schedule.`,

/* =====================================================================================
   h2h|<teamA>|<teamB>: roster against roster
   ===================================================================================== */
function h2hEdges(a,b){const A=TM(a),B=TM(b);if(!A||!B)return null;
  return CATS.map(c=>{const x=A.line[c.k],y=B.line[c.k],sd=sdev(M.teams.map(t=>t.line[c.k]))||1,d=(c.neg?y-x:x-y);

    avgWin!=null&&up_.length>1?fact('Average chance left',pc(avgWin),`Over ${up_.length} meetings`):'',
    fact('Power rank',`#${A.pr} vs #${B.pr}`,`${A.rr.toFixed(2)} vs ${B.rr.toFixed(2)} cats a week`,'tpr|'+A.id),
    (()=>{const e=[...E].sort((x,y)=>Math.abs(x.edge)-Math.abs(y.edge))[0];const [sa,sb]=fvPair(e.c,e.a,e.b);return fact('Closest category',e.c.l,`${sa} vs ${sb}`,link(e))})()]);
  h+=`<p class="note">${aw.length?`${esc(A.name)} wins ${aw.join(', ')}.`:''} ${bw.length?`${esc(B.name)} wins ${bw.join(', ')}.`:''} ${close.length?`Closest: ${close.join(', ')}.`:''}</p>`;

    `<div style="display:grid;grid-template-columns:3.2em minmax(0,1fr) minmax(0,1fr);gap:0 12px;align-items:start">

/* ---------- search shortcuts for your team ---------- */

<script>/* module: h2_cats.js */

   Registers only at load; every computation runs at render time and is memoized per model state.

const CT=k=>catOf(String(k||'').toLowerCase())||null;

const dpT=()=>SEA()?0:1;
const fT=(c,v)=>v==null||!isFinite(v)?'–':c.pct?f3(v):v.toFixed(dpT());          // a team total (per game, or season)
const fV=(c,v)=>v==null||!isFinite(v)?'–':c.pct?f3(v):v.toFixed(1);               // a player's per-game number or %
const fZ=z=>z==null||!isFinite(z)?'–':Math.abs(z)<.05?'0.0':f1(z);
const fR=r=>(r<0?'−':'')+Math.abs(r).toFixed(2).replace(/^0/,'');                 // a correlation: .53, −.69
const sgnT=(v,d)=>(v>=0?'+':'−')+Math.abs(v).toFixed(d);
const ATT={fg:'FGA',ft:'FTA',tp:'3PA'}, MAKES={fg:'made field goals',ft:'made free throws',tp:'made threes'};
const nm=p=>esc(p.name);
const ab=id=>esc(teamById[id].abbr);
const tn=id=>esc(teamById[id].name);
const tnY=id=>tn(id)+(id===ME?' (you)':'');
const tlink=id=>`<button type="button" class="tlink" data-team="${id}">${tn(id)}</button>`;
const facts=a=>`<div class="facts">${a.join('')}</div>`;
const legend=items=>`<div class="legend">${items.map(([cls,l])=>`<span><i class="${cls}"></i>${l}</span>`).join('')}</div>`;
const segX=(key,cur,opts,label,cls='')=>`<div class="seg ${cls}" role="group" aria-label="${esc(label)}">${opts.map(([v,l,t])=>`<button type="button" data-set="${esc(key+'='+v)}" aria-pressed="${String(v)===String(cur)}"${t?` title="${esc(t)}"`:''}>${l}</button>`).join('')}</div>`;
const listAnd=a=>a.length<2?a.join(''):a.slice(0,-1).join(', ')+' and '+a[a.length-1];
const plural=(n,w,ws)=>`${n} ${n===1?w:(ws||w+'s')}`;
// the number the value model scores: per-game count, or for shooting, impact = (player % - league %) x attempts
const rawOf=(p,c)=>{if(!p.pg)return null;if(c.pct){const a=p.pg[c.pct[1]];return a?(p.pg[c.pct[0]]/a-M.lg[c.k])*a:0}return p.pg[c.k]};
const pctOf=(p,c)=>c.pct&&p.pg&&p.pg[c.pct[1]]?p.pg[c.pct[0]]/p.pg[c.pct[1]]:null;
const headV=(p,c)=>c.pct?pctOf(p,c):(p.pg?p.pg[c.k]:null);
const shotTxt=(p,c)=>{const a=p.pg&&p.pg[c.pct[1]];return a?`${f3(p.pg[c.pct[0]]/a)} on ${a.toFixed(1)} ${ATT[c.k]}`:`no ${ATT[c.k]}`};
const fImp=v=>v==null||!isFinite(v)?'–':(v>=0?'+':'−')+Math.abs(v).toFixed(2);
// what a player's number reads as, in words, for tooltips
const pTxt=(p,c)=>c.pct?`${shotTxt(p,c)}, ${fImp(rawOf(p,c))} ${MAKES[c.k]} a game vs a league-average shooter`:`${fV(c,p.pg[c.k])} ${c.l} a game`;
// a gap between two teams in plain units ("2.3 PTS a game", "0.4 points of FG%")
const gapTxt=(c,g)=>{const a=Math.abs(g);if(c.pct){const pt=a*100;return `${pt.toFixed(pt<1?2:1)} points of ${c.l}`}return `${a.toFixed(SEA()?0:a<.1?2:1)} ${c.l} ${per()}`};
// a team's attempts in a shooting category (per game, or season), so a % gap can be read as made shots
const tAtt=(t,c)=>t.roster.filter(p=>p.pg).reduce((s,p)=>s+p.pg[c.pct[1]]*(SEA()?(p.gp||0):1),0);
const mkTxt=(c,n)=>`${n.toFixed(SEA()?0:1)} ${MAKES[c.k]} ${per()}`;
// the small line under a team total: "268.2 PTS a game" or ".484 on 201.3 FGA a game"
const teamSmall=(c,t)=>c.pct?`${f3(t.line[c.k])} on ${tAtt(t,c).toFixed(SEA()?0:1)} ${ATT[c.k]} ${per()}`:`${fT(c,t.line[c.k])} ${c.l} ${per()}`;
const concTxt=r=>r===1?'the most concentrated of the nine categories':r===9?'the least concentrated of the nine categories':r<=3?`the ${ord(r)} most concentrated of the nine categories`:r>=7?`one of the least concentrated categories (${ord(r)} of 9)`:`in the middle for concentration (${ord(r)} of 9)`;
const goodAt=c=>c.neg?'keep turnovers low':c.pct?`help ${c.l}`:`pile up ${c.n.toLowerCase()}`;
const badAt=c=>c.neg?'turn the ball over more':c.pct?`drag ${c.l} down`:`bring fewer ${c.n.toLowerCase()}`;
const strength=r=>{const a=Math.abs(r);return a>=.5?'strong':a>=.3?'moderate':a>=.15?'weak':'almost no'};
const rCls=r=>r>=.5?'p3':r>=.3?'p2':r>=.15?'p1':r<=-.5?'n3':r<=-.3?'n2':r<=-.15?'n1':'';

/* ---------- the model, per category (memoized per model state) ---------- */
// every rostered player and free agent with numbers, ranked by per-game z-score (shooting by impact; TO flipped so up is good)
function board(k){return memo('h2c|board|'+k,()=>{const c=CT(k),K=c.k;
  const row=p=>({p,z:p.zpg[K],raw:rawOf(p,c),v:headV(p,c),att:c.pct?p.pg[c.pct[1]]:null});
  const ros=M.players.filter(p=>p.pg).map(row).sort((a,b)=>b.z-a.z),zs=ros.map(r=>r.z);
  ros.forEach((r,i)=>r.rk=i+1);
  const fas=M.fas.filter(p=>p.pg).map(row).sort((a,b)=>b.z-a.z);
  fas.forEach((r,i)=>{r.rk=i+1;r.would=rankIn(zs,r.z)});
  const all=[...ros,...fas].sort((a,b)=>b.z-a.z);all.forEach((r,i)=>r.rkAll=i+1);
  const pos=zs.filter(z=>z>0),posSum=pos.reduce((s,z)=>s+z,0),top10=zs.slice(0,10).filter(z=>z>0).reduce((s,z)=>s+z,0);
  const tot=c.pct||c.neg?null:ros.reduce((s,r)=>s+r.raw,0);
  const raws=ros.map(r=>r.raw).sort((a,b)=>a-b),med=raws.length?raws[Math.floor(raws.length/2)]:null;
  const teams=[...M.teams].sort((a,b)=>a.catRank[K]-b.catRank[K]);
  return {c,ros,fas,all,zs,nPos:pos.length,share:posSum?top10/posSum:0,even:pos.length?Math.min(1,10/pos.length):0,
    prod:tot?ros.slice(0,10).reduce((s,r)=>s+r.raw,0)/tot:null,
    avg:c.pct?M.lg[K]:mean(ros.map(r=>r.raw)),med,teams,tAvg:mean(M.teams.map(t=>t.line[K]))}})}
// how concentrated each category is, side by side
const scar=()=>memo('h2c|scar',()=>{const o={};CATS.forEach(c=>{const B=board(c.k),z=i=>B.zs[Math.min(i,B.zs.length-1)];
  o[c.k]={k:c.k,share:B.share,even:B.even,nPos:B.nPos,z1:z(0),z10:z(9),z30:z(29),z60:z(59),fa:B.fas[0]||null,prod:B.prod}});
  [...CATS].sort((a,b)=>o[b.k].share-o[a.k].share).forEach((c,i)=>o[c.k].rank=i+1);return o});
// Pearson correlation of per-game z-scores across rostered players, for every pair of categories
const corr=()=>memo('h2c|corr',()=>{const P=M.players.filter(p=>p.pg),C={},r={};
  CATS.forEach(c=>{const x=P.map(p=>p.zpg[c.k]),m=mean(x),d=x.map(v=>v-m),s=Math.sqrt(d.reduce((a,v)=>a+v*v,0))||1;C[c.k]=d.map(v=>v/s)});
  CATS.forEach(a=>{r[a.k]={};CATS.forEach(b=>{r[a.k][b.k]=a.k===b.k?1:C[a.k].reduce((s,v,i)=>s+v*C[b.k][i],0)})});return {r,n:P.length}});
const rOf=(a,b)=>corr().r[a][b];
// teams ranked 9th or 10th in a category, and whether it looks deliberate
function punters(k){return memo('h2c|punt|'+k,()=>{const c=CT(k),K=c.k,R=corr().r[K],ts=board(K).teams,v=x=>c.neg?-x:x;
  const opp=CATS.filter(o=>o.k!==K&&R[o.k]<=-.15).sort((a,b)=>R[a.k]-R[b.k]);
  const step=Math.abs(v(ts[0].line[K])-v(ts[ts.length-1].line[K]))/Math.max(1,ts.length-1);
  return ts.filter(t=>t.catRank[K]>=ts.length-1).map(t=>{const t8=ts[ts.length-3],gap=v(t8.line[K])-v(t.line[K]);
    const far=step>0&&gap>=1.5*step,oppR=opp.length?mean(opp.map(o=>t.catRank[o.k])):null,built=oppR!=null&&oppR<=4,winning=t.rec.w>=t.rec.l;
    const n=[far,built,winning].filter(Boolean).length;
    return {t,rank:t.catRank[K],t8,gap,step,far,opp,oppR,built,winning,n,verdict:n>=2?'deliberate':n===1?'maybe':'weak'}})})}
// a team's category record against the field if it concedes the punted categories every week (assumed), from team lines like recordOf
function puntRec(id,P){const t=tm(id);if(!t)return null;let w=0,l=0,tt=0,mw=0,cost=0,rw=0,rl=0;
  M.teams.filter(o=>o.id!==id).forEach(o=>{let a=0,b=0;CATS.forEach(c=>{const x=t.line[c.k],y=o.line[c.k],tie=Math.abs(x-y)<1e-9,win=!tie&&(c.neg?x<y:x>y);
    if(P.includes(c.k)){if(win)cost++;l++;b++;return}
    if(tie)tt++;else if(win){w++;a++;rw++}else{l++;b++;rl++}});if(a>b)mw++});
  return {w,l,t:tt,mw,cost,rate:(rw+rl+tt)?(rw+tt/2)/(rw+rl+tt):null}}
// every player's value with and without the punted categories (z summed; per game or season as the build menu says)
function risers(P){return memo('h2c|rise|'+P.join(','),()=>{const rows=M.all.filter(p=>p.pg).map(p=>{const a=CATS.reduce((s,c)=>s+p.z[c.k],0);return {p,a,b:a-P.reduce((s,k)=>s+p.z[k],0)}});
  [...rows].sort((x,y)=>y.a-x.a).forEach((r,i)=>r.ra=i+1);[...rows].sort((x,y)=>y.b-x.b).forEach((r,i)=>r.rb=i+1);
  rows.forEach(r=>{r.d=r.b-r.a;r.up=r.ra-r.rb});return rows})}

LAB.catCorr=(a,b)=>{const A=CT(a),B=CT(b);return A&&B?rOf(A.k,B.k):null};
LAB.catBoard=k=>CT(k)?board(CT(k).k):null;
LAB.catScarcity=k=>CT(k)?scar()[CT(k).k]:null;
LAB.puntSignals=k=>CT(k)?punters(CT(k).k):null;
LAB.puntRecord=(id,cats)=>puntRec(+id,(cats||[]).map(x=>CT(x)).filter(Boolean).map(c=>c.k));

/* ---------- shared pieces (view and drills) ---------- */
// all ten teams around the average team, better to the right (fewer TO is better)
function teamBars(c,B){const sg=c.neg?-1:1;
  return `<div class="hc-wl">${CH.hbars(B.teams.map(t=>{const x=t.line[c.k],d=sg*(x-B.tAvg),r=t.catRank[c.k];
    return {label:`#${r} ${tn(t.id)}${t.id===ME?' <small>you</small>':''}`,v:d,txt:fT(c,x),hi:t.id===ME,cls:d>=0?'pos':'neg',stat:`tc|${t.id}|${c.k}`,
      tip:`${teamById[t.id].name}: ${c.pct?teamSmall(c,t):fT(c,x)+' '+c.l+' '+per()}, #${r} of 10. ${d>=0?'Better':'Worse'} than the average team by ${gapTxt(c,d)}.`}}),
    {center:true,stack:true,label:`${c.n}: team totals`})}</div>`}
// the race in plain numbers: tightest neighbours, the spread, and where you sit. Shooting gaps for your team are also given
// in made shots: how many more (or fewer) makes at your current attempts would draw level.
function raceTxt(c,B){const ts=B.teams,v=t=>c.neg?-t.line[c.k]:t.line[c.k],g=ts.slice(0,-1).map((t,i)=>({a:t,b:ts[i+1],d:v(t)-v(ts[i+1])}));
  if(!g.length)return '';const tight=[...g].sort((x,y)=>x.d-y.d)[0],me=tm(ME),r=me.catRank[c.k],up=ts[r-2],dn=ts[r],A=c.pct?tAtt(me,c):0;
  const mk=d=>c.pct&&A?` (${mkTxt(c,Math.abs(d)*A)} at your volume)`:'';
  const s1=`Tightest race: #${tight.a.catRank[c.k]} ${tlink(tight.a.id)} and #${tight.b.catRank[c.k]} ${tlink(tight.b.id)}, ${gapTxt(c,tight.d)} apart.`;
  const s2=`First to last: ${gapTxt(c,v(ts[0])-v(ts[ts.length-1]))}.`;
  const s3=`You're ${sbtn(`tc|${ME}|${c.k}`,'#'+r)}${up?`: ${gapTxt(c,v(up)-v(me))} behind #${r-1} ${tlink(up.id)}${mk(v(up)-v(me))}`:', on top'}${dn?`${up?';':':'} ${gapTxt(c,v(me)-v(dn))} ahead of #${r+1} ${tlink(dn.id)}${mk(v(me)-v(dn))}`:', last'}.`;
  return `<p class="note">${s1} ${s2} ${s3}</p>`}
function stripOf(c,B){return CH.strip(B.ros.map(r=>({v:r.raw,label:`${r.p.name} (${teamAbbr(r.p)})`,me:r.p.team===ME,hi:r.rk===1,stat:`pc|${r.p.name}|${c.k}`})),
  {fmt:c.pct?(v=>(v>=0?'+':'−')+Math.abs(v).toFixed(1)):(v=>v.toFixed(1)),rev:!!c.neg,label:`${c.n}: every rostered player`})}
const stripLegend=c=>legend([['hi','Leader'],['me','Your players'],['mut','Other rostered players']])+`<p class="note">${c.pct?`Each dot is a player's impact: ${MAKES[c.k]} a game above (right) or below a league-average shooter (${f3(M.lg[c.k])}) taking the same shots.`:c.neg?'Each dot is a player\'s turnovers a game. Fewer is better, so the axis runs from most (left) to fewest (right).':`Each dot is a player's ${c.n.toLowerCase()} a game.`} The dashed line is the median.</p>`;
function shareBars(k){const S0=scar();return CH.hbars([...CATS].sort((a,b)=>S0[b.k].share-S0[a.k].share).map(c=>{const s=S0[c.k];
  return {label:`${c.l}${c.k===k?' <small>shown</small>':''}`,v:s.share,txt:pc(s.share),hi:c.k===k,stat:`lc|${c.k}`,
    tip:`${c.n}: the top 10 hold ${pc(s.share)} of the above-average value (an even spread over the ${s.nPos} above-average players would give them ${pc(s.even)}). #${s.rank} of 9 for concentration.`}}),{max:Math.max(...CATS.map(c=>S0[c.k].share),.01),label:'Concentration by category'})}
function punterHtml(c){const L=punters(c.k);
  return L.map(x=>{const t=x.t,pill=x.verdict==='deliberate'?['Looks deliberate','p2']:x.verdict==='maybe'?['Could be a punt','']:['Looks like plain weakness','n1'];
    const why=[],t8=esc(teamById[x.t8.id].abbr),ratio=x.step>0?x.gap/x.step:0;
    why.push(x.far?`${gapTxt(c,x.gap)} behind #8 ${t8}, ${ratio>=2.5?Math.floor(ratio)+' times':'well over'} the usual gap between neighbouring teams (${gapTxt(c,x.step)})`
      :ratio<1?`only ${gapTxt(c,x.gap)} behind #8 ${t8}, less than the usual gap between neighbouring teams (${gapTxt(c,x.step)}), so one move could lift them`
      :`${gapTxt(c,x.gap)} behind #8 ${t8}, close to the usual gap between neighbouring teams (${gapTxt(c,x.step)})`);
    const ol=x.opp.slice(0,3).map(o=>`${o.l} #${t.catRank[o.k]}`).join(', ');
    if(x.opp.length)why.push(x.built?`strong in what usually trades off against ${c.l}: ${ol}`:`not especially strong in what usually trades off against ${c.l} (${ol})`);
    else why.push(`no category clearly trades off against ${c.l}, so there is no obvious build to explain it`);
    why.push(x.winning?`still ${scoreStr(t.rec)} against the field overall`:`and ${scoreStr(t.rec)} against the field overall`);
    return `<div class="sub"><div class="ph"><div><b>${sbtn(`tc|${t.id}|${c.k}`,'#'+x.rank)} ${tlink(t.id)}${t.id===ME?' (you)':''}</b></div><span class="pill ${pill[1]}" style="margin:0">${pill[0]}</span></div><p class="note">${why.map(s=>s[0].toUpperCase()+s.slice(1)).join('. ')}.</p></div>`}).join('')}
// categories that move with (or against) one category, as centred bars
function corrBars(k){const R=corr().r[k],c=CT(k);
  return CH.hbars(CATS.filter(o=>o.k!==k).sort((a,b)=>R[b.k]-R[a.k]).map(o=>({label:o.l,v:R[o.k],txt:fR(R[o.k]),cls:R[o.k]>=0?'pos':'neg',stat:`lcx|${k}|${o.k}`,
    tip:`${c.l} and ${o.l}: r ${fR(R[o.k])}, ${strength(R[o.k])} link. ${pairTxt(c,o,R[o.k])}`})),{center:true,max:1,fmt:fR,label:`What moves with ${c.l}`})}
function pairTxt(A,B,r){if(Math.abs(r)<.15)return `Knowing a player's ${A.l} tells you almost nothing about their ${B.l}.`;
  return r>0?`Players who ${goodAt(A)} usually ${goodAt(B)} too, so punting one tends to drag the other down with it.`
    :`Players who ${goodAt(A)} usually ${badAt(B)}, so punting ${B.l} makes ${A.l} cheaper to build, and the other way round.`}
const corrLegend=()=>`<div class="legend hc-sw"><span>Pull apart</span><span><i class="n3"></i><i class="n2"></i><i class="n1"></i><i class="z0"></i><i class="p1"></i><i class="p2"></i><i class="p3"></i></span><span>Go together</span></div>`;

/* ---------- the view: Stats › Categories ---------- */
function vCats(){css();
  const k=CT(S_X('cats.k','pts'))?CT(S_X('cats.k','pts')).k:'pts',c=CT(k),B=board(k),SC=scar()[k],me=tm(ME),mr=me.catRank[k],L=punters(k),del=L.filter(x=>x.verdict==='deliberate');
  const lead=B.ros[0],fa=B.fas[0],picker=segX('cats.k',k,CATS.map(x=>[x.k,x.l,x.n]),'Category','hc-pick');
  const mine=B.ros.filter(r=>r.p.team===ME);
  let h=`<section class="panel" id="cats-top">${picker}
    ${head(esc(c.n),`${c.neg?'Lower is better: the fewest turnovers wins the category. ':''}${c.pct?`Scored by impact, made shots above a league-average shooter (${f3(M.lg[k])}) at the player's volume, the same way player value counts it. `:''}${SEA()?'Players per game; team totals over the season.':'Players and team totals are per game.'}`)}
    <p class="hc-lead">${lead?`<b>${nm(lead.p)}</b> leads the league (${pTxt(lead.p,c)}). `:''}${c.l} is <b>${concTxt(SC.rank)}</b>: the top 10 players hold ${pc(B.share)} of the above-average value. You rank <b>#${mr} of 10</b>${mine.length?`, led by ${nm(mine[0].p)} (#${mine[0].rk} in the league)`:''}.</p>
    ${facts([
      lead?fact('League leader',nm(lead.p),`${c.pct?shotTxt(lead.p,c):fV(c,lead.v)+' a game'} · ${ab(lead.p.team)}`,`pc|${lead.p.name}|${k}`):'',
      fact('Your team',`#${mr} of 10`,teamSmall(c,me),`tc|${ME}|${k}`),
      fact('Average rostered player',c.pct?f3(B.avg):fV(c,B.avg),c.pct?`league ${c.l}, all rostered shots`:`a game · median ${fV(c,B.med)}`,`lc|${k}`),
      fa?fact('Best free agent',nm(fa.p),`${c.pct?shotTxt(fa.p,c):fV(c,fa.v)+' a game'} · would rank #${fa.would}`,`pc|${fa.p.name}|${k}`):'',
      fact('Top-10 share',pc(B.share),`of above-average value · ${ord(SC.rank)} of 9`,`lc|${k}`),
      fact('Deliberate punts',`${del.length} of ${L.length}`,`bottom two: ${L.map(x=>`#${x.rank} ${ab(x.t.id)}`).join(', ')}`,`lc|${k}`)])}
  </section>`;
  h+=`<div class="cols">${leadersPanel(c,B)}<section class="panel">${head('Team totals and ranks',`All ten rosters ${per()}, against the average team. ${c.neg?'Fewer turnovers counts as better, so it points right.':'Right of centre is better.'} Tap a team for its breakdown.`)}
    ${teamBars(c,B)}${legend([['pos','Better than the average team'],['neg','Worse']])}${raceTxt(c,B)}
    ${how([`Team totals add up every rostered player's projected numbers ${SEA()?'over their projected games':'per game'}; FG%, FT% and 3P% are total makes over total attempts, not an average of percentages. Ranks are 1 to 10, best first. The centre line is the average of the ten teams. Weekly matchups also depend on games played and the daily lineup limit, which the Matchup tab handles.`])}</section></div>`;
  h+=`<div class="cols">${distPanel(c,B)}${scarPanel(c,B,SC)}</div>`;
  h+=corrPanel(c);
  h+=puntPanel(c);
  return h}

function leadersPanel(c,B){const k=c.k,poolK=['ros','fa','all'].includes(S_X('cats.pool','ros'))?S_X('cats.pool','ros'):'ros',n=+S_X('cats.n','15')===40?40:15;
  const base=poolK==='fa'?B.fas:poolK==='all'?B.all:B.ros,[sk,sd]=S.sort[SK];
  const rows=sortRows([...base],sk,sd,(r,key)=>key==='name'?r.p.name:key==='team'?teamAbbr(r.p):key==='v'?r.v:key==='att'?r.att:key==='raw'?r.raw:r.z).slice(0,n);
  const rk=r=>poolK==='all'?r.rkAll:r.rk;
  const cells=r=>{const d=`pc|${r.p.name}|${k}`;
    return c.pct?`<td class="num" ${sx(d)}><b>${fV(c,r.v)}</b><small class="d">${r.att!=null?r.att.toFixed(1):'0'} ${ATT[k]}</small></td><td class="num" ${sx(d)}>${fImp(r.raw)}</td>`
      :`<td class="num" ${sx(d)}><b>${fV(c,r.v)}</b></td>`};
  const sub=r=>{const p=r.p;return `${p.team?sbtn(`tc|${p.team}|${k}`,ab(p.team)):'FA'} · ${p.nba==='?'?'Unsigned':esc(p.nba)} · ${p.pos}${p.team?'':` · would rank #${r.would??rankIn(B.zs,r.z)}`}`};
  return `<section class="panel" id="cats-leaders">${head('Leaders',`${poolK==='fa'?'Free agents only':poolK==='all'?'Rostered players and free agents together':'Every rostered player'}, best first${c.pct?' by impact':''}. Tap a row for the player's breakdown, a team for theirs.`,segX('cats.pool',poolK,[['ros','Rostered'],['fa','Free agents'],['all','Everyone']],'Player pool'))}
    <div class="scroll" data-keep="h2c-lead"><table class="hc-tbl"><thead><tr><th scope="col">#</th>${th(SK,'name','Player','l stick')}${c.pct?`${th(SK,'v',c.l)}${th(SK,'raw','Impact','','Made shots a game above a league-average shooter taking the same shots')}`:th(SK,'v','Per game')}${th(SK,'z','z','','How far above or below an average rostered player, in standard deviations'+(c.neg?'; fewer turnovers scores higher':''))}</tr></thead><tbody>
    ${rows.map(r=>{const p=r.p;return `<tr class="click ${p.team===ME?'me':''}" ${sx(`pc|${p.name}|${k}`)} tabindex="0"><td class="num">${rk(r)}</td>${pcell(p,sub(r))}${cells(r)}<td class="z ${zc(r.z)}" ${sx(`pc|${p.name}|${k}`)}>${fZ(r.z)}</td></tr>`}).join('')||`<tr><td class="l" colspan="5">No players in this pool.</td></tr>`}</tbody></table></div>
    <div class="hc-acts">${base.length>15?`<button type="button" class="btn sm ghost" data-set="cats.n=${n===40?15:40}">${n===40?'Show the top 15':'Show the top 40'}</button>`:''}<span class="note">${plural(base.length,'player')} in this pool.</span></div>
    ${how([`Players are ranked by z-score: how far their number sits above or below the average rostered player, in standard deviations (about two thirds of players fall between −1 and +1).${c.neg?' For TO the sign is flipped, so fewer turnovers scores higher.':''}${c.pct?` For ${c.l}, the score uses impact, (their ${c.l} − the league's ${f3(M.lg[c.k])}) × their ${ATT[c.k]}, so a great shooter on a few attempts moves a team less than a good shooter on many. Tap the ${c.l} heading to sort by the raw percentage instead.`:''}`,
      'Rostered players use ESPN\'s 2026-27 projections (blended with the season so far once games start). Free agents use their 2025-26 per-game stats, because ESPN\'s free-agent pool can\'t be read in bulk; "would rank" slots a free agent into the rostered list.'])}</section>`}

function distPanel(c,B){const mine=B.ros.filter(r=>r.p.team===ME),q=B.ros[9],k=c.k;
  const top=B.ros.slice(0,30).filter(r=>r.p.team===ME).length;
