DRILL.pc=(name,k)=>{const p=findP(name),c=catOf(k);if(!p||!c)return null;css();
  const base={eyebrow:`Player · ${c.l}`,title:`${esc(p.name)}: ${esc(c.n)}`,sub:subOf(p)};
  if(!p.pg)return {...base,html:noData(p,c.l)+how([`Category breakdowns use a player's per-game projection or stats. ${esc(p.name)} has none in the board's data yet.`])};
  const T=catTab(k),onR=p.team>0,N=T.R.length,NA=T.A.length,z=p.zpg[k],v=catV(p.pg,c),rk=1+above(T.zr,z),rkA=1+above(T.za,z),sh=beat(T.zr,z,onR),rks=onR?'ranks':'would rank';

    <div class="dp-acts">${p.team>0&&p.team!==ME?`<button type="button" class="btn sm" data-want="${esc(p.name)}">Find a deal for them</button>`:''}${p.team===ME?`<button type="button" class="btn sm" data-addtrade="${esc(p.name)}" data-pteam="${ME}">Shop them</button>`:''}<button type="button" class="btn sm ghost" data-go="trades">Trades</button><button type="button" class="btn sm ghost" data-player="${esc(p.name)}">Player profile</button></div>
    ${how([`Trade value runs from 0 (a typical waiver pickup) to 100 (the most valuable player in the league). It blends ${BLEND.hasRos?'three':'two'} opinions, each put on the model's scale (pick or rank N is worth what the model's Nth-best player is worth): model ${pc(W.model)}, draft slot ${pc(W.draft)}${BLEND.hasRos?`, rest-of-season rank ${pc(W.ros)}`:''}. The draft's share shrinks each week as real games replace draft-day opinions.${BLEND.hasRos?'':' Rest-of-season rankings join the blend once they are imported on the Trades tab.'}`,
      `The model takes per-game value across all nine categories, then for above-average players multiplies by a games factor (projected games ÷ the average, kept between 0.3 and 1.15), health (×0.97 day-to-day, ×0.85 out) and data confidence (×0.9 for estimates and free agents); below-average players are divided by the games factor instead. It adds 0.25 per extra position, measures the result above replacement (the 120th-best rostered player) and scales it so the best player is 100, with a gentle curve.`,
      `Tiers are fixed cut-offs on the 0 to 100 scale. "Who needs what they bring" is a what-if: each team gets the player in place of its lowest trade value player (assumed; a real trade sends someone back) while every other roster stays as it is, and the board counts category wins against the other nine teams.`])}`;
  return {...base,html}};

/* ---------- pgm: games outlook ---------- */
function startsFor(p){return memo(NS+'.starts.'+p.name,()=>{
    const weeks=WEEKS.filter(w=>preseason||w>=curWeek),drop=p.team>0?null:dropDefault(ME),ro=p.team>0?null:[...rosterOf(ME).filter(q=>q.name!==drop),p];
    let g=0,s=0;const per={};
    weeks.forEach(w=>{const P=p.team>0?projTeam(p.team,w,0):weekProj(ro,w,0);let gw=0,sw=0;
      P.days.forEach(d=>{if(!preseason&&d.sp<todaySP)return;if(plays(p.nba,d.sp)){gw++;if(d.st.has(p.name))sw++}});g+=gw;s+=sw;per[w]=[gw,sw]});
    return {g,s,per,drop}})}
DRILL.pgm=name=>{const p=findP(name);if(!p)return null;css();
  const base={eyebrow:'Player · games',title:`${esc(p.name)}: games outlook`,sub:subOf(p)};
  const G=gamesTab(),ab=p.nba,unsigned=!ab||ab==='?'||!G.by[ab],by=unsigned?WEEKS.map(()=>0):G.by[ab];
  const left=w=>!preseason&&w===curWeek?gamesIn(ab,w,todaySP):gamesIn(ab,w);
  const regLeft=WEEKS.filter(w=>w<=REGW&&(preseason||w>=curWeek)),g=w=>by[WEEKS.indexOf(w)];
  const totLeft=unsigned?0:regLeft.reduce((s,w)=>s+left(w),0),n4=regLeft.filter(w=>g(w)>=4).length,n2=regLeft.filter(w=>g(w)<=2).length;
  const po=unsigned?0:poGames(p),poRank=1+G.poAll.filter(x=>x>po).length,rate=Math.min(.97,Math.max(.25,(p.gp||0)/82));
  const exp=unsigned||!p.pg?0:WEEKS.filter(w=>preseason||w>=curWeek).reduce((s,w)=>s+left(w)*rate,0);
  const U=v=>unsigned?'–':v;
  const facts=`<div class="dp-f6">${fact('Projected games',p.gp?Math.round(p.gp):'–',`of 82${p.cur&&p.cur.gp!=null?` · ${Math.round(p.cur.gp)} played`:''}`)}${fact('Team games left',U(totLeft),`regular season, weeks ${regLeft[0]??'–'} to ${REGW}`)}${fact('4-game weeks',U(n4),`league average ${G.n4avg.toFixed(1)}`)}${fact('2-game weeks',U(n2),`or fewer · average ${G.n2avg.toFixed(1)}`)}${fact('Playoff games',U(po),`average ${G.poAvg.toFixed(1)} · ${unsigned?'no NBA team':`${ord(poRank)} of ${G.T.length} NBA teams`}`)}${fact('Expected games',U(Math.round(exp)),`team games × ${pc(rate)} availability`)}</div>`;
  // weekly columns: bar = NBA games that week, tick = league average, playoff weeks shaded
  const mx=Math.max(5,...by),own=p.team>0?p.team:ME,lnk=w=>{if(w>REGW)return null;const o=oppOf(own,w);return o==null?null:descr('mw',own,o,w)};
  const cols=WEEKS.map((w,i)=>{const gg=by[i],av=G.avg[w],cls=gg>=av+.3?'up':gg<=av-.3?'dn':'eq',past=!preseason&&w<curWeek,po=w>REGW,d=lnk(w);
    const tip=`${weekName(w)} · ${weekLabel(w)}: ${gg} game${gg===1?'':'s'}${PER[w]&&PER[w].length>7?` (${PER[w].length}-day week)`:''}, league average ${av.toFixed(1)}${d?`. Tap for ${tAbbr({team:own})} vs ${teamById[oppOf(own,w)].abbr}`:''}`;
    const inner=`<i class="${cls}" style="height:${(gg/mx*100).toFixed(1)}%"></i><u style="bottom:${(av/mx*100).toFixed(1)}%"></u>`;
    return d?`<button type="button" class="dp-gc ${po?'po':''} ${past?'past':''}" ${sx(d)} data-tip="${esc(tip)}" aria-label="${esc(tip)}">${inner}</button>`:`<span class="dp-gc ${po?'po':''} ${past?'past':''}" data-tip="${esc(tip)}">${inner}</span>`}).join('');
  const grid=[...Array(mx+1).keys()].filter(v=>v%(mx>6?2:1)===0).map(v=>`<div class="dp-gl" style="bottom:${(v/mx*100).toFixed(1)}%"><span>${v}</span></div>`).join('');
  const xl=WEEKS.map(w=>`<span class="${w>REGW?'po':''}">${w>REGW?'P'+(w-REGW):w}</span>`).join('');
  const chart=`<div class="dp-gm" style="--n:${WEEKS.length}" role="group" aria-label="${esc(`NBA games per fantasy week for ${p.name}`)}"><div class="dp-gplot">${grid}<div class="dp-gcols">${cols}</div></div><div class="dp-gx">${xl}</div></div>
    ${legend([['dp-pos','More games than average'],['dp-dn','Fewer'],['dp-mut','About average'],['dp-avg','League average'],['dp-po','Fantasy playoffs (P1 to P3)']])}`;
  const fours=regLeft.filter(w=>g(w)>=4),twos=regLeft.filter(w=>g(w)<=2);
  const wkTxt=unsigned?`${esc(p.name)} has no NBA team right now, so no games are scheduled for them.`:`${fours.length?`Four or more games in weeks ${plist(fours.map(String))}.`:'No four-game weeks left.'} ${twos.length?`Two or fewer in weeks ${plist(twos.map(String))}${twos.length>=4?': good weeks to stream around them':''}.`:'No two-game weeks left.'}`;
  // lineup crunch: how many of their games would count on a fantasy roster
  let crunch='';
  if(p.pg&&!unsigned&&(p.team>0||tm(ME))){const st=startsFor(p),bench=st.g-st.s,ownT=p.team>0?teamById[p.team].name:'your roster';
    crunch=drillSec('Games that count',`The board fills 11 lineup spots a day by value and position, so on crowded days some games sit on the bench.`,
      `<div class="facts">${fact('Would start',st.s,`of ${st.g} games ${p.team>0?'on '+esc(tAbbr(p)):'on your roster'}`)}${fact('Benched',bench,st.g?pctTxt(bench/st.g)+' of their games':'')}</div><p class="note">${p.team>0?`On ${esc(ownT)}`:`On your roster, in place of ${esc(st.drop||'your lowest-value player')}`}, ${esc(p.name)} would start ${st.s} of their team's ${st.g} remaining games (fantasy playoffs included)${bench?`; ${bench} land on the bench when more than 11 players have games or better options fill their spots.`:', with none lost to a crowded lineup.'} This counts schedule only; it assumes they are healthy.</p>`)}
  const html=`<p class="dp-lead">${unsigned?wkTxt:`${esc(ab)} play <b>${totLeft}</b> regular-season games${preseason?'':' from today'} across ${regLeft.length} fantasy weeks, and <b>${po}</b> in the fantasy playoffs (league average ${G.poAvg.toFixed(1)}). ${p.gp?`${esc(p.name)} is projected to play ${Math.round(p.gp)} of 82 games.`:''}`}</p>${facts}
    ${drillSec('Games by fantasy week',`${unsigned?'The dark ticks show the league average; bars appear once they sign with a team.':`Each bar is ${esc(ab)}'s NBA games that week; the dark tick is the league average. Tap a regular-season week to open ${p.team>0?'that fantasy matchup':'your matchup that week'}.`}`,chart+(unsigned?'':`<p class="note">${wkTxt}</p>`))}
    ${crunch}
    <div class="dp-acts">${actBtn(descr('pv',p.name),'Their value')}<button type="button" class="btn sm ghost" data-player="${esc(p.name)}">Player profile</button></div>
    ${how([`Games come from the real NBA schedule mapped onto this league's fantasy weeks (ESPN scoring periods). Week 1 is six days and week 18 runs 14 days around the All-Star break, so their counts run high or low. League average is the mean over all ${G.T.length} NBA teams that week.`,
      `Projected games is ${p.team===0?'last season\'s games, pulled toward a full season':'the projection behind their stats'}. Expected games multiplies their team's remaining games by their availability (projected games ÷ 82, kept between 25% and 97%), the same rate the matchup model uses.`,
      `Four-game and two-game weeks count the regular-season weeks ${preseason?'ahead':'left'}. Playoff games are weeks ${PO_WEEKS.join(', ')}; the rank compares their NBA team with the other ${G.T.length-1}.`,
      `Games that count replays the board's daily lineup: each day the highest-value players with games fill PG, SG, SF, PF, C, G, F and four UT spots. ${p.team>0?'It uses their current fantasy roster.':'For a free agent it assumes they replace your lowest-value player.'}`])}`;
  return {...base,html}};

/* ---------- player sheet panel: fantasy profile ---------- */
PANELS.player.push(name=>{const p=findP(name);if(!p||!p.pg)return '';css();
  const onR=p.team>0,N=M.players.filter(q=>q.pg).length;
  const sky=CATS.map(c=>{const T=catTab(c.k),z=p.zpg[c.k],sh=beat(T.zr,z,onR),rk=1+above(T.zr,z),pp=Math.round(Math.max(0,Math.min(1,sh))*100),v=catV(p.pg,c);
    const tip=`${c.n}: ${fmtC(c,v)} a game. ${onR?'Ranks':'Would rank'} ${ord(rk)} of ${N} rostered, better than ${pp}%${S.punt.has(c.k)?' (punted)':''}. Tap for the breakdown.`;
    return `<button type="button" class="dp-col ${S.punt.has(c.k)?'punted':''}" ${sx(descr('pc',p.name,c.k))} data-tip="${esc(tip)}" aria-label="${esc(tip)}"><span class="dp-trk"><i class="${pcls(sh)}" style="height:${Math.max(4,pp)}%"></i></span><b>${pp}</b><span class="l">${c.l}</span></button>`}).join('');
  const V=valTab(),pgv=V.pg(p),fsv=V.fs(p),rk=valRank(p),rkPg=1+above(V.pgArr,pgv),rkFs=1+above(V.fsArr,fsv),tr=tvRank(p),tier=(tierOf(p.tv)||TIER[TIER.length-1])[1];
  const G=gamesTab(),unsigned=!p.nba||p.nba==='?'||!G.by[p.nba],regLeft=WEEKS.filter(w=>w<=REGW&&(preseason||w>=curWeek)),by=unsigned?null:G.by[p.nba];
  const n4=unsigned?0:regLeft.filter(w=>by[WEEKS.indexOf(w)]>=4).length,n2=unsigned?0:regLeft.filter(w=>by[WEEKS.indexOf(w)]<=2).length;
  const vs=beat(V.vArr,p.value,onR);
  const facts=`<div class="dp-f3">${fact(onR?'Value rank':'Value rank, if rostered',rk?`#${rk}`:'–',`better than ${pctTxt(vs)} · ${rkPg===rkFs?'same per game and full season':`#${rkPg} per game, #${rkFs} full season`}`,descr('pv',p.name))}${fact(onR?'Trade value rank':'Trade value rank, if rostered',`#${tr}`,`${tier} · model ${p.tvModel.toFixed(0)}, draft ${p.tvDraft.toFixed(0)}`,descr('ptv',p.name))}${fact('Four-game weeks left',unsigned?'–':n4,unsigned?'no NBA team yet':`${n2} with two or fewer · full games outlook`,descr('pgm',p.name))}</div>`;
  const sim=similar(p.name).slice(0,3);
  const simH=sim.length?`<div class="dp-sim">${sim.map(s=>`<button type="button" class="fact" data-player="${esc(s.p.name)}" data-tip="${esc(`Typical gap per category: ${s.rms.toFixed(2)} z`)}"><span>${esc(tAbbr(s.p))} · ${esc(s.p.pos)}${s.p.team===ME?' · yours':''}</span><b>${esc(s.p.name)}</b><small>${esc(diffTxt(s))}</small></button>`).join('')}</div>`:'';
  return `<div class="drill-sec"><div><h3>Fantasy profile</h3><p class="note">Percentile in each category among the ${N} rostered players; 50 is the middle (dashed line). Tap one for the full breakdown.</p></div>
    <div class="dp-sky" role="group" aria-label="Category percentiles">${sky}</div>${facts}
    ${sim.length?`<div class="lbl">Most similar players</div>${simH}`:''}
    ${how(['Percentiles rank per-game z-scores (shooting by impact: percentage above league average times attempts) against every rostered player; TO counts fewer as better. Value ranks follow your build\'s punts; trade value ignores them.','Similar players are the nearest neighbours across all nine per-game z-scores, rostered or free agent. The line under each name says where they differ most.'])}</div>`});
})();

</script>
<script>/* module: d_team.js */
/* d_team.js: team drill-downs.
   tc|id|cat    one team in one category      tval|id   team value and grade     tpr|id   power rank breakdown
   tpo|id       playoff odds                  trec|id   category record vs field tgm|id   games by week
   h2h|a|b      roster against roster, category by category, with the players driving each edge and their real weeks
   Registers only; every computation runs at render time. Shared helpers go on window.LAB (catGap, h2hEdges, tprParts). */
(()=>{
const LAB=window.LAB=window.LAB||{};

/* ---------- small helpers ---------- */
const SEA=()=>S.mode==='season';
const per=()=>SEA()?'over the season':'a game';
const mult=p=>SEA()?(p.gp||0):1;
const pv=(p,key)=>p&&p.pg?(+p.pg[key]||0)*mult(p):0;           // a player's number, per game or season (S.mode)
const TM=id=>{const n=parseInt(id,10);return Number.isFinite(n)?(tm(n)||null):null};
const CT=k=>catOf(String(k||'').toLowerCase())||null;
const dp=()=>SEA()?0:1;
const fv=(c,v)=>v==null||!isFinite(v)?'–':c.pct?f3(v):v.toFixed(dp());
const up=(x,d)=>{const m=Math.pow(10,d);return Math.ceil(x*m-1e-9)/m};  // round up, so "passes" really passes
const nf=(x,d)=>x.toFixed(d);
const NOUN={pts:'PTS',reb:'REB',ast:'AST',stl:'STL',blk:'BLK',to:'TO',fg:'made field goals',ft:'made free throws',tp:'made threes'};
const ATT={fg:'FGA',ft:'FTA',tp:'3PA'};
const back=s=>`<span hidden> · ${s}</span>`;                       // extra words for the Back button label only
const lastName=n=>{const w=String(n).split(' ');return w.length>1?w.slice(1).join(' '):String(n)};
const done=w=>!!(PER[w]&&PER[w][PER[w].length-1]<todaySP);
const left=()=>WEEKS.filter(w=>w<=REGW&&w>=Math.max(1,curWeek));     // the weeks the season sim still plays
const hasRec=t=>!!(t.record&&(t.record.w+t.record.l+t.record.t)>0);
const meetings=(a,b)=>DATA.schedule.filter(m=>(m[1]===a&&m[2]===b)||(m[1]===b&&m[2]===a)).map(m=>m[0]).sort((x,y)=>x-y);
const byCat=k=>[...M.teams].sort((a,b)=>a.catRank[k]-b.catRank[k]);
const tlink=(t,txt)=>`<button type="button" class="tlink" data-team="${t.id}">${txt??esc(t.name)}</button>`;
const wkShort=w=>w>REGW?'P'+(w-REGW):'W'+w;
const legend=items=>`<div class="legend">${items.map(([cls,l,st])=>`<span><i class="${cls}"${st?` style="${st}"`:''}></i>${l}</span>`).join('')}</div>`;
const facts=a=>`<div class="facts">${a.join('')}</div>`;
const pctOf=(a,b)=>b?Math.round(a/b*100)+'%':'–';
// two values that would print the same get one more decimal, so a near tie still shows who leads
const fvPair=(c,a,b)=>{const x=fv(c,a),y=fv(c,b);if(x!==y||!c.pct)return [x,y];const g=v=>v.toFixed(4).replace(/^0/,'');return [g(a),g(b)]};
// colour for a signed bar, set explicitly so a chart with no negative values keeps its meaning
const pn=v=>v==null||!isFinite(v)||Math.abs(v)<1e-9?'mut':v>0?'pos':'neg';
const listOr=a=>a.length<2?a.join(''):a.slice(0,-1).join(', ')+' or '+a[a.length-1];

// rank of a hypothetical line among the other nine teams in one category
const rankAs=(line,id,k)=>ranksOf(line,id)[k];
// phone layout: bar charts whose labels are names put the label on its own line (layout only, theme tokens untouched)
function css(){if(document.getElementById('dteam-css'))return;const s=document.createElement('style');s.id='dteam-css';
  s.textContent='.dt-tight th,.dt-tight td{padding-left:6px;padding-right:6px}@media (min-width:561px){.dt-stack .hb-r{grid-template-columns:minmax(0,13.5em) minmax(0,1fr) 4.6em}}@media (max-width:560px){.dt-stack .hb-r{grid-template-columns:minmax(0,1fr) 4.2em;row-gap:2px}.dt-stack .hb-l{grid-column:1/-1}}';document.head.appendChild(s)}
const stack=html=>`<div class="dt-stack">${html}</div>`;
// a compact player cell for drill tables (the whole row opens a drill)
const ncell=(p,sub)=>`<td class="l stick" style="white-space:normal;min-width:7.5em;max-width:12em"><b style="font-weight:600">${esc(p.name)}</b>${pills(p)}<small style="display:block;color:var(--muted);font-size:.74rem">${sub}</small></td>`;
const psub=p=>`${p.nba==='?'?'Unsigned':esc(p.nba)} · ${p.pos}`;
// a 3px share bar under a number
const micro=f=>`<div style="height:3px;border-radius:2px;background:var(--soft);margin-top:4px;min-width:34px"><div style="height:3px;border-radius:2px;background:var(--accent);width:${Math.max(0,Math.min(100,f*100)).toFixed(0)}%"></div></div>`;

/* ---------- gaps: how much of a stat passes the team above, and the cushion over the team below ---------- */
function sums(t,c){const ro=t.roster.filter(p=>p.pg);return c.pct?{m:ro.reduce((s,p)=>s+pv(p,c.pct[0]),0),a:ro.reduce((s,p)=>s+pv(p,c.pct[1]),0)}:null}
// amount t needs to draw level with o: >0 means o is ahead. Counting stats in the stat's own units (fewer, for TO);
// percentages in made shots at the same attempts.
function needVs(t,o,c){if(c.pct){const s=sums(t,c);return o.line[c.k]*s.a-s.m}
  return c.neg?t.line[c.k]-o.line[c.k]:o.line[c.k]-t.line[c.k]}
const avgPlayer=c=>memo('dteam|avgp|'+c.k+'|'+S.mode,()=>mean(M.players.filter(p=>p.pg).map(p=>pv(p,c.pct?c.pct[0]:c.k))));
function catGap(id,k){const t=TM(id),c=CT(k);if(!t||!c)return null;const s=byCat(c.k),r=t.catRank[c.k],ab=s[r-2]||null,be=s[r]||null;
  return {rank:r,above:ab?{id:ab.id,need:needVs(t,ab,c)}:null,below:be?{id:be.id,cushion:-needVs(t,be,c)}:null}}
LAB.catGap=catGap;
function passTxt(c,need){const x=up(Math.max(need,0),c.pct?1:dp());
  if(c.pct)return `${nf(x,1)} more ${NOUN[c.k]} ${per()}`;
  return c.neg?`${nf(x,dp())} fewer TO ${per()}`:`+${nf(x,dp())} ${c.l} ${per()}`}
function cushTxt(c,cu){const x=Math.max(cu,0),d=x>0&&x<.1&&!SEA()?2:c.pct?1:dp();return c.pct?`${nf(x,d)} ${NOUN[c.k]} ${per()}`:`${nf(x,d)} ${c.l} ${per()}`}

/* ---------- roster contributions in one category ---------- */
// the average rostered player's numbers (per game, or per season in season mode)
const avgLine=()=>memo('dteam|avgline|'+S.mode,()=>{const q=M.players.filter(p=>p.pg),o={};KEYS.forEach(k=>o[k]=mean(q.map(p=>pv(p,k))));return o});
// the team's rank in a category if one player were swapped for an average rostered player: isolates what that player adds
function rankIfAvg(t,c,p){const A=avgLine();let v;
  if(c.pct){const s=sums(t,c),[mk,ak]=c.pct,den=s.a-pv(p,ak)+A[ak];v=den?(s.m-pv(p,mk)+A[mk])/den:0}
  else v=t.line[c.k]-pv(p,c.k)+A[c.k];
  return 1+M.teams.filter(o=>o.id!==t.id&&better(c,o.line[c.k],v)).length}
function contrib(t,c,noRank){const ro=t.roster.filter(p=>p.pg),tot=t.line[c.k],s=c.pct?sums(t,c):null;
  return ro.map(p=>{const ifAvg=noRank?null:rankIfAvg(t,c,p);
    if(c.pct){const m=pv(p,c.pct[0]),a=pv(p,c.pct[1]);return {p,v:a?m/a:null,m,a,share:s.a?a/s.a:0,imp:a?(m/a-M.lg[c.k])*a:0,ifAvg}}
    const v=pv(p,c.k);return {p,v,share:tot?v/tot:0,ifAvg}})
  .sort((x,y)=>c.pct?y.imp-x.imp:y.v-x.v)}
// the players on a roster who matter most in a category (for TO: the ones who commit the most)
function drivers(t,c,n){return contrib(t,c,true).slice(0,n)}

/* ---------- the clickable category strip (current category ringed) ---------- */
const catNav=(t,cur,type)=>`<div class="rkstrip" role="group" aria-label="Categories">${CATS.map(c=>{const r=t.catRank[c.k],on=c.k===cur;
  return `<button type="button" class="rkc ${rc(r)} ${S.punt.has(c.k)?'punted':''}" data-stat="${esc(type+'|'+t.id+'|'+c.k)}" ${on?'aria-current="true"':''} data-tip="${esc(c.n+': rank '+r+' of 10')}" style="border:0;cursor:pointer;${on?'box-shadow:inset 0 0 0 2px var(--accent)':''}"><span>${c.l}</span><b>#${r}</b></button>`}).join('')}</div>`;

/* =====================================================================================
   tc|<teamId>|<cat>: one team in one category
   ===================================================================================== */
DRILL.tc=(id,k)=>{const t=TM(id),c=CT(k);if(!t||!c)return null;css();
  const K=c.k,r=t.catRank[K],sorted=byCat(K),ab=sorted[r-2]||null,be=sorted[r]||null,avg=mean(M.teams.map(x=>x.line[K]));
  const me=t.id===ME,punted=me&&S.punt.has(K),unit=c.pct?'':` ${c.l}`;
  const diff=c.neg?avg-t.line[K]:t.line[K]-avg;   // >0 better than average
  const diffTxt=`${diff>=0?'+':'−'}${c.pct?f3(Math.abs(diff)):nf(Math.abs(diff),dp())}`;
  // this week's chance in the category and the average over the weeks left
  const w=Math.min(curWeek,REGW),opp=curWeek<=REGW?oppOf(t.id,w):null,o=opp!=null?mp(t.id,opp,w):null;
  const lw=left().map(x=>{const op=oppOf(t.id,x);return op==null?null:mp(t.id,op,x).p[K]}).filter(x=>x!=null),avgP=lw.length?mean(lw):null;
  let h=catNav(t,K,'tc');
  h+=facts([
    fact(`Team total, ${per()}`,fv(c,t.line[K]),`#${r} of 10 in ${c.l}`,'lc|'+K),
    fact('Against the average',diffTxt,`League average ${fv(c,avg)}${c.neg?' (fewer is better)':''}`),
    fact('Teams beaten',`${10-r} of 9`,'Roster against roster','trec|'+t.id),
    fact('Category z',f1(t.catZ[K]),'Summed player z-scores','tval|'+t.id),
    o?fact(`${weekName(w)} chance`,pc(o.p[K]),`vs ${esc(teamById[opp].name)}`,`mc|${t.id}|${opp}|${w}|${K}`):'',
    avgP!=null?fact('Average weekly chance',pc(avgP),`Over the ${lw.length} week${lw.length===1?'':'s'} left`):''].filter(Boolean));
  if(punted)h+=`<p class="note">You are punting ${c.n.toLowerCase()}, so it is left out of your player values. Matchups still count it.</p>`;

  // gaps above and below, in plain numbers
  const avgP1=avgPlayer(c),gapLi=[];
  const ppTxt=o=>{const x=Math.abs(o.line[K]-t.line[K])*100;return `${x<.1?nf(x,2):nf(x,1)} percentage points`};
  if(ab){const need=needVs(t,ab,c);
    const ctx=c.pct?` That is ${ppTxt(ab)} of ${c.l}, at the same attempts.`:avgP1?` That is about ${pctOf(Math.max(need,0),avgP1)} of ${c.neg?'an average rostered player\'s turnovers':'what an average rostered player adds'}.`:'';
    gapLi.push(['move',`${passTxt(c,need)} passes ${esc(ab.name)}`,`They are #${r-1} at ${fv(c,ab.line[K])}.${ctx}`,`h2h|${t.id}|${ab.id}`])}
  if(r>2){const top=sorted[0],need=needVs(t,top,c);gapLi.push(['info',`${passTxt(c,need)} catches ${esc(top.name)} for #1`,`They lead the league at ${fv(c,top.line[K])}${c.pct?`, ${ppTxt(top)} ahead`:''}.`,`tc|${top.id}|${K}`])}
  if(be){const cu=-needVs(t,be,c);gapLi.push(['warn',`A cushion of ${cushTxt(c,cu)} over ${esc(be.name)}`,`They are #${r+1} at ${fv(c,be.line[K])}. Lose that much and they pass ${me?'you':'this team'}.`,`h2h|${t.id}|${be.id}`])}
  if(!ab)gapLi.unshift(['move','First in the league','Nobody is ahead in this category.','']);
  h+=drillSec('The race around them',`Plain-number gaps to the teams just above and below${c.pct?', counted in made shots at the same number of attempts':''}.`,
    `<ul class="todo">${gapLi.map(([cls,a,b,st])=>`<li class="${cls}"><span class="dot" aria-hidden="true"></span><div><b>${a}</b><p>${b}</p></div>${st?`<div class="act"><button type="button" class="btn sm ghost" data-stat="${esc(st)}">${st.startsWith('h2h')?'Head to head':'Their breakdown'}</button></div>`:''}</li>`).join('')}</ul>`);

  // all ten teams, centred on the league average
  const rows=sorted.map(x=>{const d=c.neg?avg-x.line[K]:x.line[K]-avg,hi=x.id===t.id,mine=x.id===ME&&!hi;
    return {label:`${esc(x.name)}`,v:c.pct?d*100:d,txt:fv(c,x.line[K]),hi,me:mine,cls:hi||mine?undefined:'mut',stat:`tc|${x.id}|${K}`,
      tip:`#${x.catRank[K]} ${x.name}: ${fv(c,x.line[K])}${unit} ${per()}, ${c.pct?f3(Math.abs(d)):nf(Math.abs(d),dp())} ${d>=0?'better':'worse'} than average`}});
  h+=drillSec('All ten teams',`Bars show the distance from the league average of ${fv(c,avg)}; right of the line is better${c.neg?' (fewer turnovers)':''}. The number is the team total. Tap a team for its own breakdown.`,
    stack(CH.hbars(rows,{label:`${c.n} by team`}))+legend([['hi',esc(t.name)],...(me?[]:[['me','Your team']]),['mut','Other teams']]));

  // every roster player's part
  const con=contrib(t,c),noData=t.roster.filter(p=>!p.pg);
  const rk=x=>{const d=x.ifAvg-r;return `<td class="num ${d>0?'down':d<0?'up':''}">${d?`#${x.ifAvg}`:'same'}</td>`};
  const carry=con.filter(x=>x.ifAvg>r),drag=con.filter(x=>x.ifAvg<r);
  const thW=`<th scope="col" title="The team's rank in ${c.l} if this player were swapped for an average rostered player (now #${r})">If average</th>`;
  let tb;
  if(c.pct){const s=sums(t,c);
    tb=`<div class="scroll dt-tight"><table><thead><tr><th class="l stick" scope="col">Player</th><th scope="col" title="Their ${c.l} and attempts ${per()}">${c.l}</th><th scope="col" title="Made shots above or below what a league-average shooter makes on the same attempts, and their share of the team's attempts">Impact</th>${thW}</tr></thead><tbody>
      ${con.map(x=>`<tr class="click" data-stat="${esc('pc|'+x.p.name+'|'+K)}" tabindex="0">${ncell(x.p,psub(x.p))}<td class="num"><b>${x.v==null?'–':f3(x.v)}</b><span class="rk">${nf(x.a,dp())} ${ATT[K]}</span></td><td class="num"><span class="${x.imp>0.05?'up':x.imp<-0.05?'down':''}" style="color:var(${x.imp>0.05?'--pos-fg':x.imp<-0.05?'--neg-fg':'--ink'})">${(x.imp>=0?'+':'−')+nf(Math.abs(x.imp),SEA()?0:2)}</span><span class="rk">${pc(x.share)} of ${ATT[K]}</span></td>${rk(x)}</tr>`).join('')}</tbody></table></div>`;
    h+=drillSec('Who makes the percentage',`The roster shoots ${f3(t.line[K])} on ${nf(s.a,dp())} ${ATT[K]} ${per()} (every player's attempts added up). Impact is made shots above or below a league-average shooter (${f3(M.lg[K])}) on the same attempts, so volume counts. "If average" is the team's rank if that player were swapped for an average rostered player (now #${r}). Tap a player for their breakdown.`,tb)}
  else{tb=`<div class="scroll dt-tight"><table><thead><tr><th class="l stick" scope="col">Player</th><th scope="col">${c.l}${SEA()?'':' / g'}</th><th scope="col">Share</th>${thW}</tr></thead><tbody>
      ${con.map(x=>`<tr class="click" data-stat="${esc('pc|'+x.p.name+'|'+K)}" tabindex="0">${ncell(x.p,psub(x.p))}<td class="num"><b>${nf(x.v,dp())}</b></td><td class="num">${pc(x.share)}${micro(x.share/.25)}</td>${rk(x)}</tr>`).join('')}</tbody></table></div>`;
    h+=drillSec(c.neg?'Who commits them':'Who produces it',`Each player's ${c.n.toLowerCase()} ${per()} and their share of the team's ${fv(c,t.line[K])} (the bar fills at 25%). "If average" is the team's rank if that player were swapped for an average rostered player (now #${r}): red means they carry the team here, green means they hold it back. Tap a player for their breakdown.`,tb)}
  const nm=a=>listOr(a.slice(0,3).map(x=>esc(x.p.name)))+(a.length>3?` (and ${a.length-3} more)`:'');
  h+=`<p class="note">${carry.length?`${nm(carry)} ${carry.length===1?'carries':'carry'} the team in ${c.l}: swap ${carry.length===1?'them':'any one of them'} for an average player and the rank drops.`:`No single player carries the team in ${c.l}: swapping any one for an average player leaves the rank at #${r} or better.`}${drag.length?` ${nm(drag)} ${drag.length===1?'holds':'hold'} it back${c.neg?' with more turnovers than average':c.pct?' by shooting below league average on real volume':''}.`:''}</p>`;
  if(noData.length)h+=`<p class="note">No projection yet for ${noData.map(p=>esc(p.name)).join(', ')}; they count as zero.</p>`;

  // best free agents for this category, run through the roster
  const drop=dropDefault(t.id),kept=t.roster.filter(p=>p.pg&&p.name!==drop);
  const fas=M.fas.filter(f=>f.pg&&f.zpg&&f.zpg[K]!=null).sort((a,b)=>b.zpg[K]-a.zpg[K]).slice(0,6).map(f=>({f,nr:rankAs(lineOf([...kept,f]),t.id,K)}));
  if(fas.length){const fcell=f=>c.pct?`<b>${f3(catV(f.pg,c))}</b><span class="rk">${nf(f.pg[c.pct[1]],1)} ${ATT[K]}</span>`:`<b>${nf(f.pg[K],1)}</b>`;
    h+=drillSec('Best free agents for it',`Ranked by their z-score in ${c.l} (the shading). "If added" swaps them in for ${drop==='none'?'nobody':esc(drop)}, ${me?'your':'the team\'s'} lowest-value player, and re-ranks the team (now #${r}). Value is their overall value. Free agents use 2025-26 per-game stats.`,
      `<div class="scroll dt-tight"><table><thead><tr><th class="l stick" scope="col">Player</th><th scope="col">${c.l}</th><th scope="col">If added</th><th scope="col">Value</th></tr></thead><tbody>
      ${fas.map(({f,nr})=>{const d=r-nr;return `<tr class="click" data-stat="${esc('pc|'+f.name+'|'+K)}" tabindex="0">${ncell(f,psub(f))}<td class="z ${zc(f.zpg[K])}" data-tip="${esc(`${f.name}: z ${f1(f.zpg[K])} in ${c.l}`)}">${fcell(f)}</td><td class="num ${d>0?'up':d<0?'down':''}">${d?`#${nr}`:'same'}</td><td class="num">${f.value==null?'–':f1(f.value)}</td></tr>`}).join('')}</tbody></table></div>`)}
  h+=`<div class="filters">${sbtn('lc|'+K,`The whole league in ${c.l}`,'linkbtn')}${sbtn('trec|'+t.id,'Category record vs the field','linkbtn')}</div>`;
  h+=how([`The team total adds up every rostered player's ${SEA()?'projected season':'per-game'} numbers (${c.pct?`made ${ATT[K].slice(0,-1)} divided by attempted, so high-volume shooters move it most`:'a roster-wide total, not one night\'s box score'}). This is how the board compares rosters head to head; the weekly matchup model adds the real NBA schedule and the 11-starter daily limit on top.`,
    `Gaps are the plain difference between the two team totals${c.pct?', turned into made shots: how many more makes, at the same attempts, would lift the percentage past the other team':''}, rounded up so the number shown really passes. Other teams are held fixed, which is assumed.`,
    '"If average" swaps one player for an average rostered player (the league-wide mean in every stat) and re-ranks the team, which isolates what that player adds; removing a player outright would mostly measure roster size, since every player adds to a counting total. "If added" swaps the free agent in for the lowest-value player on the roster; the other categories move too, so check the player\'s full value before adding them.',
    'Weekly chances come from the matchup model: projected totals for that week and how much the category usually swings.'] );
  return {eyebrow:esc(t.name),title:`${c.n}${back(esc(t.abbr))}`,sub:`#${r} of 10 · ${fv(c,t.line[K])}${unit} ${per()}${punted?' · punted':''}`,html:h}};

/* =====================================================================================
   tval|<teamId>: team value and grade
   ===================================================================================== */
const POS=['PG','SG','SF','PF','C'];
const posVal=()=>memo('dteam|pos',()=>{const o={};M.teams.forEach(t=>{const v={},n={};POS.forEach(x=>{v[x]=0;n[x]=0});
  t.roster.filter(p=>p.value!=null).forEach(p=>{const ps=p.pos.split('/').filter(x=>POS.includes(x));ps.forEach(x=>{v[x]+=p.value/ps.length;n[x]+=1})});o[t.id]={v,n}});
  const avg={},rank={};POS.forEach(x=>{avg[x]=mean(M.teams.map(t=>o[t.id].v[x]));const s=[...M.teams].sort((a,b)=>o[b.id].v[x]-o[a.id].v[x]);s.forEach((t,i)=>{(rank[t.id]=rank[t.id]||{})[x]=i+1})});
  return {o,avg,rank}});
const stars=()=>memo('dteam|stars',()=>{const o={};M.teams.forEach(t=>{const tv=t.roster.map(p=>p.tv||0).sort((a,b)=>b-a),sum=tv.reduce((s,x)=>s+x,0);
  o[t.id]={share:sum?(tv[0]+(tv[1]||0)+(tv[2]||0))/sum:0,solid:tv.filter(x=>x>=30).length,sum}});return o});
DRILL.tval=id=>{const t=TM(id);if(!t)return null;css();
  const byV=[...M.teams].sort((a,b)=>b.value-a.value),vr=byV.indexOf(t)+1,nvr=[...M.teams].sort((a,b)=>b.nv-a.nv).indexOf(t)+1,tvr=[...M.teams].sort((a,b)=>b.tvSum-a.tvSum).indexOf(t)+1;
  const st=stars(),my=st[t.id],avgShare=mean(M.teams.map(x=>st[x.id].share)),avgSolid=mean(M.teams.map(x=>st[x.id].solid));
  const punts=[...S.punt].map(k=>catOf(k).l);
  let h=facts([
    fact('Value, your build',f1(t.value),`#${vr} of 10${punts.length?' · without '+punts.join(', '):''}`),
    punts.length?fact('Value, all nine',f1(t.nv),`#${nvr} of 10`):'',
    fact('Grade',t.grade,`From the power score · #${t.pr}`,'tpr|'+t.id),
    fact('Trade value, total',t.tvSum.toFixed(0),`#${tvr} of 10 · league avg ${mean(M.teams.map(x=>x.tvSum)).toFixed(0)}`),
    fact('Top three share',pc(my.share),`League average ${pc(avgShare)}`),
    fact('Solid starters or better',String(my.solid),`Trade value 30+ · avg ${avgSolid.toFixed(1)}`),
    ...(punts.length?[]:(()=>{const b=[...t.roster].filter(p=>p.value!=null).sort((x,y)=>y.value-x.value)[0];return b?[fact('Most valuable',esc(lastName(b.name)),`${esc(b.name)} · ${f1(b.value)}`,'pv|'+b.name)]:[]})())].filter(Boolean));

  const ro=[...t.roster].sort((a,b)=>(b.value??-99)-(a.value??-99));
  h+=drillSec('Value by player',`Each player's value (summed z-scores${punts.length?' without your punts':''}, ${SEA()?'scaled by games played':'per game'}). Right of the line helps. Tap a player to see where it comes from.`,
    stack(CH.hbars(ro.map(p=>({label:`${esc(p.name)}<small>${p.pos}</small>`,v:p.value,txt:p.value==null?'No data':f1(p.value),cls:pn(p.value),stat:'pv|'+p.name,
      tip:`${p.name}: value ${p.value==null?'none':f1(p.value)}${p.rank?', #'+p.rank+' of '+M.players.length+' rostered':''}, trade value ${p.tv.toFixed(0)}`})),{label:'Value by player'})));

  const srt=[...M.teams].sort((a,b)=>st[b.id].share-st[a.id].share);
  h+=drillSec('Stars or depth',`Share of each team's total trade value held by its three most valuable players. High means a star-led roster; low means value spread through the depth chart.`,
    stack(CH.hbars(srt.map(x=>{const hi=x.id===t.id,mine=x.id===ME&&!hi;return {label:esc(x.name),v:st[x.id].share,txt:pc(st[x.id].share),hi,me:mine,cls:hi||mine?undefined:'mut',stat:'tval|'+x.id,
      tip:`${x.name}: top three hold ${pc(st[x.id].share)} of ${st[x.id].sum.toFixed(0)} trade value; ${st[x.id].solid} players at 30+`}}),{label:'Top three share by team',max:1}))+legend([['hi',esc(t.name)],...(t.id===ME?[]:[['me','Your team']]),['mut','Other teams']]));

  const P=posVal(),pvT=P.o[t.id];

      tip:`${x}: ${f1(pvT.v[x])} value from ${pvT.n[x]} eligible player${pvT.n[x]===1?'':'s'}, league average ${f1(P.avg[x])}, rank #${P.rank[t.id][x]}`})),{label:'Value by position vs average'}));

  h+=drillSec('Category z totals',`Summed z-scores by category, with the league rank. ${punts.length?'Punted categories are grey. ':''}Tap one to see the players behind it.`,
    CH.hbars(CATS.map(c=>({label:`${c.l}<small>#${t.catRank[c.k]}</small>`,v:t.catZ[c.k],txt:f1(t.catZ[c.k]),cls:S.punt.has(c.k)?'mut':pn(t.catZ[c.k]),stat:`tc|${t.id}|${c.k}`,

    'The grade comes from the power score, not value alone: A is a score of 0.9 or more, B+ 0.35, B −0.3, C+ −0.9, C below that. See the power rank breakdown for the score.']);
  return {eyebrow:esc(t.name),title:`Team value${back(esc(t.abbr))}`,sub:`Value ${f1(t.value)} (#${vr} of 10) · grade ${t.grade} · ${t.count} players`,html:h}};

/* =====================================================================================
   tpr|<teamId>: power rank breakdown
   ===================================================================================== */
function tprParts(){return memo('dteam|tpr',()=>{const ts=M.teams,zs=a=>{const m=mean(a),s=sdev(a);return {z:a.map(x=>(x-m)/s),m,s}};
  const V=zs(ts.map(t=>t.nv)),R=zs(ts.map(t=>t.rr)),played=ts.some(hasRec),alpha=played?weeksDone/(weeksDone+3):0;
  const wp=ts.map(t=>{const r=t.record||{w:0,l:0,t:0},n=r.w+r.l+r.t;return n?(r.w+r.t/2)/n:.5}),A=played?zs(wp):{z:ts.map(()=>0),m:.5,s:1};
  const o={};ts.forEach((t,i)=>o[t.id]={v:(1-alpha)*V.z[i]/3,r:(1-alpha)*R.z[i]*2/3,a:alpha*A.z[i],wp:wp[i],score:t.score});
  const rrRank={},nvRank={};[...ts].sort((a,b)=>b.rr-a.rr).forEach((t,i)=>rrRank[t.id]=i+1);[...ts].sort((a,b)=>b.nv-a.nv).forEach((t,i)=>nvRank[t.id]=i+1);
  return {o,alpha,V,R,A,played,rrRank,nvRank}})}
LAB.tprParts=tprParts;
DRILL.tpr=id=>{const t=TM(id);if(!t)return null;css();
  const P=tprParts(),me=P.o[t.id],al=P.alpha,ts=[...M.teams].sort((a,b)=>a.pr-b.pr),ab=ts[t.pr-2]||null,be=ts[t.pr]||null;
  let h=facts([
    fact('Power rank',`#${t.pr}`,`Score ${f2(t.score)} · grade ${t.grade}`),
    fact('Weekly strength',t.rr.toFixed(2),`Categories won in an average week · #${P.rrRank[t.id]}`,'trec|'+t.id),
    fact('Roster value',f1(t.nv),`All nine categories · #${P.nvRank[t.id]}`,'tval|'+t.id),
    fact('Real results weight',pc(al),P.played?`${weeksDone} week${weeksDone===1?'':'s'} played`:'No games yet')]);
  h+=drillSec('What the score is made of',`Each part is the team's distance from the league average in standard deviations, times its weight. They add up to the score of ${f2(t.score)}.`,
    stack(CH.hbars([
      {label:`Weekly strength <small>×${(2/3*(1-al)).toFixed(2)}</small>`,v:me.r,txt:f2(me.r),cls:pn(me.r),stat:'trec|'+t.id,tip:`${t.rr.toFixed(2)} categories a week vs a league average of ${P.R.m.toFixed(2)}`},
      {label:`Roster value <small>×${(1/3*(1-al)).toFixed(2)}</small>`,v:me.v,txt:f2(me.v),cls:pn(me.v),stat:'tval|'+t.id,tip:`Roster value ${f1(t.nv)} vs a league average of ${f1(P.V.m)}`},
      {label:`Real record <small>×${al.toFixed(2)}</small>`,v:me.a,txt:f2(me.a),cls:pn(me.a),stat:'trec|'+t.id,tip:P.played?`Win rate ${pc(me.wp)} vs a league average of ${pc(P.A.m)}`:'Counts once games are played'}],{label:'Power score parts'})));
  h+=drillSec('Power score, all ten teams','Tap a team for its own breakdown.',
    stack(CH.hbars(ts.map(x=>{const hi=x.id===t.id,mine=x.id===ME&&!hi;return {label:`${x.pr}. ${esc(x.name)}`,v:x.score,txt:f2(x.score),hi,me:mine,cls:hi||mine?undefined:'mut',stat:'tpr|'+x.id,
      tip:`#${x.pr} ${x.name}: score ${f2(x.score)}, ${x.rr.toFixed(2)} categories a week, roster value ${f1(x.nv)}`}}),{label:'Power score by team'}))+legend([['hi',esc(t.name)],...(t.id===ME?[]:[['me','Your team']]),['mut','Other teams']]));
  // the teams just above and below: who leads, by how much, and which part of the score makes the difference
  const card=(o,dir)=>{if(!o)return '';const q=P.o[o.id],L=dir>0?o:t,F=dir>0?t:o,lq=dir>0?q:me,fq=dir>0?me:q,gap=Math.abs(o.score-t.score),mx=M.mx[t.id][o.id];
    const kR=(1-al)*(2/3)/P.R.s,kV=(1-al)/3/P.V.s;
    const parts=[[lq.r-fq.r,'Weekly strength',`${L.rr.toFixed(2)} vs ${F.rr.toFixed(2)} categories a week`],[lq.v-fq.v,'Roster value',`${f1(L.nv)} vs ${f1(F.nv)}`],...(al?[[lq.a-fq.a,'Real record',`${pc(lq.wp)} vs ${pc(fq.wp)} of categories won`]]:[])].sort((a,b)=>Math.abs(b[0])-Math.abs(a[0]));
    const pass=kR>0?(dir>0?`To pass them on its own, this team needs about ${up(gap/kR,2).toFixed(2)} more categories won a week, or ${up(gap/kV,1).toFixed(1)} more roster value.`:`They pass this team with about ${up(gap/kR,2).toFixed(2)} more categories won a week, or ${up(gap/kV,1).toFixed(1)} more roster value.`):'';
    const res=mx.w>mx.l?`wins ${scoreStr(mx)}`:mx.w<mx.l?`loses ${scoreStr(mx)}`:`ties ${scoreStr(mx)}`;
    return `<div class="sub"><span class="lbl">${dir>0?'Just above':'Just below'} · #${o.pr}</span><h3>${tlink(o)}</h3>
      <p class="note" style="margin:0">${esc(L.name)} leads by ${gap.toFixed(2)}.</p>
      <ul class="note" style="margin:0;padding-left:18px">${parts.map(([d,l,raw])=>`<li>${l}: ${d>=0?'+':'−'}${Math.abs(d).toFixed(2)} for ${esc(L.name)} (${raw})</li>`).join('')}</ul>
      ${pass?`<p class="note" style="margin:0">${pass}</p>`:''}

  if(ab||be)h+=drillSec('The teams around them','',`<div class="cols">${card(ab,1)}${card(be,-1)}</div>`);
  h+=how(['Power rank sorts teams by a score with two parts before games start. Weekly strength (two thirds) is the number of categories a team is expected to win in a week, against every other team, averaged over the weeks left; it runs through the real NBA schedule and the 11-starter daily limit and ignores who the team happens to draw. Roster value (one third) adds up every player\'s value across all nine categories, which rewards depth and trade assets.',

/* =====================================================================================
   tpo|<teamId>: playoff odds from seasonSim()
   ===================================================================================== */
DRILL.tpo=id=>{const t=TM(id);if(!t)return null;css();

  const stand=[...M.teams].sort((a,b)=>SS[b.id].w-SS[a.id].w),place=stand.indexOf(t)+1,fifth=stand[4],sixth=stand[5];

    rows.length?fact('Matchups won',`${expMw.toFixed(1)} of ${rows.length}`,`Favored in ${fav} week${fav===1?'':'s'} left`):'']);
  h+=`<p class="note">${line}</p>`;

      `<div class="scroll"><table><thead><tr><th scope="col">Wk</th><th class="l" scope="col">Opponent</th><th class="l" scope="col">Win chance · exp. cats</th></tr></thead><tbody>
      ${rows.map(r=>`<tr class="click ${r.op===ME?'me':''}" data-stat="${esc(`mw|${t.id}|${r.op}|${r.w}`)}" tabindex="0"><td class="num">${r.w}</td><td class="l tname" style="white-space:normal">${esc(teamById[r.op].name)}<small>${weekLabel(r.w)} · power #${tm(r.op).pr}</small></td><td class="l"><div class="wp" style="min-width:112px"><span style="width:${pc(r.q.win)}"></span><em>${pc(r.q.win)} · ${r.q.exp.toFixed(1)}–${r.q.expL.toFixed(1)}</em></div></td></tr>`).join('')}</tbody></table></div>`)}
  else h+=`<div class="empty">The regular season is over; the seeds are set.</div>`;
  h+=how(['The board plays out the rest of the regular season 4,000 times. In each simulated week, every category of every matchup goes to one team or the other with the chance from the matchup model (projected totals through the real NBA schedule and the 11-starter limit, and how much each category usually swings). Categories are drawn independently, which is assumed; real weeks have some streakiness.',
    `Standings rank teams by category win percentage, the way this league keeps them, and the top five make the playoffs. Ties are broken at random (ESPN's tiebreakers are not modelled). ${hasRec(t)?'Results already played are locked in. ':''}The projected final record is the average over all simulations.`,

  return {eyebrow:esc(t.name),title:`Playoff odds ${pc(s.po)}${back(esc(t.abbr))}`,sub:`Average finish ${avgS.toFixed(1)} · projected ${Math.round(s.w)}-${Math.round(s.l)} in categories`,html:h}};

/* =====================================================================================
   trec|<teamId>: category record vs the field
   ===================================================================================== */
DRILL.trec=id=>{const t=TM(id);if(!t)return null;css();

    stack(CH.hbars(others.map(o=>{const r=M.mx[t.id][o.id],wc=CATS.filter(c=>better(c,t.line[c.k],o.line[c.k])).map(c=>c.l);

/* =====================================================================================

  h+=`<p class="note">${aw.length?`${esc(A.name)} wins ${aw.join(', ')}.`:''} ${bw.length?`${esc(B.name)} wins ${bw.join(', ')}.`:''} ${close.length?`Closest: ${close.join(', ')}.`:''}</p>`;
  h+=drillSec('The edge in each category',`Bar length is the margin in league spreads (one spread is the typical gap between teams in that category); the number is the plain margin ${per()}. ${nextW!=null?`Tap a category for ${weekName(nextW)}, their next meeting.`:''}`,
    CH.hbars(E.map(e=>{const dd=Math.abs(e.a-e.b),txt=e.c.pct?(dd<.001?dd.toFixed(4).replace(/^0/,''):f3(dd)):nf(dd,dp()),who=e.win>0?A.name:e.win<0?B.name:'Nobody';
      return {label:`${e.c.l}`,v:e.edge,txt,cls:pn(e.win),stat:link(e),tip:`${e.c.n}: ${fv(e.c,e.a)} vs ${fv(e.c,e.b)}. ${who} by ${txt}${e.c.neg?' (fewer)':''}${Math.abs(e.edge)<.25?' · close':''}`}}),{label:'Category edges'})
    +legend([['w',`${esc(A.name)} wins it`],['l',`${esc(B.name)} wins it`,'background:var(--neg-3)']]));
  // the players behind each edge
  const side=(t,c,win)=>{const d=drivers(t,c,2),pr=fvPair(c,A.line[c.k],B.line[c.k]);return `<div style="min-width:0"><div class="num" style="font:${win?'700':'500'} .9rem var(--mono);${win?'color:var(--pos-fg)':''}">${t===A?pr[0]:pr[1]}${win?' ✓':''}</div><div style="display:flex;flex-direction:column;gap:1px;margin-top:2px">${d.map(x=>`<button type="button" class="sx" data-stat="${esc('pc|'+x.p.name+'|'+c.k)}" data-tip="${esc(x.p.name+': '+(c.pct?(x.v==null?'–':f3(x.v))+' on '+nf(x.a,1)+' '+ATT[c.k]+', impact '+f2(x.imp):nf(x.v,dp())+' '+c.l+' '+per())+', '+pc(x.share)+' of the team'+(c.pct?'\'s attempts':''))}" style="font-size:.76rem;color:var(--muted);text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%">${esc(lastName(x.p.name))} ${c.pct?(x.v==null?'–':f3(x.v)):nf(x.v,dp())}</button>`).join('')}</div></div>`};
  h+=drillSec('Who drives each edge',`The two biggest contributors on each side${E.some(e=>e.c.pct)?'; for the percentages, the shooters who lift it most once volume is counted':''}${E.some(e=>e.c.neg)?'; for TO, the players who commit the most':''}. A tick marks the winner. Tap a name for that player in that category.`,
    `<div style="display:grid;grid-template-columns:3.2em minmax(0,1fr) minmax(0,1fr);gap:0 12px;align-items:start">
      <span></span><span class="lbl" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(A.name)}</span><span class="lbl" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(B.name)}</span>
      ${E.map(e=>`<div style="grid-column:1/-1;border-top:1px solid var(--soft);margin:7px 0"></div>${sbtn(`tc|${A.id}|${e.c.k}`,`<b style="font:600 .9rem var(--display);letter-spacing:.05em">${e.c.l}</b>`)}${side(A,e.c,e.win>0)}${side(B,e.c,e.win<0)}`).join('')}</div>`);
  // their real weeks on the schedule
  if(weeks.length)h+=drillSec('Their weeks on the schedule',`Every regular-season week these two meet. ${preseason?'No games have been played yet.':''} Tap a week for the full matchup.`,
    `<div class="weeks">${weeks.map(w=>{const q=mp(A.id,B.id,w),past=done(w);return `<button type="button" class="wk" data-stat="${esc(`mw|${A.id}|${B.id}|${w}`)}"${past?' style="opacity:.6"':''}><span class="lbl">${weekName(w)} · ${weekLabel(w)}${past?' · played':''}${w===curWeek&&!preseason&&!past?' · now':''}</span><b>${pc(q.win)} win chance</b><div class="wp"><span style="width:${pc(q.win)}"></span><em>${pc(q.win)} · ${q.exp.toFixed(1)}–${q.expL.toFixed(1)}</em></div><small>For ${esc(A.name)} · ${q.Pa.games.toFixed(0)} vs ${q.Pb.games.toFixed(0)} player-games</small></button>`}).join('')}</div>`);
  // trade angle: what each side has that the other lacks
  const need=(x,y)=>CATS.filter(c=>!(x.id===ME&&S.punt.has(c.k))&&x.catRank[c.k]>=7&&y.catRank[c.k]<=4).map(c=>c.l);
  const nA=need(A,B),nB=need(B,A),me=A.id===ME?B:B.id===ME?A:null;
  if(nA.length||nB.length)h+=`<div class="sub"><span class="lbl">Trade angle</span><p class="note" style="margin:0">${nA.length?`${esc(B.name)} is strong where ${esc(A.name)} is weak: ${nA.join(', ')}. `:''}${nB.length?`${esc(A.name)} is strong where ${esc(B.name)} is weak: ${nB.join(', ')}.`:''}</p>${me?`<div class="filters"><button type="button" class="btn sm ghost" data-go="trades" data-partner="${me.id}">Open the trade machine</button></div>`:''}</div>`;
  h+=how([`The top of this drill compares the two full rosters' category totals (${SEA()?'over the season':'per game'}), with no schedule, so it is the same result in every meeting. The weekly cards use the matchup model instead: the real NBA games in that week, the 11-starter daily limit and how much each category swings, so a team can be favored on paper and still an underdog in a light week.`,
    'A league spread is the standard deviation of the ten team totals in that category; it puts points and steals on the same scale, so a long bar means a decisive edge and a short one a coin flip. Drivers are the two biggest contributors on each side: per-game totals for counting stats, and for FG%, FT% and 3P% the made shots above a league-average shooter on the same attempts.']);
  return {eyebrow:`${esc(A.name)} vs ${esc(B.name)}`,title:`Head to head${back(esc(A.abbr)+' v '+esc(B.abbr))}`,sub:`Roster against roster ${scoreStr(r)}${weeks.length?` · they meet in week${weeks.length>1?'s':''} ${weeks.join(', ')}`:''}`,html:h}};

/* ---------- search shortcuts for your team ---------- */
CMDS.push({label:'My playoff odds',sub:'Seed chances, final record and the schedule left',kw:'playoffs odds seed chance standings sim',tag:'Drill',act:()=>openStat('tpo|'+ME)});
CMDS.push({label:'My power rank breakdown',sub:'What the score is made of and who is around you',kw:'power rank score grade',tag:'Drill',act:()=>openStat('tpr|'+ME)});
CMDS.push({label:'My games by week',sub:'Player-games each week and in the playoffs',kw:'games schedule weeks bench playoffs',tag:'Drill',act:()=>openStat('tgm|'+ME)});
CMDS.push({label:'My category record',sub:'Every category against every team',kw:'category record vs field results',tag:'Drill',act:()=>openStat('trec|'+ME)});
CMDS.push({label:'My weakest category',sub:'How far from the next team and the free agents who fix it',kw:'weak category gap free agents need',tag:'Drill',act:()=>{const t=tm(ME),c=CATS.filter(x=>!S.punt.has(x.k)).sort((a,b)=>t.catRank[b.k]-t.catRank[a.k])[0]||CATS[0];openStat(`tc|${ME}|${c.k}`)}});
CMDS.push({label:'Head to head with this week\'s opponent',sub:'Category by category, and the players behind each edge',kw:'h2h head to head opponent compare rosters',tag:'Drill',act:()=>{const o=oppOf(ME,Math.min(curWeek,REGW));if(o!=null)openStat(`h2h|${ME}|${o}`)}});
})();

</script>
<script>/* module: h1_overview.js */
/* h1_overview.js: the Stats tab's Overview (the league at a glance) and the Home "Insights" panel.
   HUB {k:'overview', order:10}: headline cards, this week's matchups, the playoff race, category leaders and the closest
   category races, Matt's strengths and holes, and the best values. Every number opens the drill that proves it.
   PANELS.home: "Insights", the 4-6 most useful findings for Matt's team, each one sentence that opens its drill.
   CMDS: one search entry per Stats view. Registers only; everything is computed at render time. */
(()=>{
const LAB=window.LAB=window.LAB||{};

/* ---------- small helpers ---------- */
const SEA=()=>S.mode==='season';
const per=()=>SEA()?'over the season':'a game';
const dp=()=>SEA()?0:1;
const mult=p=>SEA()?(p.gp||0):1;
const NOUN={pts:'points',reb:'rebounds',ast:'assists',stl:'steals',blk:'blocks',to:'turnovers'};
const MADE={fg:'made field goals',ft:'made free throws',tp:'made threes'};
const unit=c=>c.pct?MADE[c.k]:NOUN[c.k];
const tname=id=>esc(teamById[id]?teamById[id].name:'?');
const tabbr=id=>esc(teamById[id]?teamById[id].abbr:'?');
const fv=(c,v)=>fmtC(c,v,dp());
// two values that print the same get more decimals, so a near tie still shows who leads
const fvPair=(c,a,b)=>{const x=fv(c,a),y=fv(c,b);if(x!==y)return [x,y];const g=c.pct?v=>v.toFixed(4).replace(/^0/,''):v=>v.toFixed(dp()+2);return [g(a),g(b)]};
const upAmt=x=>{const d=dp(),m=10**d;return Math.max(1/m,Math.ceil(x*m-1e-9)/m).toFixed(d)};   // rounded up, so "passes" really passes
const rAmt=x=>{const a=Math.abs(x);return dp()&&a>0&&a<.005?'under 0.01':dp()&&a>0&&a<.1?a.toFixed(2):a.toFixed(dp())};
const one=(n,w)=>n==='1'?w.replace(/s$/,''):w;   // "1 more steal", not "1 more steals"
const passP=(c,x)=>{const n=upAmt(x);return c.neg?`${n} fewer ${one(n,'turnovers')} ${per()}`:c.pct?`${n} more ${one(n,MADE[c.k])} ${per()} at the same attempts`:`${n} more ${one(n,NOUN[c.k])} ${per()}`};
const gapP=(c,x)=>{const n=rAmt(x);return `${n} ${one(n,unit(c))} ${per()}`};
const live=c=>!S.punt.has(c.k);
const hasHub=k=>HUB.some(h=>h.k===k);
const stamp=()=>preseason?'Projections until games start on Oct 20.':`${weeksDone} of ${REGW} weeks played.`;

// how much team t needs to draw level with team o (>0 means o is ahead): counting stats in their own units (fewer, for TO),
// percentages in made shots at t's current attempts. Same arithmetic as the tc drill, so the numbers agree.
function sums(t,c){const ro=t.roster.filter(p=>p.pg);return {m:ro.reduce((s,p)=>s+(+p.pg[c.pct[0]]||0)*mult(p),0),a:ro.reduce((s,p)=>s+(+p.pg[c.pct[1]]||0)*mult(p),0)}}
function need(t,o,c){if(c.pct){const s=sums(t,c);return o.line[c.k]*s.a-s.m}return c.neg?t.line[c.k]-o.line[c.k]:o.line[c.k]-t.line[c.k]}
const word=rel=>rel<.25?'narrow':rel<.75?'clear':'commanding';

function titleOdds(){try{if(typeof LAB.titleOdds!=='function')return null;const r=LAB.titleOdds();
  return r&&typeof r==='object'&&M.teams.every(t=>r[t.id]&&isFinite(r[t.id].title))?r:null}catch(e){return null}}

/* ---------- shared numbers (memoized per model state) ---------- */
const catData=()=>memo('h1ov|cats|'+S.mode,()=>CATS.map(c=>{
  const vals=M.teams.map(t=>t.line[c.k]),m=mean(vals),sd=sdev(vals),order=[...M.teams].sort((a,b)=>a.catRank[c.k]-b.catRank[c.k]);
  const pairs=order.slice(0,-1).map((t,i)=>{const u=order[i+1];return {c,a:t,b:u,ra:i+1,rb:i+2,rel:Math.abs(t.line[c.k]-u.line[c.k])/sd,amt:Math.max(0,need(u,t,c))}});
  const pool=M.players.filter(p=>p.pg);
  const top=c.neg?[...pool].sort((a,b)=>b.pg.to-a.pg.to)[0]:[...pool].sort((a,b)=>b.zpg[c.k]-a.zpg[c.k])[0];
  const fa=c.neg?null:M.fas.filter(p=>p.pg).sort((a,b)=>b.zpg[c.k]-a.zpg[c.k])[0]||null;
  const z=t=>(t.line[c.k]-m)/sd*(c.neg?-1:1);
  return {c,m,sd,order,pairs,top,fa,z}}));
// this week's matchups, favourite first (Matt always first in his), closest first
const weekMus=w=>memo('h1ov|mus|'+w,()=>DATA.schedule.filter(x=>x[0]===w).map(([,x,y])=>{const f=mp(x,y,w);let a=x,b=y;
  if(y===ME||(x!==ME&&f.win<.5)){a=y;b=x}const o=mp(a,b,w);
  return {a,b,o,close:Math.abs(o.win-.5),swing:CATS.filter(c=>o.p[c.k]>=.38&&o.p[c.k]<.62).length,mine:a===ME||b===ME}}).sort((p,q)=>p.close-q.close));
const race=()=>memo('h1ov|race',()=>{const ss=seasonSim(),to=titleOdds();
  const rows=M.teams.map(t=>({t,s:ss[t.id],po:ss[t.id].po,title:to?to[t.id].title:null,avg:avgSeed(ss[t.id])})).sort((a,b)=>b.po-a.po||a.avg-b.avg);
  rows.forEach((r,i)=>r.rank=i+1);return {rows,to}});
const poG=()=>memo('h1ov|pog',()=>{const g=M.teams.map(t=>({id:t.id,g:PO_WEEKS.reduce((s,w)=>s+projTeam(t.id,w,0).games,0)})).sort((a,b)=>b.g-a.g);g.forEach((x,i)=>x.rank=i+1);return g});
// Matt's race in every category: what passes the team above, the cushion over the team below
const myRace=()=>memo('h1ov|myrace|'+S.mode,()=>{const t=tm(ME);return catData().map(d=>{const r=t.catRank[d.c.k],ab=d.order[r-2]||null,be=d.order[r]||null;
  return {...d,r,ab,be,up:ab?Math.max(0,need(t,ab,d.c)):null,upRel:ab?Math.abs(ab.line[d.c.k]-t.line[d.c.k])/d.sd:null,
    cush:be?Math.max(0,need(be,t,d.c)):null,cushRel:be?Math.abs(t.line[d.c.k]-be.line[d.c.k])/d.sd:null,zt:d.z(t)}})});

/* ---------- layout CSS (theme tokens only) ---------- */

.ov-mu:hover{background:var(--soft)}.ov-mu.me{background:var(--me)}

`)}
const hl=(lab,big,who,small,stat,me)=>`<button type="button" class="ov-hl${me?' me':''}" data-stat="${esc(stat)}"><span class="lbl">${lab}</span><b>${big}</b><span class="who">${who}</span>${small?`<small>${small}</small>`:''}</button>`;
const safe=(name,f)=>{try{return f()}catch(e){console.error('h1_overview',name,e);return ''}};

/* ---------- Overview sections ---------- */
function secGlance(){const w=Math.min(curWeek,REGW),mus=weekMus(w),R=race(),cd=catData(),pg=poG(),cards=[];
  const p1=[...M.teams].sort((a,b)=>a.pr-b.pr)[0];
  cards.push(hl('Power rank #1',p1.rr.toFixed(2),tname(p1.id),`categories won in an average week · grade ${p1.grade}`,'tpr|'+p1.id,p1.id===ME));
  if(R.to){const f=[...R.rows].sort((a,b)=>b.title-a.title)[0];cards.push(hl('Title favourite',pc(f.title),tname(f.t.id),`wins the title in ${pc(f.title)} of simulated seasons · playoffs ${pc(f.po)}`,'ttl|'+f.t.id,f.t.id===ME))}
  else{const f=R.rows[0];cards.push(hl('Playoff favourite',pc(f.po),tname(f.t.id),`makes the top five in ${pc(f.po)} of simulated seasons`,'tpo|'+f.t.id,f.t.id===ME))}
  if(mus.length){const c=mus[0],l=mus[mus.length-1];
    cards.push(hl(`Closest matchup · ${weekName(w)}`,`${pc(c.o.win)}–${pc(1-c.o.win)}`,`${tname(c.a)} vs ${tname(c.b)}`,`${c.o.exp.toFixed(1)}–${c.o.expL.toFixed(1)} expected categories`,`mw|${c.a}|${c.b}|${w}`,c.mine));
    if(mus.length>1)cards.push(hl(`Most lopsided · ${weekName(w)}`,pc(l.o.win),`${tname(l.a)} over ${tname(l.b)}`,`${l.o.exp.toFixed(1)}–${l.o.expL.toFixed(1)} expected categories`,`mw|${l.a}|${l.b}|${w}`,l.mine))}
  const mvp=M.players.filter(p=>p.value!=null).sort((a,b)=>b.value-a.value)[0];
  if(mvp)cards.push(hl('Most valuable player',f1(mvp.value),`${esc(mvp.name)} <span class="note">${esc(teamAbbr(mvp))}</span>`,`value across ${S.punt.size?'your unpunted':'all nine'} categories ${SEA()?'over the season':'per game'}`,'pv|'+mvp.name,mvp.team===ME));
  const fa=M.fas.filter(p=>p.value!=null).sort((a,b)=>b.value-a.value)[0];
  if(fa){const bc=CATS.filter(live).sort((a,b)=>fa.zpg[b.k]-fa.zpg[a.k])[0];cards.push(hl('Best free agent',f1(fa.value),esc(fa.name),`value · strongest in ${bc?bc.l:'–'} · ${esc(fa.nba)} ${esc(fa.pos)}`,'pv|'+fa.name))}
  const lead=cd.map(d=>d.pairs[0]).sort((a,b)=>b.rel-a.rel)[0];
  if(lead)cards.push(hl('Biggest category lead',rAmt(lead.amt),`${tname(lead.a.id)} in ${lead.c.l}`,`${unit(lead.c)} ${per()} ahead of #2 ${tname(lead.b.id)}`,`tc|${lead.a.id}|${lead.c.k}`,lead.a.id===ME));
  const g=pg[0];if(g)cards.push(hl('Most playoff games',g.g.toFixed(0),tname(g.id),`expected player-games in weeks ${PO_WEEKS[0]}-${PO_WEEKS[PO_WEEKS.length-1]}; the league average is ${mean(pg.map(x=>x.g)).toFixed(0)}`,'tgm|'+g.id,g.id===ME));
  return `<section class="panel">${head('At a glance',`The numbers that stand out in the league right now. ${stamp()} Tap any card for the breakdown.`)}<div class="ov-hls">${cards.join('')}</div>
    ${how(['Every card comes from the same model as the rest of the board: ESPN projections (blended with real games once they start), the real NBA schedule and the 11-starter daily lineup limit.',
      'Power rank and its "categories won in an average week" come from the League tab. Matchup chances are the chance of taking at least five of the nine categories that week. Value adds up a player\'s z-scores (how far above or below an average rostered player) in '+(S.punt.size?'the categories you have not punted':'all nine categories')+'.',
      'The biggest category lead compares the gap between the #1 and #2 teams with how spread out all ten teams are in that category, so a lead in points and a lead in blocks can be compared fairly. For percentages the gap is counted in made shots at the same attempts. Playoff games are expected player-games in the fantasy playoffs after the daily lineup limit.'])}</section>`}

function secWeek(){const w=Math.min(curWeek,REGW),mus=weekMus(w);if(!mus.length)return '';
  const over=curWeek>REGW&&!preseason;
  const card=(m,i)=>{const o=m.o,L=o.live,ma=m.a===ME;
    const tagTxt=i===0?'Closest':i===mus.length-1&&mus.length>1?'Most lopsided':'';
    return `<button type="button" class="ov-mu${m.mine?' me':''}" data-stat="mw|${m.a}|${m.b}|${w}" data-tip="${esc(`${teamById[m.a].name} ${pc(o.win)}, ${teamById[m.b].name} ${pc(1-o.win)} to win ${weekName(w)}`)}">
      <span class="ov-mu-h">${tagTxt?`<span class="lbl">${tagTxt}</span>`:''}${m.mine?'<span class="pill star">You</span>':''}${L?`<span class="pill live">Live ${L.score[0]}–${L.score[1]}${L.score[2]?'–'+L.score[2]:''}</span>`:''}<span class="pill ${tag(o.win)[1]}">${tag(o.win)[0]}</span></span>
      <span class="ov-mu-t"><i class="ov-sw${ma?' me':''}"></i><b>${tname(m.a)}</b><em>${pc(o.win)}</em></span>
      <span class="ov-mu-t"><i class="ov-sw b"></i><b>${tname(m.b)}</b><em>${pc(1-o.win)}</em></span>
      <span class="ov-split" aria-hidden="true"><i class="${ma?'me':''}" style="width:${(o.win*100).toFixed(1)}%"></i></span>
      <small>${o.exp.toFixed(1)}–${o.expL.toFixed(1)} expected categories · ${m.swing} swing categor${m.swing===1?'y':'ies'}</small></button>`};
  return `<section class="panel">${head(`${over?'Last regular-season week':preseason?'Up next':'This week'}: ${weekName(w)}`,`${weekLabel(w)}. Closest first. The bar is the first team's chance to win the week.`,`<button type="button" class="btn ghost" data-go="matchup" data-week="${w}" data-wkteam="${ME}">Full matchup</button>`)}
    <div class="ov-mus">${mus.map(card).join('')}</div>
    ${how(['Each card is one matchup, favourite listed first (your matchup always lists you first, in blue). Winning the week means taking at least five of the nine categories; the mark in the middle of the bar is 50%. The tag reads the first team\'s chance: Lock above 80%, Lean yes above 62%, Swing between 38% and 62%.',
      'Swing categories are ones where neither side is above 62%. Each team\'s week is built day by day from the real NBA schedule and the 11-starter limit'+(LIVEW===w?', starting from ESPN\'s live totals':'')+'.'])}</section>`}

function secRace(){const R=race(),rows=R.rows,row=r=>({label:tname(r.t.id),v:r.po*100,txt:pc(r.po),me:r.t.id===ME,stat:'tpo|'+r.t.id,
    tip:`${r.t.name}: playoffs ${pc(r.po)}, #1 seed ${pc(r.s.top)}${r.title!=null?', title '+pc(r.title):''}, average finish ${r.avg.toFixed(1)}, projected ${Math.round(r.s.w)}-${Math.round(r.s.l)} in categories`});
  const bars=o=>`<div class="ov-wide">${CH.hbars(o,{max:100,stack:true,label:'Playoff odds'})}</div>`;
  const me=rows.find(r=>r.t.id===ME),fifth=rows[4],sixth=rows[5],cards=[];
  cards.push(hl('Your odds',pc(me.po),`${ord(me.rank)}-best in the league`,`average finish ${me.avg.toFixed(1)}${me.title!=null?` · title ${pc(me.title)}`:''}`,'tpo|'+ME,true));
  if(fifth)cards.push(hl('Last spot in',pc(fifth.po),tname(fifth.t.id),'fifth-best odds',`tpo|${fifth.t.id}`,fifth.t.id===ME));
  if(sixth)cards.push(hl('First team out',pc(sixth.po),tname(sixth.t.id),'sixth-best odds',`tpo|${sixth.t.id}`,sixth.t.id===ME));
  if(R.to){const f=[...rows].sort((a,b)=>b.title-a.title)[0];cards.push(hl('Title favourite',pc(f.title),tname(f.t.id),`playoffs ${pc(f.po)}`,'ttl|'+f.t.id,f.t.id===ME))}
  const locks=rows.filter(r=>r.po>=.9).length,shots=rows.filter(r=>r.po<.1).length;
  return `<section class="panel">${head('Playoff race',`Five of ten make the playoffs. ${locks?`${locks} team${locks>1?'s are':' is'} above 90%`:'No team is above 90%'}${shots?`, ${shots} below 10%`:''}. Your team is in blue.`)}
    ${bars(rows.slice(0,5).map(row))}<div class="ov-cut">Playoff line</div>${bars(rows.slice(5).map(row))}
    <div class="ov-hls sm">${cards.join('')}</div>
    ${how(['Odds come from 4,000 simulated seasons: every remaining regular-season week is played category by category with the matchup model, and the top five by category win percentage make the playoffs. ESPN\'s tiebreakers are not modelled. Teams are ordered by playoff odds, so the line falls between the five most likely playoff teams and the rest.'+(R.to?' Title odds come from the Season sim view, which plays out an assumed five-team bracket.':''),
      'Each bar\'s tooltip also shows the #1-seed odds, the average finish and the projected final category record: the record so far plus the expected results of every week left.'])}</section>`}

function secCats(){const cd=catData(),me=tm(ME);
  const card=d=>{const c=d.c,t1=d.order[0],t2=d.order[1],r=me.catRank[c.k],gap=d.pairs[0],[v1,v2]=fvPair(c,t1.line[c.k],t2.line[c.k]);
    const pl=(lab,p,isFa)=>{if(!p)return '';const v=c.pct?`${f3(p.pct[c.k])} <span class="note">on ${(+p.pg[c.pct[1]]||0).toFixed(1)}</span>`:(+p.pg[c.k]).toFixed(1);
      return `<div class="ov-kv"><span class="lbl">${lab}</span>${sbtn(`pc|${p.name}|${c.k}`,esc(p.name))}<span class="v">${v}</span><small>${isFa?'Free agent':esc(teamById[p.team]?teamById[p.team].name:'')} · ${esc(p.nba)} · per game</small></div>`};
    return `<div class="ov-cat${S.punt.has(c.k)?' punted':''}"><div class="ov-cat-h">${sbtn('lc|'+c.k,c.l)}<span class="note">${c.n}${c.neg?', fewer is better':''}</span><button type="button" class="pill ${rc(r)}" data-stat="tc|${ME}|${c.k}" title="Your rank in ${c.n}">You #${r}</button></div>
      <div class="ov-kv lead"><span class="lbl">${c.neg?'Fewest':'Leader'}</span>${sbtn(`tc|${t1.id}|${c.k}`,tname(t1.id))}<span class="v">${v1}</span><small>${word(gap.rel)} lead: ${gapP(c,gap.amt)} ${c.neg?'fewer than':'ahead of'} ${tname(t2.id)} (${v2})</small></div>
      ${pl(c.neg?'Most turnovers':c.pct?'Best impact':'Top player',d.top,false)}${c.neg?'':pl('Best free agent',d.fa,true)}</div>`};
  const pairs=cd.flatMap(d=>d.pairs).sort((a,b)=>a.rel-b.rel).slice(0,6);
  const race=x=>{const c=x.c,[va,vb]=fvPair(c,x.a.line[c.k],x.b.line[c.k]),mine=x.a.id===ME||x.b.id===ME;
    return `<li class="ov-race${mine?' me':''}">${sbtn('lc|'+c.k,c.l)}<span class="tm"><span>#${x.ra} ${sbtn(`tc|${x.a.id}|${c.k}`,tname(x.a.id))} <code>${va}</code></span><i>vs</i><span>#${x.rb} ${sbtn(`tc|${x.b.id}|${c.k}`,tname(x.b.id))} <code>${vb}</code></span><small>${gapP(c,x.amt)} apart</small></span><span class="pill ${x.rel<.05?'p2':'p1'}">${x.rel<.05?'Dead heat':'Tight'}</span></li>`};
  return `<section class="panel">${head('Category leaders',`Who leads each category by roster totals ${per()}, how safe the lead is, and the best players. Tap a category, team or player for the breakdown.`)}
    <div class="ov-cats">${cd.map(card).join('')}</div>
    <h3>Closest races</h3><p class="note">Teams next to each other in a category's standings, closest first. Small moves here change ranks.</p>
    <ul class="ov-races">${pairs.map(race).join('')}</ul>
    ${how([`Team totals add up every rostered player's projected numbers ${SEA()?'over the season':'per game'}; FG%, FT% and 3P% are total makes over total attempts. That is roster strength before the weekly schedule and the daily lineup limit, which the matchup odds handle.`,
      'Top player is the best per-game number among rostered players. For the percentages it is impact (how far above the league average, times attempts; the number after the percentage is attempts a game), so a high-volume shooter beats a 3-for-3 bench player. For TO the card shows the player with the most turnovers, the biggest drag on a team.',
      'A lead or gap is measured against how spread out the ten teams are in that category (their standard deviation), so races in different categories can be compared: a lead under a quarter of that spread is narrow, up to three quarters is clear, and beyond is commanding. A race under 5% of it is a dead heat. The plain number is what separates the teams; for percentages it is made shots at the same attempts.'])}</section>`}

function secMine(){const t=tm(ME),rr=myRace(),pg=poG(),gi=pg.find(x=>x.id===ME),vr=[...M.teams].sort((a,b)=>b.value-a.value).findIndex(x=>x.id===ME)+1;
  const cards=[hl('Vs the field',scoreStr(t.rec),'category record, roster against roster',`favoured against ${t.rec.mw} of 9 teams`,'trec|'+ME,true),
    hl('Power rank',`#${t.pr}`,`grade ${t.grade}`,`${t.rr.toFixed(2)} categories in an average week`,'tpr|'+ME,true),
    hl('Team value',f1(t.value),`${ord(vr)} of 10`,'sum of every player\'s value','tval|'+ME,true),
    hl('Playoff games',gi?gi.g.toFixed(0):'–',gi?`${ord(gi.rank)} of 10`:'',`expected player-games in weeks ${PO_WEEKS[0]}-${PO_WEEKS[PO_WEEKS.length-1]}`,'tgm|'+ME,true)];
  const bars=[...rr].sort((a,b)=>b.zt-a.zt).map(d=>({label:`${d.c.l} <small>#${d.r}</small>`,v:d.zt,txt:fv(d.c,t.line[d.c.k]),stat:`tc|${ME}|${d.c.k}`,cls:S.punt.has(d.c.k)?'':d.zt>=0?'pos':'neg',
    tip:`${d.c.n}: ${fv(d.c,t.line[d.c.k])} ${per()}, #${d.r} of 10; league average ${fv(d.c,d.m)}${S.punt.has(d.c.k)?' (punted)':''}`}));
  const cell=(d,txt,sub)=>`<td class="num" ${sx(`tc|${ME}|${d.c.k}`)}>${txt}${sub?`<span class="rk">${sub}</span>`:''}</td>`;
  const tbl=`<div class="scroll"><table><thead><tr><th class="l stick" scope="col">Category</th><th scope="col">Rank</th><th scope="col">Total</th><th scope="col" title="How much more passes the team ranked just above">To pass next</th><th scope="col" title="How much the team just below needs to catch you">Lead on next</th></tr></thead><tbody>
    ${rr.map(d=>`<tr class="${S.punt.has(d.c.k)?'punted':''}"><td class="l stick">${sbtn('lc|'+d.c.k,`<b>${d.c.l}</b>`)}</td><td class="z ${rc(d.r)}" ${sx(`tc|${ME}|${d.c.k}`)}>#${d.r}</td>${cell(d,fv(d.c,t.line[d.c.k]))}${d.ab?cell(d,(d.c.neg?'−':'+')+upAmt(d.up),'past '+tabbr(d.ab.id)):cell(d,'–','leader')}${d.be?cell(d,rAmt(d.cush),'over '+tabbr(d.be.id)):cell(d,'–','last')}</tr>`).join('')}</tbody></table></div>`;
  return `<section class="panel">${head(`Your team: ${tname(ME)}`,'Strengths and holes against the rest of the league. Longer bars to the right are better (TO is flipped).',`<button type="button" class="btn ghost" data-team="${ME}">Team page</button>`)}
    <div class="ov-hls sm">${cards.join('')}</div>
    ${CH.hbars(bars,{center:true,label:'Your categories against the league average'})}
    <div class="legend"><span><i class="pos"></i>Above the league average</span><span><i class="neg"></i>Below</span>${S.punt.size?'<span><i class="mut"></i>Punted</span>':''}</div>
    ${tbl}
    ${how([`Bars show how far your roster total sits above or below the average of the ten teams in each category, measured in how spread out the teams are (TO is flipped, so longer to the right is always better). The number at the end is your total ${per()}.`,
      'To pass next is how much more you would need to draw level with the team ranked just above you, rounded up so it really passes; for percentages it counts extra made shots at your current attempts, and for TO it is turnovers to cut. Lead on next is how much the team just below would need to catch you. Punted categories stay in the table, faded, because the league still counts them.'])}</section>`}

function secValues(){const top=M.players.filter(p=>p.value!=null).sort((a,b)=>b.value-a.value).slice(0,10);
  const bars=top.map(p=>({label:`${esc(p.name)} <small>${esc(teamAbbr(p))}</small>`,v:p.value,txt:f1(p.value),me:p.team===ME,stat:'pv|'+p.name,tip:`${p.name}: value ${f1(p.value)}, #${p.rank} of the rostered players, trade value ${p.tv.toFixed(0)}`}));
  const fas=M.fas.filter(p=>p.value!=null).sort((a,b)=>b.value-a.value).slice(0,3);
  const steals=M.players.filter(p=>p.draftPick&&p.rank).map(p=>({p,d:p.draftPick-p.rank})).sort((a,b)=>b.d-a.d).slice(0,3);
  const li=(stat,name,v,small)=>`<li>${sbtn(stat,name)}<span class="v">${v}</span><small>${small}</small></li>`;
  return `<section class="panel">${head('Best values',`The most valuable rostered players${S.punt.size?' for your build':''} ${SEA()?'over the season':'per game'}; your players are in blue.`)}
    <div class="ov-wide">${CH.hbars(bars,{stack:true,label:'Top ten players by value'})}</div>
    <div class="cols"><div class="drill-sec"><h3>Best free agents</h3><ul class="ov-list">${fas.map(p=>{const bc=CATS.filter(live).sort((a,b)=>p.zpg[b.k]-p.zpg[a.k]).slice(0,2).map(c=>c.l).join(' and ');
        return li('pv|'+p.name,esc(p.name),f1(p.value),`${esc(p.nba)} · ${esc(p.pos)} · strongest in ${bc}`)}).join('')||'<li><small>No free agents with data.</small></li>'}</ul></div>
      <div class="drill-sec"><h3>Draft steals</h3><ul class="ov-list">${steals.map(x=>li('dpk|'+x.p.draftPick,`${esc(x.p.name)} <span class="note">pick ${pickStr(x.p.draftPick)}</span>`,`#${x.p.rank}`,`Taken ${ord(x.p.draftPick)} overall, ranks ${ord(x.p.rank)} by value · ${tname(x.p.team)}`)).join('')}</ul></div></div>
    ${how([`Value adds up a player's z-scores in every category ${S.punt.size?'you have not punted':''}: how far above or below an average rostered player they are, ${SEA()?'over the season, so games played count':'per game'}. FG%, FT% and 3P% use impact, so shot volume counts.`,
      'Draft steals compare where a player went in this league\'s draft with where they rank by value among rostered players now. Players added after the draft are not counted.'])}</section>`}

function vOverview(){css();
  return safe('glance',secGlance)+`<div class="cols">${safe('week',secWeek)}${safe('race',secRace)}</div>`+safe('cats',secCats)+`<div class="cols">${safe('mine',secMine)}${safe('values',secValues)}</div>`}

/* ---------- Insights for Matt's team (Home) ---------- */
function insights(){const t=tm(ME),out=[],w=Math.min(curWeek,REGW),regLeft=curWeek<=REGW,rr=myRace();
  // 1. the category that decides this week's matchup: the one whose result moves the win chance most, weighed by how open it is
  const opp=regLeft?oppOf(ME,w):null;
  if(opp!=null){const o=mp(ME,opp,w),sc=CATS.map(c=>{const w1=matchOdds({...o.p,[c.k]:1}).win,w0=matchOdds({...o.p,[c.k]:0}).win;return {c,w1,w0,s:(w1-w0)*Math.sqrt(o.p[c.k]*(1-o.p[c.k]))}}).sort((a,b)=>b.s-a.s)[0];
    if(sc&&sc.s>0)out.push({k:preseason?'Up next':'This week',tone:'',stat:`mc|${ME}|${opp}|${w}|${sc.c.k}`,
      t:`${weekName(w)} against ${tname(opp)} turns on <b>${sc.c.l}</b> (you win it ${pc(o.p[sc.c.k])} of the time): take it and your chance to win the week goes from ${pc(o.win)} to <b>${pc(sc.w1)}</b>, lose it and it drops to <b>${pc(sc.w0)}</b>.`})}
  // 2. playoff odds and the cut line
  const R=race(),me=R.rows.find(r=>r.t.id===ME),cut=me.rank<=5?R.rows[5]:R.rows[4];
  if(me){const ttl=me.title!=null?` and win the title in <b>${pc(me.title)}</b>`:'';
    out.push({k:'Playoffs',tone:me.po>=.65?'good':me.po<.35?'bad':'',stat:'tpo|'+ME,
      t:me.po>=.999?`You are in the playoffs${ttl}.`:me.po<=.001?'You are out of the playoff race.':
        `You make the playoffs in <b>${pc(me.po)}</b> of 4,000 simulated seasons${ttl}, the ${ord(me.rank)}-best odds; ${cut?`${me.rank<=5?'the first team out':'the last team in'}, ${tname(cut.t.id)}, is at ${pc(cut.po)}`:''}.`})}
  // 3. cheapest climb (unpunted categories)
  const climbs=rr.filter(d=>live(d.c)&&d.ab).sort((a,b)=>a.upRel-b.upRel),worst=rr.filter(d=>live(d.c)).sort((a,b)=>b.r-a.r||a.zt-b.zt)[0];
  const cl=climbs.find(d=>!worst||d.c.k!==worst.c.k)||climbs[0];
  if(cl)out.push({k:'Cheapest climb',tone:'',stat:`tc|${ME}|${cl.c.k}`,
    t:`<b>${passP(cl.c,cl.up)}</b> would lift you from #${cl.r} to #${cl.r-1} in ${cl.c.l}, past ${tname(cl.ab.id)}: your smallest gap to the next team in any category.`});
  // 4. biggest hole
  if(worst&&worst.r>=6){const big=worst.ab&&worst.upRel>1;
    out.push({k:'Weakest category',tone:'bad',stat:`tc|${ME}|${worst.c.k}`,
      t:`${worst.c.l} is your weakest category at <b>#${worst.r} of 10</b>${worst.ab?`, ${gapP(worst.c,worst.up)} behind ${tname(worst.ab.id)} at #${worst.r-1}`:''}${big?', a gap big enough to make it a natural punt':''}.`})}
  // 5. biggest strength, and the cushion it gives in trades
  const best=rr.filter(d=>live(d.c)).sort((a,b)=>a.r-b.r||(b.cushRel??0)-(a.cushRel??0))[0];
  if(best&&best.r<=4&&best.be)out.push({k:'Strongest category',tone:'good',stat:`tc|${ME}|${best.c.k}`,
    t:best.r===1?`You lead the league in ${best.c.l} by <b>${gapP(best.c,best.cush)}</b> over ${tname(best.be.id)}, room to trade some of it away and stay #1.`
      :`${best.c.l} is your best category at <b>#${best.r}</b>, ${gapP(best.c,best.cush)} clear of ${tname(best.be.id)} at #${best.r+1}.`});
  // 6. games in the fantasy playoffs, when they stand out
  const pg=poG(),gi=pg.find(x=>x.id===ME);
  if(gi&&(gi.rank<=3||gi.rank>=8)){const avg=mean(pg.map(x=>x.g));
    out.push({k:'Playoff schedule',tone:gi.rank<=3?'good':'bad',stat:'tgm|'+ME,
      t:`Your roster has about <b>${gi.g.toFixed(0)}</b> expected player-games in the fantasy playoffs (weeks ${PO_WEEKS[0]}-${PO_WEEKS[PO_WEEKS.length-1]}), <b>${ord(gi.rank)} of 10</b>${gi.rank===1?`, ${(gi.g-avg).toFixed(0)} more than the league average`:`; ${tname(pg[0].id)} leads with ${pg[0].g.toFixed(0)}`}.`})}
  // 7. the toughest week ahead
  if(regLeft){const nx=WEEKS.filter(x=>x>w&&x<=Math.min(w+5,REGW)).map(x=>{const op=oppOf(ME,x);return op==null?null:{x,op,q:mp(ME,op,x)}}).filter(Boolean).sort((a,b)=>a.q.win-b.q.win)[0];
    if(nx)out.push({k:'Toughest week ahead',tone:nx.q.win<.35?'bad':'',stat:`mw|${ME}|${nx.op}|${nx.x}`,
      t:`Your toughest week of the next ${Math.min(5,REGW-w)} is ${weekName(nx.x)} against ${tname(nx.op)}, with a <b>${pc(nx.q.win)}</b> chance to win it.`})}
  // 8. roster against roster, as a fallback
  out.push({k:'Vs the field',tone:t.rec.mw>=5?'good':t.rec.mw<=3?'bad':'',stat:'trec|'+ME,
    t:`Roster against roster, you would beat <b>${t.rec.mw} of the other 9 teams</b> (${scoreStr(t.rec)} in categories).`});
  return out.slice(0,6)}

function panelInsights(){css();const ins=insights();if(!ins.length)return '';
  return `<section class="panel" id="ov-insights">${head('Insights','The most useful things the numbers say about your team right now. Tap one to see the proof.')}
    <ul class="ov-insl">${ins.map(x=>`<li><button type="button" class="ov-in ${x.tone}" data-stat="${esc(x.stat)}"><span class="dot" aria-hidden="true"></span><span class="bd"><span class="lbl">${x.k}</span><span class="tx">${x.t}</span></span><span class="go"><b>See why </b>›</span></button></li>`).join('')}</ul>

<script>/* module: h2_cats.js */
