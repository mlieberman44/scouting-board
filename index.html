/* ---------- extension points: stat drill-downs, the stats lab, search commands ----------
   Modules (app/mods/*.js, each inlined as its own <script> between the core and the boot script) register here.
   DRILL[type]=(...args)=>({eyebrow,title,sub,html})   opened by any element carrying data-stat="type|arg|arg" (see sx/sbtn)
   HUB.push({k,label,note,render})                      a view in the Stats tab; render() returns one or more <section class="panel">
   CMDS.push({label,sub,kw,tag,act})                    extra search results (type "/" anywhere)
   S.x                                                  module state; data-set="key=value" on a button, or <select data-setk="key">, sets S.x[key] and re-renders */
const DRILL={}, HUB=[], CMDS=[];
// PANELS.home/team/player/matchup: functions returning extra HTML placed inside those core views
//   home()  after the to-do and category profile row · team(teamId) after the roster · player(name) inside the player sheet, after the stat lines · matchup(teamId,oppId,week) at the end
const PANELS={home:[],team:[],player:[],matchup:[]};
const panels=(where,...a)=>(PANELS[where]||[]).map(f=>{try{return f(...a)||''}catch(e){console.error('panel',where,e);return ''}}).join('');
// memo(key,fn): computed once per model state (recompute() bumps GEN when punts, value mode or rankings change)
let GEN=0;const MEMO=new Map();
function memo(k,f){const key=GEN+'|'+k;if(!MEMO.has(key)){if(MEMO.size>500)MEMO.clear();MEMO.set(key,f())}return MEMO.get(key)}
const sx=d=>`data-stat="${esc(d)}"`;
// modules add their own layout CSS once (theme tokens only): addCSS('mymod-css', '.x{...}')
const addCSS=(id,css)=>{if(document.getElementById(id))return;const el=document.createElement('style');el.id=id;el.textContent=css;document.head.appendChild(el)};
const sbtn=(d,html,cls='')=>`<button type="button" class="sx ${cls}" data-stat="${esc(d)}">${html}</button>`;
// wiring helpers: a drill cell that is also a tab stop (small tables), a category control for sortable headers,
// and category headers that open the league-wide category drill (sortable when a view is given)
const sxk=d=>`${sx(d)} tabindex="0"`;
const lcBtn=c=>`<button type="button" class="thx" data-stat="${esc('lc|'+c.k)}" aria-label="${esc(c.n)} across the league" data-tip="${esc(c.n)} across the league">${icon('stats')}</button>`;
const lcHeads=(view,prefix='',extra)=>CATS.map(c=>{const cls=(S.punt.has(c.k)?'punted ':'')+(extra?extra(c):'');return view?th(view,prefix+c.k,c.l+lcBtn(c),cls.trim()):`<th scope="col" class="${cls.trim()}">${sbtn('lc|'+c.k,c.l)}</th>`}).join('');
const catOf=k=>CATS.find(c=>c.k===k);
// a category's per-game value from a stat line (null when the line has no attempts for a percentage)
const catV=(ln,c)=>!ln?null:c.pct?(ln[c.pct[1]]?ln[c.pct[0]]/ln[c.pct[1]]:null):ln[c.k];
const fmtC=(c,v,dp)=>v==null||!isFinite(v)?'–':c.pct?f3(v):v.toFixed(dp??1);
const better=(c,a,b)=>c.neg?a<b:a>b;
// share of the values that v beats (ties count half); for "lower is better" categories pass neg
const pctl=(arr,v,neg)=>{const n=arr.length;if(!n||v==null)return null;let lo=0,eq=0;arr.forEach(x=>{if(x===v)eq++;else if(neg?x>v:x<v)lo++});return (lo+Math.max(0,eq-1)/2)/Math.max(1,n-1)};
const rankIn=(arr,v,neg)=>1+arr.filter(x=>neg?x<v:x>v).length;
const ord=n=>{const v=n%100;return n+(v>=11&&v<=13?'th':({1:'st',2:'nd',3:'rd'}[n%10]||'th'))};
const S_X=(k,d)=>S.x[k]??d;
const drillSec=(title,note,body)=>`<div class="drill-sec">${title?`<h3>${title}</h3>`:''}${note?`<p class="note">${note}</p>`:''}${body}</div>`;
const fact=(lab,big,small,stat)=>stat?`<button type="button" class="fact" data-stat="${esc(stat)}"><span>${lab}</span><b>${big}</b>${small?`<small>${small}</small>`:''}</button>`:`<div class="fact"><span>${lab}</span><b>${big}</b>${small?`<small>${small}</small>`:''}</div>`;

function sheetStat(desc){const parts=String(desc).split('|'),type=parts[0],fn=DRILL[type];let r=null;
  try{r=fn?fn(...parts.slice(1)):null}catch(e){console.error('drill',desc,e);r=null}
  if(!r)r={title:'No breakdown',html:'<div class="empty">This number has no breakdown yet.</div>'};
  const top=S.stack[S.stack.length-1];if(top)top.t=r.back||String(r.title).replace(/<[^>]+>/g,'');
  return `<div class="sheet-h"><div>${r.eyebrow?`<span class="eyebrow">${r.eyebrow}</span>`:''}<h2 id="sheet-title">${r.title}</h2>${r.sub?`<p class="note">${r.sub}</p>`:''}</div><button type="button" class="iconbtn" data-close aria-label="Close">${icon('close')}</button></div>${r.html||''}`}

function vStats(){
  if(!HUB.length)return `<section class="panel">${head('Stats lab','')}<div class="empty">Nothing here yet.</div></section>`;
  const hubs=[...HUB].sort((a,b)=>(a.order??50)-(b.order??50));
  if(!hubs.some(h=>h.k===S.hub))S.hub=hubs[0].k;
  const h=hubs.find(x=>x.k===S.hub);let body;
  try{body=h.render()}catch(e){console.error('stats view',h.k,e);body=`<section class="panel"><div class="empty">This view hit an error. Try another one.</div></section>`}
  return `<section class="panel lab-intro">${head('Stats lab',h.note||'',seg('hub',S.hub,hubs.map(x=>[x.k,x.label]),'Stats views','wide'))}</section>${body}`}

/* ---------- tooltip for chart marks and dense cells: any element with data-tip ---------- */
const TIP=()=>document.getElementById('tip');
function hideTip(){const t=TIP();if(t)t.hidden=true}
function placeTip(x,y){const t=TIP(),w=t.offsetWidth,h=t.offsetHeight;let l=x+14,tp=y+16;
  if(l+w>innerWidth-8)l=Math.max(8,x-w-12);if(tp+h>innerHeight-8)tp=Math.max(8,y-h-12);t.style.transform=`translate(${Math.round(l)}px,${Math.round(tp)}px)`}
document.addEventListener('pointerover',e=>{const el=e.target.closest&&e.target.closest('[data-tip]');const t=TIP();if(!t)return;if(!el){t.hidden=true;return}
  t.textContent=el.dataset.tip;t.hidden=false;placeTip(e.clientX,e.clientY)});
document.addEventListener('pointermove',e=>{const t=TIP();if(t&&!t.hidden)placeTip(e.clientX,e.clientY)});
document.addEventListener('focusin',e=>{const el=e.target.closest&&e.target.closest('[data-tip]');const t=TIP();if(!t)return;if(!el){t.hidden=true;return}
  const r=el.getBoundingClientRect();t.textContent=el.dataset.tip;t.hidden=false;placeTip(r.left+r.width/2,r.bottom)});
window.addEventListener('scroll',hideTip,{passive:true,capture:true});

/* ---------- charts: small SVG and HTML charts drawn with the theme tokens ----------
   One axis per chart, thin marks with 4px rounded data ends, recessive grid, text in text tokens, a tooltip on every mark.
   Series colors s1 s2 s3 (validated for color-vision deficiency in both themes); the accent marks "this one"; s2 marks your team. */
const CH={};
const _f=x=>Math.round(x*10)/10;
function niceTicks(lo,hi,n=4){if(!(hi>lo)){hi=lo+1}const span=hi-lo,step0=span/n,mag=Math.pow(10,Math.floor(Math.log10(step0))),err=step0/mag,step=(err>=7.5?10:err>=3.5?5:err>=1.5?2:1)*mag;
  const a=Math.ceil(lo/step-1e-9)*step,out=[];for(let v=a;v<=hi+1e-9;v+=step)out.push(+v.toFixed(10));return out}
CH.ticks=niceTicks;
// horizontal bars, one row per item: [{label,v,txt,hi,me,stat,tip,cls}]; diverging around zero when any value is negative
CH.hbars=(rows,o={})=>{if(!rows.length)return '<div class="empty">No data.</div>';
  const vals=rows.map(r=>r.v).filter(v=>v!=null&&isFinite(v)),neg=!!o.center||vals.some(v=>v<0),mx=o.max??Math.max(...vals.map(Math.abs),1e-9),mn=neg?-(o.max??mx):0;
  const X=v=>(v-mn)/(mx-mn)*100,z=X(0);
  return `<div class="hb${o.stack?' stack':''}" ${o.label?`role="list" aria-label="${esc(o.label)}"`:''}>${rows.map(r=>{const v=r.v,ok=v!=null&&isFinite(v),l=ok?Math.min(X(v),z):z,w=ok?Math.abs(X(v)-z):0;
    const cls=r.cls||(r.hi?'hi':r.me?'me':neg?(v<0?'neg':'pos'):'');
    const inner=`<span class="hb-l">${r.label}</span><span class="hb-b">${neg?`<span class="zero" style="left:${_f(z)}%"></span>`:''}<i class="${cls}" style="left:${_f(l)}%;width:${_f(Math.max(w,ok&&v!==0?.6:0))}%"></i></span><span class="hb-v">${r.txt??(ok?(o.fmt?o.fmt(v):v.toFixed(1)):'–')}</span>`;
    const tip=r.tip?` data-tip="${esc(r.tip)}"`:'';
    return r.stat?`<button type="button" class="hb-r ${r.hi?'hi':''}" data-stat="${esc(r.stat)}"${tip} role="listitem">${inner}</button>`:`<div class="hb-r ${r.hi?'hi':''}"${tip} role="listitem">${inner}</div>`}).join('')}</div>`};
// dot strip: where one value sits among many. items [{v,label,hi,me,stat}]; o.fmt, o.rev (lower is better: better stays on the right)
CH.strip=(items,o={})=>{const it=items.filter(x=>x.v!=null&&isFinite(x.v));if(!it.length)return '<div class="empty">No data.</div>';
  const W=640,H=o.h||96,pad=18,vs=it.map(x=>x.v),lo=Math.min(...vs),hi=Math.max(...vs),span=(hi-lo)||1;
  const X=v=>{const t=(v-lo)/span;return pad+(o.rev?1-t:t)*(W-2*pad)},base=H-26,r=4;
  const sorted=[...it].sort((a,b)=>X(a.v)-X(b.v)),rows=[];
  sorted.forEach(d=>{const x=X(d.v);let k=0;while((rows[k]||[]).some(px=>Math.abs(px-x)<2*r+1))k++;(rows[k]=rows[k]||[]).push(x);d._x=x;d._y=base-8-k*(2*r+1)});
  const ymin=Math.min(...sorted.map(d=>d._y));const top=Math.min(0,ymin-(it.some(d=>d.hi)?32:12));
  const med=[...vs].sort((a,b)=>a-b)[Math.floor(vs.length/2)],fmt=o.fmt||(v=>v.toFixed(1));
  const dots=sorted.filter(d=>!d.hi).map(d=>`<circle class="dot ${d.me?'me':''}" cx="${_f(d._x)}" cy="${_f(d._y)}" r="${r}" data-tip="${esc(d.label+' · '+fmt(d.v))}"${d.stat?` data-stat="${esc(d.stat)}"`:''}/>`).join('');
  const his=sorted.filter(d=>d.hi).map(d=>{const anchor=d._x<W*.2?'start':d._x>W*.8?'end':'middle';const ly=ymin-16;return `<line class="ax" x1="${_f(d._x)}" x2="${_f(d._x)}" y1="${_f(ly+4)}" y2="${_f(d._y-7)}"/><circle class="dot hi" cx="${_f(d._x)}" cy="${_f(d._y)}" r="6.5" data-tip="${esc(d.label+' · '+fmt(d.v))}"/><text class="ink" x="${_f(d._x)}" y="${_f(ly)}" text-anchor="${anchor}">${esc(d.label)} · ${esc(fmt(d.v))}</text>`}).join('');
  const lx=o.rev?W-pad:pad,hx=o.rev?pad:W-pad;
  return `<div class="chwrap"><svg class="ch" viewBox="0 ${_f(top)} ${W} ${_f(H-top)}" role="img" aria-label="${esc(o.label||'Distribution')}">
    <line class="ax" x1="${pad}" x2="${W-pad}" y1="${base}" y2="${base}"/><line class="md" x1="${_f(X(med))}" x2="${_f(X(med))}" y1="${_f(Math.max(top+14,ymin-6))}" y2="${base}"/>
    ${dots}${his}
    <text x="${lx}" y="${base+16}" text-anchor="${o.rev?'end':'start'}">${esc(fmt(lo))}${o.rev?'':' · worst'}</text><text x="${_f(X(med))}" y="${base+16}" text-anchor="middle">median ${esc(fmt(med))}</text><text x="${hx}" y="${base+16}" text-anchor="${o.rev?'start':'end'}">${o.rev?'':'best · '}${esc(fmt(hi))}</text></svg></div>`};
// radar for up to three series over the nine categories; vals are 0..1 (percentiles). series [{name,vals,cls:'s1'|'s2'|'s3'}]
CH.radar=(series,axes,o={})=>{const W=360,cx=W/2,cy=W/2,R=128,n=axes.length,ang=i=>-Math.PI/2+i*2*Math.PI/n,pt=(i,v)=>[cx+Math.cos(ang(i))*R*v,cy+Math.sin(ang(i))*R*v];
  const rings=[.25,.5,.75,1].map(t=>`<polygon class="gr" fill="none" points="${axes.map((_,i)=>pt(i,t).map(_f).join(',')).join(' ')}"/>`).join('');
  const spokes=axes.map((_,i)=>{const [x,y]=pt(i,1);return `<line class="gr" x1="${cx}" y1="${cy}" x2="${_f(x)}" y2="${_f(y)}"/>`}).join('');
  const labels=axes.map((a,i)=>{const [x,y]=pt(i,1.17);return `<text class="ink" x="${_f(x)}" y="${_f(y+4)}" text-anchor="middle">${esc(a.l)}</text>`}).join('');
  const polys=series.map(s=>`<polygon class="area ${s.cls}" points="${s.vals.map((v,i)=>pt(i,Math.max(.02,v||0)).map(_f).join(',')).join(' ')}"/>`+s.vals.map((v,i)=>{const [x,y]=pt(i,Math.max(.02,v||0));return `<circle class="${s.cls}" cx="${_f(x)}" cy="${_f(y)}" r="4" stroke="var(--panel)" stroke-width="1.5" data-tip="${esc(s.name+' · '+axes[i].l+': better than '+Math.round((v||0)*100)+'%'+(o.of?' of '+o.of:''))}"${s.stats?` data-stat="${esc(s.stats[i])}"`:''}/>`}).join('')).join('');
  const legend=series.length>1?`<div class="legend">${series.map(s=>`<span><i class="${s.cls}"></i>${esc(s.name)}</span>`).join('')}</div>`:'';
  return `<div class="chwrap" style="max-width:440px;margin:0 auto;width:100%"><svg class="ch" viewBox="-30 -14 ${W+60} ${W+28}" role="img" aria-label="${esc(o.label||'Category profile')}">${rings}${spokes}${polys}${labels}</svg>${legend}</div>`};
// bars for a discrete distribution (categories won 0..9, seeds 1..10): items [{x,p,cls,stat}]
CH.dist=(items,o={})=>{const W=520,H=150,pad=22,bw=(W-2*pad)/items.length,mx=Math.max(...items.map(d=>d.p),1e-9),bh=H-42;
  return `<div class="chwrap"><svg class="ch" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label||'Distribution')}"><line class="ax" x1="${pad}" x2="${W-pad}" y1="${H-24}" y2="${H-24}"/>
    ${items.map((d,i)=>{const h=Math.max(d.p>0?2:0,d.p/mx*bh),x=pad+i*bw+2,y=H-24-h,w=bw-4,r=Math.min(4,h/2,w/2);
      const path=h>0?`M${_f(x)},${H-24}V${_f(y+r)}Q${_f(x)},${_f(y)} ${_f(x+r)},${_f(y)}H${_f(x+w-r)}Q${_f(x+w)},${_f(y)} ${_f(x+w)},${_f(y+r)}V${H-24}Z`:'';
      return `${path?`<path class="${d.cls||'bar-n'}" d="${path}" data-tip="${esc((d.tip||d.x)+': '+pc(d.p))}"${d.stat?` data-stat="${esc(d.stat)}"`:''}/>`:''}${d.p>=.03?`<text x="${_f(x+w/2)}" y="${_f(y-5)}" text-anchor="middle">${pc(d.p)}</text>`:''}<text class="${d.em?'ink':''}" x="${_f(x+w/2)}" y="${H-8}" text-anchor="middle">${esc(String(d.x))}</text>`}).join('')}</svg>${o.legend||''}</div>`};
// two (or three) normal curves on one axis: [{m,s,name,cls}]; o.fmt; o.rev when lower is better
CH.normals=(ds,o={})=>{const W=560,H=140,pad=16,lo=Math.min(...ds.map(d=>d.m-3*d.s)),hi=Math.max(...ds.map(d=>d.m+3*d.s)),X=v=>pad+(v-lo)/((hi-lo)||1)*(W-2*pad);
  const pk=Math.max(...ds.map(d=>1/(d.s||1e-9))),Y=v=>H-24-v/pk*(H-40),fmt=o.fmt||(v=>v.toFixed(1));
  const curve=d=>{const pts=[];for(let k=0;k<=80;k++){const v=lo+(hi-lo)*k/80,y=Math.exp(-.5*((v-d.m)/(d.s||1e-9))**2)/(d.s||1e-9);pts.push(`${_f(X(v))},${_f(Y(y))}`)}return pts};
  const tk=niceTicks(lo,hi,5).filter(v=>v>=lo&&v<=hi);
  return `<div class="chwrap"><svg class="ch" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label||'Projected range')}"><line class="ax" x1="${pad}" x2="${W-pad}" y1="${H-24}" y2="${H-24}"/>
    ${tk.map(v=>`<text x="${_f(X(v))}" y="${H-8}" text-anchor="middle">${esc(fmt(v))}</text>`).join('')}
    ${ds.map(d=>{const p=curve(d);return `<polygon class="area ${d.cls}" points="${_f(X(lo))},${H-24} ${p.join(' ')} ${_f(X(hi))},${H-24}" data-tip="${esc(d.name+': most likely '+fmt(d.m)+', usually '+fmt(d.m-d.s)+' to '+fmt(d.m+d.s))}"/><line class="${d.cls}" x1="${_f(X(d.m))}" x2="${_f(X(d.m))}" y1="${H-24}" y2="${_f(Y(1/(d.s||1e-9)))}" stroke-width="2"/>`}).join('')}</svg>
    <div class="legend">${ds.map(d=>`<span><i class="${d.cls}"></i>${esc(d.name)} ${esc(fmt(d.m))}</span>`).join('')}${o.rev?'<span>lower is better</span>':''}</div></div>`};
// lines over a shared x axis: series [{name,cls,pts:[[x,y],...]}]; o.xl(x) label, o.fmt(y), o.y0/o.y1 fixed range
CH.line=(series,o={})=>{const W=600,H=o.h||170,pl=36,pr=12,pt=10,pb=24,all=series.flatMap(s=>s.pts);if(!all.length)return '<div class="empty">No data.</div>';
  const xs=all.map(p=>p[0]),ys=all.map(p=>p[1]),x0=Math.min(...xs),x1=Math.max(...xs),y0=o.y0??Math.min(...ys),y1=o.y1??Math.max(...ys);
  const X=x=>pl+(x-x0)/((x1-x0)||1)*(W-pl-pr),Y=y=>pt+(1-(y-y0)/((y1-y0)||1))*(H-pt-pb),fmt=o.fmt||(v=>String(_f(v))),xl=o.xl||(x=>x);
  const yt=niceTicks(y0,y1,4).filter(v=>v>=y0-1e-9&&v<=y1+1e-9),xt=[...new Set(xs)].sort((a,b)=>a-b),step=Math.ceil(xt.length/10);
  return `<div class="chwrap"><svg class="ch" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label||'Trend')}">
    ${yt.map(v=>`<line class="gr" x1="${pl}" x2="${W-pr}" y1="${_f(Y(v))}" y2="${_f(Y(v))}"/><text x="${pl-6}" y="${_f(Y(v)+4)}" text-anchor="end">${esc(fmt(v))}</text>`).join('')}
    ${o.ref!=null?`<line class="md" x1="${pl}" x2="${W-pr}" y1="${_f(Y(o.ref))}" y2="${_f(Y(o.ref))}"/>`:''}
    ${xt.filter((_,i)=>i%step===0).map(x=>`<text x="${_f(X(x))}" y="${H-6}" text-anchor="middle">${esc(String(xl(x)))}</text>`).join('')}
    ${series.map(s=>`<polyline class="ln ${s.cls}" points="${s.pts.map(p=>_f(X(p[0]))+','+_f(Y(p[1]))).join(' ')}"/>`+s.pts.map(p=>`<circle class="${s.cls}" cx="${_f(X(p[0]))}" cy="${_f(Y(p[1]))}" r="3.5" stroke="var(--panel)" stroke-width="1.5" data-tip="${esc(s.name+' · '+xl(p[0])+': '+fmt(p[1]))}"${p[2]?` data-stat="${esc(p[2])}"`:''}/>`).join('')).join('')}</svg>
    ${series.length>1?`<div class="legend">${series.map(s=>`<span><i class="${s.cls}"></i>${esc(s.name)}</span>`).join('')}</div>`:''}</div>`};
// scatter: points [{x,y,label,hi,me,stat,cls}]; o.xl/o.yl axis titles, o.fx/o.fy formatters, o.ref(x) optional reference curve, o.rx reverse x
CH.scatter=(pts,o={})=>{const W=600,H=o.h||300,pl=40,pr=14,pt=12,pb=34;if(!pts.length)return '<div class="empty">No data.</div>';
  const xs=pts.map(p=>p.x),ys=pts.map(p=>p.y),x0=o.x0??Math.min(...xs),x1=o.x1??Math.max(...xs),y0=o.y0??Math.min(...ys),y1=o.y1??Math.max(...ys);
  const X=x=>pl+(o.rx?1-(x-x0)/((x1-x0)||1):(x-x0)/((x1-x0)||1))*(W-pl-pr),Y=y=>pt+(1-(y-y0)/((y1-y0)||1))*(H-pt-pb),fx=o.fx||(v=>String(_f(v))),fy=o.fy||(v=>String(_f(v)));
  const yt=niceTicks(y0,y1,4).filter(v=>v>=y0-1e-9&&v<=y1+1e-9),xt=niceTicks(x0,x1,6).filter(v=>v>=x0-1e-9&&v<=x1+1e-9);
  let ref='';if(o.ref){const q=[];for(let k=0;k<=40;k++){const x=x0+(x1-x0)*k/40,y=o.ref(x);if(y>=y0&&y<=y1)q.push(_f(X(x))+','+_f(Y(y)))}ref=`<polyline class="md" fill="none" points="${q.join(' ')}"/>`}
  const order=[...pts].sort((a,b)=>(a.hi?1:0)-(b.hi?1:0)||(a.me?1:0)-(b.me?1:0));
  return `<div class="chwrap"><svg class="ch" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label||'Scatter')}">
    ${yt.map(v=>`<line class="gr" x1="${pl}" x2="${W-pr}" y1="${_f(Y(v))}" y2="${_f(Y(v))}"/><text x="${pl-6}" y="${_f(Y(v)+4)}" text-anchor="end">${esc(fy(v))}</text>`).join('')}
    ${xt.map(v=>`<text x="${_f(X(v))}" y="${H-pb+16}" text-anchor="middle">${esc(fx(v))}</text>`).join('')}
    <line class="ax" x1="${pl}" x2="${W-pr}" y1="${H-pb}" y2="${H-pb}"/>${ref}
    ${order.map(p=>`<circle class="dot ${p.hi?'hi':p.me?'me':''} ${p.cls||''}" cx="${_f(X(p.x))}" cy="${_f(Y(p.y))}" r="${p.hi?6:4.5}" data-tip="${esc(p.tip||p.label)}"${p.stat?` data-stat="${esc(p.stat)}"`:''}/>`).join('')}
    ${o.xl?`<text x="${_f((pl+W-pr)/2)}" y="${H-2}" text-anchor="middle">${esc(o.xl)}</text>`:''}${o.yl?`<text x="${pl}" y="${pt-2}" text-anchor="start">${esc(o.yl)}</text>`:''}</svg></div>`};
// sequential background for heat tables (0..1): one hue, light to dark, ink text stays readable
CH.seq=t=>`background:color-mix(in srgb,var(--s2) ${Math.round(6+Math.max(0,Math.min(1,t||0))*60)}%,var(--panel))`;

/* ---------- render ---------- */
const VIEWS={home:vHome,matchup:vMatchup,league:vLeague,stats:vStats,players:vPlayers,waivers:vWaivers,trades:vTrades,team:vTeam};
function renderChrome(){
  const active=S.tab==='team'?(S.team===ME?'home':'league'):S.tab;
  const dot=k=>k==='matchup'&&LIVEW&&LIVEW===curWeek?'<span class="ldot" title="Live scores this week"></span>':'';
  document.getElementById('tabs').innerHTML=TABS.map(([k,l])=>`<button type="button" role="tab" data-go="${k}" aria-selected="${k===active}">${l}${dot(k)}</button>`).join('');
  document.getElementById('bottom').innerHTML=TABS.map(([k,l])=>`<button type="button" data-go="${k}" ${k===active?'aria-current="page"':''}>${icon(k)}<span>${l}${dot(k)}</span></button>`).join('');
  document.getElementById('punts').innerHTML=CATS.map(c=>`<button type="button" class="chip" data-punt="${c.k}" aria-pressed="${S.punt.has(c.k)}" title="${c.n}: your team ranks #${tm(ME).catRank[c.k]}">${c.l} <small>#${tm(ME).catRank[c.k]}</small></button>`).join('');
  document.querySelectorAll('#mode button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===S.mode));
  const pl=[...S.punt].map(k=>CATS.find(c=>c.k===k).l);
  document.getElementById('buildlbl').textContent=(pl.length?'Punt '+pl.join(', '):'No punts')+(S.mode==='season'?' · season':'');
  document.getElementById('buildbtn').dataset.on=String(pl.length>0||S.mode==='season');
  const tray=document.getElementById('tray');
  document.body.classList.toggle('has-tray',S.cmp.length>0);
  if(S.cmp.length){tray.hidden=false;tray.innerHTML=`<span class="tn">Compare</span>${S.cmp.map(n=>`<span class="tn">${esc(n)} <button type="button" class="x" data-cmpx="${esc(n)}" aria-label="Remove ${esc(n)}">✕</button></span>`).join('')}<button type="button" class="btn sm" data-open-cmp ${S.cmp.length<2?'disabled':''}>Compare ${S.cmp.length}</button>`}else tray.hidden=true}
function render(keepScroll){
  renderChrome();hideTip();
  const keep=!keepScroll?[]:[...document.querySelectorAll('#view [data-keep]')].map(e=>[e.dataset.keep,e.scrollTop,e.scrollLeft]);
  const v=document.getElementById('view');v.innerHTML=VIEWS[S.tab]();pruneStats(v);
  keep.forEach(([k,t,l])=>{const e=v.querySelector(`[data-keep="${k}"]`);if(e){e.scrollTop=t;e.scrollLeft=l}});
  if(S.sheet)renderSheet();
}
// a number whose breakdown isn't part of this build (its module is missing) stays plain text instead of opening "No breakdown"
function pruneStats(root){root.querySelectorAll('[data-stat]').forEach(el=>{if(DRILL[el.getAttribute('data-stat').split('|')[0]])return;
  if(el.tagName==='BUTTON'&&el.classList.contains('sx')){const s=document.createElement('span');s.innerHTML=el.innerHTML;el.replaceWith(s)}
  else{el.removeAttribute('data-stat');if(el.tagName!=='BUTTON'&&el.getAttribute('tabindex')==='0')el.removeAttribute('tabindex')}})}
function renderSheet(){const sh=document.getElementById('sheet'),sc=document.getElementById('scrim');
  if(!S.sheet){sh.hidden=true;sc.hidden=true;document.body.style.overflow='';return}
  const top=S.stack[S.stack.length-1],prev=S.stack[S.stack.length-2];
  const body=S.sheet==='player'?sheetPlayer(S.sheetName):S.sheet==='stat'?sheetStat(S.sheetName):sheetCompare();
  if(top&&!top.t)top.t=S.sheet==='player'?S.sheetName:S.sheet==='compare'?'Compare':'';
  const nav=prev?`<div class="sheet-nav"><button type="button" class="btn sm ghost" data-back>${icon('back')}Back</button><span class="note">to ${esc(prev.t||'previous')}</span></div>`:'';
  sh.innerHTML=nav+body;pruneStats(sh);sh.hidden=false;sc.hidden=false;document.body.style.overflow='hidden'}
let lastFocus=null;
// the sheet keeps a stack, so a drill-down opened from inside the sheet can go back to where it came from
function openSheet(kind,name){if(!S.sheet){lastFocus=document.activeElement;S.stack=[]}
  const top=S.stack[S.stack.length-1],a=name||null;
  if(!(top&&top.k===kind&&top.a===a))S.stack.push({k:kind,a});
  if(S.stack.length>15)S.stack.splice(0,S.stack.length-15);
  S.sheet=kind;S.sheetName=a;renderSheet();const sh=document.getElementById('sheet');sh.scrollTop=0;const b=sh.querySelector('[data-close]');if(b)b.focus()}
function sheetBack(){S.stack.pop();const t=S.stack[S.stack.length-1];if(!t){closeSheet();return}
  S.sheet=t.k;S.sheetName=t.a;renderSheet();const sh=document.getElementById('sheet');sh.scrollTop=0;const b=sh.querySelector('[data-back],[data-close]');if(b)b.focus()}
function closeSheet(){S.sheet=null;S.stack=[];renderSheet();if(lastFocus&&document.contains(lastFocus))lastFocus.focus()}
const openStat=d=>openSheet('stat',d);
function go(tab,opts={}){S.tab=tab;if(tab==='team'&&opts.team!=null)S.team=opts.team;if(tab==='stats'&&opts.hub){S.hub=opts.hub;store.set('hub',S.hub)}
  const tok=tab==='team'?'team-'+S.team:tab==='stats'&&S.hub?'stats-'+S.hub:tab;try{history.replaceState(null,'','#'+tok)}catch(e){}
  render();if(!opts.keep)window.scrollTo({top:0})}
let toastT=null;function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2600)}
function scrollToId(id){const el=document.getElementById(id);if(el)el.scrollIntoView({block:'start'})}

/* ---------- search ---------- */
let SR=[],SRi=-1;
function searchResults(q){q=norm(q);if(!q)return [];
  const ps=M.all.filter(p=>norm(p.name).includes(q)).sort((a,b)=>(norm(a.name).startsWith(q)?0:1)-(norm(b.name).startsWith(q)?0:1)||b.tv-a.tv).slice(0,8);
  const ts=M.teams.filter(t=>norm(t.name+' '+t.mgr+' '+t.abbr).includes(q)).slice(0,4);
  const cm=CMDS.map((c,i)=>[c,i]).filter(([c])=>norm(c.label+' '+(c.kw||'')).includes(q)).slice(0,5);
  return [...cm.map(([c,i])=>({k:'cmd',id:i,html:`<span><b>${esc(c.label)}</b><small>${esc(c.sub||'')}</small></span><em>${esc(c.tag||'Go')}</em>`})),...ts.map(t=>({k:'team',id:t.id,html:`<span><b>${esc(t.name)}</b><small>${esc(t.mgr)} · power rank #${t.pr}</small></span><em>Team</em>`})),...ps.map(p=>({k:'player',id:p.name,html:`<span><b>${esc(p.name)}</b>${pills(p)}<small>${p.team?esc(teamById[p.team].name):'Free agent'} · ${p.nba} · ${p.pos}</small></span><em>${p.tv.toFixed(0)}</em>`}))]}
function drawSearch(){const box=document.getElementById('sresults'),inp=document.getElementById('sq');
  if(!SR.length){box.hidden=!inp.value.trim();box.innerHTML=inp.value.trim()?'<div class="res-h">No matches</div>':'';inp.setAttribute('aria-expanded',String(!box.hidden));return}
  box.hidden=false;inp.setAttribute('aria-expanded','true');box.innerHTML=SR.map((r,i)=>`<button type="button" class="res" role="option" data-res="${i}" aria-selected="${i===SRi}">${r.html}</button>`).join('')}
function pickResult(i){const r=SR[i];if(!r)return;const inp=document.getElementById('sq');inp.value='';SR=[];SRi=-1;drawSearch();document.getElementById('bar').classList.remove('searching');
  if(r.k==='cmd'){try{CMDS[r.id].act()}catch(e){console.error(e)}return}
  if(r.k==='team')go('team',{team:r.id});else openSheet('player',r.id)}

/* ---------- events ---------- */
const SEGKEY={lg:'lg',tr:'tr',pv:'pView',pp:'pPool',wm:'wMode',hub:'hub'};
document.addEventListener('click',e=>{
  const el=e.target;
  if(el.closest('[data-close]')||el.id==='scrim'){closeSheet();return}
  if(el.closest('[data-back]')){sheetBack();return}
  const pop=document.getElementById('buildpop');
  if(!pop.hidden&&!el.closest('#buildpop')&&!el.closest('#buildbtn')){pop.hidden=true;document.getElementById('buildbtn').setAttribute('aria-expanded','false')}
  if(!el.closest('#searchbox')){const b=document.getElementById('sresults');if(!b.hidden){b.hidden=true;document.getElementById('sq').setAttribute('aria-expanded','false')}}
  if(el.closest('#buildbtn')){pop.hidden=!pop.hidden;document.getElementById('buildbtn').setAttribute('aria-expanded',String(!pop.hidden));return}
  if(el.closest('#build-done')){pop.hidden=true;document.getElementById('buildbtn').setAttribute('aria-expanded','false');return}
  if(el.closest('#build-reset')){S.punt.clear();store.set('punt',[]);recompute();render();return}
  if(el.closest('#search-toggle')){const bar=document.getElementById('bar');bar.classList.toggle('searching');if(bar.classList.contains('searching'))document.getElementById('sq').focus();return}
  if(el.closest('#brand')){go('home');return}
  if(el.matches('input.cmp,input.tr-pick')||(el.closest('label.pick')&&!el.closest('[data-stat]')))return;
  // act on the innermost actionable element, so a name link inside a clickable row opens the name, not the row
  const a=el.closest('[data-stat],[data-set],[data-res],[data-punt],#mode button,[data-seg],th[data-sort],.tchip,[data-watch],[data-cmpadd],[data-open-cmp],[data-cmpx],[data-balance],[data-addtrade],[data-trade],[data-want],[data-go],[data-player],[data-team],[data-wkteam],[data-week]');
  if(!a){}
  else if(a.matches('[data-stat]')){hideTip();openStat(a.dataset.stat);return}
  else if(a.matches('[data-set]')){const t=a.dataset.set,i=t.indexOf('=');S.x[t.slice(0,i)]=t.slice(i+1);store.set('x',S.x);render(true);return}
  else if(a.matches('[data-res]')){pickResult(+a.dataset.res);return}
  else if(a.matches('[data-punt]')){const k=a.dataset.punt;S.punt.has(k)?S.punt.delete(k):S.punt.add(k);store.set('punt',[...S.punt]);S.target=null;recompute();render();return}
  else if(a.matches('#mode button')){S.mode=a.dataset.v;store.set('mode',S.mode);recompute();render();return}
  else if(a.matches('[data-seg]')){const key=SEGKEY[a.dataset.seg];S[key]=a.dataset.v;store.set(key,S[key]);if(key==='hub'){try{history.replaceState(null,'','#stats-'+S.hub)}catch(e){}}render();return}
  else if(a.matches('th[data-sort]')){const v=a.dataset.view,k=a.dataset.sort,[ck,cd]=S.sort[v];S.sort[v]=[k,ck===k?(cd==='desc'?'asc':'desc'):(ASC_KEYS.includes(k)?'asc':'desc')];render();return}
  else if(a.matches('.tchip')){const k=a.dataset.k,t=new Set(targetsFor());t.has(k)?t.delete(k):t.add(k);S.target=[...t];render(true);return}
  else if(a.matches('[data-watch]')){const n=a.dataset.watch;S.watch.has(n)?S.watch.delete(n):S.watch.add(n);store.set('watch',[...S.watch]);toast(S.watch.has(n)?`${n} added to your watchlist`:`${n} removed from your watchlist`);render(true);return}
  else if(a.matches('[data-cmpadd]')){const n=a.dataset.cmpadd;if(!S.cmp.includes(n)){if(S.cmp.length>=4)S.cmp.shift();S.cmp.push(n)}if(S.cmp.length>=2)openSheet('compare');else{toast(`${n} added. Pick one more to compare.`);render(true)}return}
  else if(a.matches('[data-open-cmp]')){openSheet('compare');return}
  else if(a.matches('[data-cmpx]')){S.cmp=S.cmp.filter(n=>n!==a.dataset.cmpx);render(true);return}
  else if(a.matches('[data-balance]')){const arr=a.dataset.balance==='give'?S.give:S.get;if(!arr.includes(a.dataset.name))arr.push(a.dataset.name);const y=window.scrollY;render(true);window.scrollTo({top:y});return}
  else if(a.matches('[data-addtrade]')){const n=a.dataset.addtrade,tid=+a.dataset.pteam;
    if(a.dataset.partner){S.tA=ME;S.tB=+a.dataset.partner;S.give=[];S.get=[]}
    if(tid===S.tA){if(!S.give.includes(n))S.give.push(n)}else if(tid===S.tB){if(!S.get.includes(n))S.get.push(n)}else if(tid===ME){S.tA=ME;if(!S.give.includes(n))S.give.push(n)}else{S.tB=tid;S.get=[n]}
    S.tr='machine';closeSheet();go('trades');setTimeout(()=>scrollToId('tr-verdict'),0);return}
  else if(a.matches('[data-trade]')){const t=JSON.parse(a.dataset.trade);S.tA=ME;S.tB=t.p;S.give=t.g;S.get=t.r;S.tr='machine';closeSheet();go('trades');setTimeout(()=>scrollToId('tr-verdict'),0);return}
  else if(a.matches('[data-want]')){S.want=a.dataset.want;S.tr='target';closeSheet();go('trades');return}
  else if(a.matches('[data-go]')){const d=a.dataset;
    if(d.week)S.week=+d.week;if(d.wkteam)S.wkTeam=+d.wkteam;if(d.lg)S.lg=d.lg;if(d.wmode)S.wMode=d.wmode;if(d.partner){S.tA=ME;S.tB=+d.partner;S.give=[];S.get=[];S.tr='machine'}
    closeSheet();go(d.go);return}
  else if(a.matches('[data-player]')){openSheet('player',a.dataset.player);return}
  else if(a.matches('[data-team]')){closeSheet();go('team',{team:+a.dataset.team});return}
  else if(a.matches('[data-wkteam]')){S.wkTeam=+a.dataset.wkteam;if(a.dataset.week)S.week=+a.dataset.week;render();window.scrollTo({top:0});return}
  else if(a.matches('[data-week]')){S.week=+a.dataset.week;render();window.scrollTo({top:0});return}
  if(el.closest('#tr-swap')){[S.tA,S.tB]=[S.tB,S.tA];[S.give,S.get]=[S.get,S.give];render();return}
  if(el.closest('#tr-clear')){S.give=[];S.get=[];render();return}
  if(el.closest('#ros-parse')){const txt=document.getElementById('ros-text').value,r=parseRanks(txt),n=Object.keys(r).length,msg=document.getElementById('ros-msg'),prev=document.getElementById('ros-prev');
    if(!n){msg.textContent='No player names from this league were found in that text. Paste the full table, names included.';prev.innerHTML='';ROS_PENDING=null;return}
    ROS_PENDING={src:'FantasyPros rest-of-season rankings',at:new Date().toISOString(),ranks:r};
    const top=Object.entries(r).sort((a,b)=>a[1]-b[1]).slice(0,8).map(([k,v])=>{const p=M.all.find(x=>norm(x.name)===k);return `${v}. ${esc(p?p.name:k)}`});
    msg.textContent=`Matched ${n} players.`;prev.innerHTML=`<p class="note">First matches: ${top.join(', ')}.</p><div class="filters"><button type="button" class="btn" id="ros-save">Use these rankings</button></div>`;return}
  if(el.closest('#ros-save')){if(ROS_PENDING)saveRos(ROS_PENDING);return}
  if(el.closest('#ros-clear')){clearRos();return}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){hideTip();if(S.sheet){closeSheet();return}const pop=document.getElementById('buildpop');if(!pop.hidden){pop.hidden=true;document.getElementById('buildbtn').focus();return}
    const box=document.getElementById('sresults');if(!box.hidden){box.hidden=true;return}}
  const inSq=e.target.id==='sq';
  if(inSq&&SR.length&&(e.key==='ArrowDown'||e.key==='ArrowUp')){e.preventDefault();SRi=(SRi+(e.key==='ArrowDown'?1:-1)+SR.length)%SR.length;drawSearch();return}
  if(inSq&&e.key==='Enter'){e.preventDefault();pickResult(SRi>=0?SRi:0);return}
  if(e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)){e.preventDefault();const bar=document.getElementById('bar');bar.classList.add('searching');document.getElementById('sq').focus();return}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('tr[tabindex],li[tabindex],[data-stat][tabindex]:not(button)')){e.preventDefault();e.target.click()}
  if(e.key==='Tab'&&S.sheet){const f=[...document.getElementById('sheet').querySelectorAll('button,select,input,a,[tabindex]')].filter(x=>!x.disabled);if(!f.length)return;
    if(e.shiftKey&&document.activeElement===f[0]){e.preventDefault();f[f.length-1].focus()}else if(!e.shiftKey&&document.activeElement===f[f.length-1]){e.preventDefault();f[0].focus()}}
});
document.addEventListener('change',e=>{const t=e.target,id=t.id;
  if(t.dataset&&t.dataset.setk){S.x[t.dataset.setk]=t.type==='checkbox'?(t.checked?'1':''):t.value;store.set('x',S.x);render(true);return}
  if(t.matches('input.cmp')){const n=t.dataset.name;if(t.checked){if(!S.cmp.includes(n)){if(S.cmp.length>=4){S.cmp.shift();toast('Comparing up to four players; dropped the first one')}S.cmp.push(n)}}else S.cmp=S.cmp.filter(x=>x!==n);render(true);return}
  if(t.matches('.tr-pick')){const arr=t.dataset.side==='give'?S.give:S.get,n=t.value;if(t.checked){if(!arr.includes(n))arr.push(n)}else arr.splice(arr.indexOf(n),1);const y=window.scrollY;render(true);window.scrollTo({top:y});return}
  const set={'f-team':v=>S.pTeam=v,'f-pos':v=>S.pPos=v,'f-tsel':v=>{S.team=+v;try{history.replaceState(null,'','#team-'+v)}catch(e){}},'wk-team':v=>S.wkTeam=+v,'wk-week':v=>S.week=+v,'tr-partner':v=>{S.tB=+v;S.get=[]},'tr-a':v=>{S.tA=+v;S.give=[]},
    'tv-team':v=>S.tvTeam=v,'tv-pos':v=>S.tvPos=v,'tr-shape':v=>S.tShape=v,'tr-filter':v=>S.tFilter=v,'w-drop':v=>S.drop=v,'w-pos':v=>S.wPos=v,'w-week':v=>S.wWeek=+v,'want':v=>S.want=v||null};
  if(set[id]){set[id](t.value);render()}
});
document.addEventListener('input',e=>{
  if(e.target.id==='f-q'){S.q=e.target.value;const pos=e.target.selectionStart;render();const q=document.getElementById('f-q');if(q){q.focus();q.setSelectionRange(pos,pos)}}
  if(e.target.id==='sq'){SR=searchResults(e.target.value);SRi=SR.length?0:-1;drawSearch()}
});
document.getElementById('sq').addEventListener('focus',e=>{if(e.target.value){SR=searchResults(e.target.value);drawSearch()}});
window.addEventListener('hashchange',()=>{readHash();render()});
function readHash(){const h=location.hash.slice(1);if(/^team-\d+$/.test(h)&&teamById[+h.slice(5)]){S.tab='team';S.team=+h.slice(5)}else if(/^stats-[a-z0-9]+$/.test(h)){S.tab='stats';S.hub=h.slice(6)}else if(VIEWS[h]&&h!=='team')S.tab=h}

/* ---------- shared rankings store ---------- */
async function saveRos(r){ROS=r;applyRos();recompute();render();
  if(DB&&CAN_SHARE!==false){try{await DB.doc('shared/ros').set(r);ROS_SHARED=true;store.set('ros',null);toast('Rankings saved for everyone who opens the board');render();return}catch(e){CAN_SHARE=false}}
  store.set('ros',r);ROS_SHARED=false;toast('Rankings saved on this device');render()}
async function clearRos(){if(DB&&ROS_SHARED){try{await DB.doc('shared/ros').delete()}catch(e){toast('Only the board\'s owner can remove the shared rankings');return}}
  store.set('ros',null);ROS=null;ROS_SHARED=false;applyRos();recompute();render();toast('Rankings removed')}
</script>
<script>/* module: d_matchup.js */
/* d_matchup.js: matchup drill-downs and the Matchup lab panel.
   mw|a|b|week        one week between two teams: categories-won distribution, each category's chance (links to mc), player-games
                      and benched games, the day-by-day lineups, the swing categories and the move that helps most
   mc|a|b|week|cat    one category in that week: both projected totals and their ranges, who supplies it on each side,
                      games, how much more of the stat makes it lean either way, and how much the week hinges on it
   PANELS.matchup     "Matchup lab" at the end of the Matchup tab: distribution, category chances, swing categories, best move
   Registers only; everything computes at render time. Shared helpers on window.LAB: matchPivots, swingCats, leanNeed, bestStream. */
(()=>{
const LAB=window.LAB=window.LAB||{};
const NS='dmu';

/* ---------- small helpers ---------- */
const TM=x=>{const n=parseInt(x,10);return Number.isFinite(n)?(tm(n)||null):null};
const WK=x=>{const n=parseInt(x,10);return Number.isFinite(n)&&PER[n]&&PER[n].length?n:null};
const CT=k=>catOf(String(k||'').toLowerCase())||null;
const LEAN=.62,SW_LO=.38,SW_HI=.62;                       // the same bands as the core's Lock / Lean / Swing tags
const invPhi=q=>{let lo=-8,hi=8;for(let i=0;i<64;i++){const m=(lo+hi)/2;if(Phi(m)<q)lo=m;else hi=m}return (lo+hi)/2};
const Z_LEAN=invPhi(LEAN);
const sum=a=>a.reduce((s,x)=>s+x,0);
const ab=t=>esc(t.abbr), tn=t=>esc(t.name);
const poss=s=>/s$/i.test(s)?s+"'":s+"'s";                          // possessive: Fears' / NUT's
const pab=t=>esc(poss(t.abbr)), ptn=t=>esc(poss(t.name));
const nb=s=>esc(s).replace(/ /g,'&nbsp;');
const wkShort=w=>w>REGW?'P'+(w-REGW):'W'+w;
const short=n=>{const w=String(n).split(' ');return w.length>1?w[0].charAt(0)+'. '+w.slice(1).join(' '):String(n)};
let DF=null;const DL=new Map();                                                   // one date formatter, labels cached by day
const dlab=sp=>{if(!DL.has(sp)){DF=DF||new Intl.DateTimeFormat('en-US',{weekday:'short',month:'numeric',day:'numeric',timeZone:TZ});DL.set(sp,DF.format(spDate(sp)).replace(',',''))}return DL.get(sp)};
const isOver=w=>!!(PER[w]&&PER[w][PER[w].length-1]<todaySP);
const meets=(a,b)=>DATA.schedule.filter(m=>(m[1]===a&&m[2]===b)||(m[1]===b&&m[2]===a)).map(m=>m[0]).sort((x,y)=>x-y);
const isReal=(a,b,w)=>w<=REGW&&oppOf(a,w)===b;
const fmtT=(c,v)=>v==null||!isFinite(v)?'–':c.pct?f3(v):String(Math.round(v));                      // a week total, short
// two week totals that would print the same get one more digit, so a near tie still shows who leads
const pairT=(c,a,b,f=fmtT)=>{const x=f(c,a),y=f(c,b);if(x!==y)return [x,y];const g=v=>c.pct?v.toFixed(4).replace(/^0/,''):v.toFixed(1);return [g(a),g(b)]};
const fmt1=(c,v)=>v==null||!isFinite(v)?'–':c.pct?f3(v):Math.abs(v)>=100?v.toFixed(0):v.toFixed(1);
const amt=x=>x>=10?String(Math.ceil(x-1e-9)):(Math.ceil(x*10-1e-9)/10).toFixed(1);                   // rounded up, so it really gets there
const MADE={fg:'made field goals',ft:'made free throws',tp:'made threes'};
const pts=x=>{const n=Math.round(x*100);return `${sg(n)} point${Math.abs(n)===1?'':'s'}`};
const plural=(n,w)=>`${n} ${n===1?w:w.endsWith('y')?w.slice(0,-1)+'ies':w+'s'}`;
const legend=items=>`<div class="legend">${items.map(([cls,l])=>`<span><i class="${cls}"></i>${l}</span>`).join('')}</div>`;
// series colours: Matt's team is always blue (s2); otherwise the first team is orange (s1). bA/bB are the matching bar classes
const PAL=(a,b)=>a===ME?{A:'s2',B:'s1',bA:'me',bB:'hi'}:{A:'s1',B:'s2',bA:'hi',bB:'me'};
const ghost=(attrs,l)=>`<button type="button" class="btn sm ghost" ${attrs}>${l}</button>`;

const CSS=`.dmu-cards{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:8px}
.dmu-card{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:3px;min-width:0;background:var(--panel);text-align:left;font:inherit;color:inherit}
button.dmu-card{cursor:pointer}button.dmu-card:hover{background:var(--soft)}
.dmu-card .dmu-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.dmu-card .dmu-top span{font:600 .95rem var(--display);letter-spacing:.05em;text-transform:uppercase}
.dmu-card b{font:700 1.5rem/1.05 var(--display);font-variant-numeric:tabular-nums}
.dmu-card small{color:var(--muted);font-size:.76rem;line-height:1.35}
.dmu-card .pill{margin:0}
.dmu-pm{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center}
.dmu-meter{position:relative;height:6px;border-radius:3px;background:var(--neg-2);overflow:hidden}
.dmu-meter i{position:absolute;left:0;top:0;bottom:0;background:var(--pos-3)}
.dmu-meter::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--panel)}
.dmu-lever{border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;background:var(--raise);min-width:0}
.dmu-lever>b{font:600 1.15rem/1.2 var(--display);text-transform:uppercase;letter-spacing:.03em}
.dmu-lever p{margin:0;font-size:.86rem}
.dmu-lever .note{font-size:.8rem}
.dmu-shift{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;font:700 1.6rem/1 var(--display);font-variant-numeric:tabular-nums}
.dmu-shift i{font-style:normal;color:var(--muted);font-size:1.1rem}
.dmu-shift small{font:600 .8rem var(--body);color:var(--pos-fg)}
.dmu-shift small.down{color:var(--neg-fg)}
.dmu-alt{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;font-size:.8rem;color:var(--muted)}
.dmu-alt b{color:var(--ink);font-weight:600}
.dmu-days th,.dmu-days td{padding:6px 8px}
.dmu-days td small.sit{display:inline;margin-left:4px}
.dmu-days tr.tot td{border-top:1px solid var(--line);font-weight:600}
.dmu-who{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.dmu-who>div{display:grid;grid-template-columns:5.2em minmax(0,1fr);gap:8px;font-size:.82rem;align-items:baseline}
.dmu-who>div.past{opacity:.55}.dmu-who>div.idle{display:block}
.dmu-who b{font-weight:600;white-space:nowrap}
.dmu-who small{display:block;color:var(--muted);font-size:.75rem}
.dmu-flip{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.dmu-flip li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:baseline;font-size:.86rem}
.dmu-flip li>span:first-child{font:700 1.05rem var(--display);min-width:3.6em;font-variant-numeric:tabular-nums}
.dmu-sum{font-size:.84rem;margin:0}
.dmu-sum b{font-weight:600}
.dmu-links{display:flex;flex-wrap:wrap;gap:8px}
.dmu-wide .hb-r{grid-template-columns:minmax(0,15em) minmax(0,1fr) 4.6em}
@media (max-width:560px){.dmu-cards{grid-template-columns:1fr}.dmu-wide .hb-r{grid-template-columns:minmax(0,1fr) 4.2em}.dmu-who>div{grid-template-columns:1fr;gap:0}.dmu-days th,.dmu-days td{padding:6px 6px}}`;
const css=()=>addCSS('dmu-css',CSS);

/* ---------- the model behind the drills ---------- */
// chance of each number of categories won, treating the categories as independent (same as the core's matchOdds)
const convo=ps=>{let d=[1];ps.forEach(q=>{const nd=new Array(d.length+1).fill(0);d.forEach((x,i)=>{nd[i]+=x*(1-q);nd[i+1]+=x*q});d=nd});return d};
// for each category: the chance the other eight split 4-4 (so this one settles the week), and the week's chance if it is won or lost.
// The week's chance is exactly ifLost + p * piv, so piv is also how much one point of category chance is worth in week chance.
function pivots(o){return memo(`${NS}|piv|${o.a}|${o.b}|${o.w}`,()=>{const out={};
  CATS.forEach(c=>{const d=convo(CATS.filter(x=>x!==c).map(x=>o.p[x.k]));out[c.k]={piv:d[4],ifWon:sum(d.slice(4)),ifLost:sum(d.slice(5))}});return out})}
const spread=(o,k)=>Math.sqrt(o.da[k].v+o.db[k].v);
// how much more of the stat one side ('a' or 'b') needs for the category to lean its way (62%), everything else held fixed.
// Counting stats in the stat's own units (fewer, for TO); percentages also as made shots on the same attempts.
function leanNeed(o,c,side){const s=spread(o,c.k);if(!(s>1e-9))return null;let d=o.da[c.k].m-o.db[c.k].m;if(c.neg)d=-d;if(side==='b')d=-d;
  const need=Z_LEAN*s-d,own=side==='a'?o.da[c.k]:o.db[c.k];
  if(need<=0)return {need:0,already:true};
  if(c.pct&&!(own.A>0))return null;
  return c.pct?{need,makes:need*own.A}:{need}}
function swings(o){const pv=pivots(o);return CATS.map(c=>({c,p:o.p[c.k],...pv[c.k]})).sort((x,y)=>Math.abs(x.p-.5)-Math.abs(y.p-.5)||y.piv-x.piv)}
// each player's expected starts in the projected week and what they add in one category
function contrib(id,P,w,c){const n=new Map();P.days.forEach(d=>d.st.forEach(x=>n.set(x,(n.get(x)||0)+1)));
  return rosterOf(id).filter(p=>p.pg&&n.get(p.name)).map(p=>{const days=n.get(p.name),g=days*avail(p,w);
    if(c.pct){const mk=g*p.pg[c.pct[0]],at=g*p.pg[c.pct[1]];return {p,days,g,mk,at,v:mk-M.lg[c.k]*at}}
    return {p,days,g,v:g*p.pg[c.k]}})}
// the free agent who adds the most win chance for team a in this week (a's lowest-value player makes room)
const dropFor=id=>{if(id===ME)return dropDefault(ME);const q=rosterOf(id).filter(p=>p.nvPG!=null).sort((x,y)=>x.nvPG-y.nvPG)[0];return q?q.name:'none'};
function streams(a,b,w){return memo(`${NS}|str|${a}|${b}|${w}`,()=>{const drop=dropFor(a);
  if(a===ME&&isReal(a,b,w))return {drop,rows:weekAdds(w,drop)};            // the core's own streamer run, already cached
  const base=mp(a,b,w),L=base.live,from=L?L.fromSP:0,kept=rosterOf(a).filter(p=>p.name!==drop);
  const rows=M.fas.filter(f=>f.pg).map(f=>{const games=gamesIn(f.nba,w,from);if(!games)return {f,games,dExp:0,dWin:0,gain:[],o:base};   // no games, no change
    const P=weekProj([...kept,f],w,from),p=catProbs(catDist(P,L&&L.ca),base.db),o=matchOdds(p);
    const gain=CATS.map(c=>[c,p[c.k]-base.p[c.k]]).filter(x=>x[1]>.02).sort((x,y)=>y[1]-x[1]);
    return {f,games,dExp:o.exp-base.exp,dWin:o.win-base.win,gain,o}});
  return {drop,rows}})}
const rankedStreams=(a,b,w)=>{const s=streams(a,b,w);return {drop:s.drop,rows:[...s.rows].sort((x,y)=>y.dWin-x.dWin||y.dExp-x.dExp)}};

/* ---------- shared pieces ---------- */
function distChart(o,A,B){const d=o.dist,mode=d.indexOf(Math.max(...d));
  const items=d.map((p,i)=>({x:i,p,cls:i>=5?'bar-w':'bar-l',em:i===mode,tip:`${A.abbr} ${i}–${9-i} ${B.abbr}`}));
  return CH.dist(items,{label:`Categories ${A.name} wins, 0 to 9`,legend:legend([['w',`${ab(A)} wins the week (5 or more)`],['l',`${ab(B)} wins it`]])})}
function distLine(o,A){const d=o.dist,mode=d.indexOf(Math.max(...d)),big=sum(d.slice(6)),small=sum(d.slice(0,4));
  return `<p class="dmu-sum">Most likely <b>${mode}-${9-mode}</b> (${pc(d[mode])}). ${ab(A)} takes 6 or more categories ${pc(big)} of the time and 3 or fewer ${pc(small)}.</p>`}
function catChart(o,A,B){const rows=CATS.map(c=>({c,p:o.p[c.k]})).sort((x,y)=>y.p-x.p).map(({c,p})=>{const [x,y]=pairT(c,o.da[c.k].m,o.db[c.k].m),[x1,y1]=pairT(c,o.da[c.k].m,o.db[c.k].m,fmt1);return {
    label:`<b>${c.l}</b><small>${x}–${y}</small>`,v:p-.5,txt:pc(p),cls:p>=.5?'pos':'neg',
    stat:`mc|${A.id}|${B.id}|${o.w}|${c.k}`,tip:`${c.n}: ${A.abbr} ${x1} vs ${B.abbr} ${y1} projected · ${pc(p)} for ${A.abbr} (${tag(p)[0]})`}});
  return CH.hbars(rows,{center:true,max:.5,label:`Chance ${A.name} wins each category`})+legend([['pos',`Leans ${ab(A)}`],['neg',`Leans ${ab(B)}`]])}
// one line on what flips a category: the amount a side needs for a 62% lean
function needTxt(o,c,side,T){const n=leanNeed(o,c,side);if(!n)return '';if(n.already)return `Already leans ${ab(T)}`;
  if(c.pct)return `${ab(T)} needs ${amt(n.makes)} more ${MADE[c.k]} on the same attempts to make it lean their way`;
  return `${ab(T)} needs ${c.neg?amt(n.need)+' fewer TO':'+'+amt(n.need)+' '+c.l} to make it lean their way`}
function swingCards(o,A,B,n){const sw=swings(o),band=sw.filter(x=>x.p>=SW_LO&&x.p<SW_HI),list=(band.length>=2?band:sw).slice(0,n);
  const cards=list.map(x=>{const c=x.c,[tg,cl]=tag(x.p);
    return `<button type="button" class="dmu-card" data-stat="${esc(`mc|${A.id}|${B.id}|${o.w}|${c.k}`)}" data-tip="${esc(`${c.n}: open both ranges and who supplies it`)}">
      <span class="dmu-top"><span>${c.l}</span><span class="pill ${cl}">${tg}</span></span>
      <span class="dmu-pm"><b>${pc(x.p)}</b><span class="dmu-meter" aria-hidden="true"><i style="width:${pc(x.p)}"></i></span></span>
      <small>${pab(A)} chance. Settles the week ${pc(x.piv)} of the time.</small>
      <small>${x.p<LEAN?needTxt(o,c,'a',A):needTxt(o,c,'b',B)}.</small></button>`});
  const head=band.length>=2?`${plural(band.length,'category')} of 9 ${band.length===1?'is':'are'} between 38% and 62%.${band.length>n?` The ${n} closest:`:''}`:
    `No real toss-ups${band.length?' beyond '+band[0].c.l:''} this week. The closest:`;
  return `<p class="note">${head}</p><div class="dmu-cards" style="--n:${cards.length}">${cards.join('')}</div>`}
// the best move for team A this week; with b ME (or not), a line on the other side's best answer
function lever(a,b,w,o,opts={}){const A=tm(a),B=tm(b);
  if(isOver(w)&&!o.live)return `<div class="dmu-lever"><b>Week over</b><p class="note">${weekName(w)} has finished, so there is nothing left to change.</p></div>`;
  const R=rankedStreams(a,b,w),r=R.rows[0],alt=R.rows.slice(1,3).filter(x=>x.dWin>=.005),dropTxt=R.drop&&R.drop!=='none'?`, drop ${esc(R.drop)}`:'';
  let h;
  if(!r||r.dWin<.005){const s=swings(o)[0],n=s.p<LEAN?needTxt(o,s.c,'a',A):'';
    h=`<div class="dmu-lever"><b>No pickup helps</b><p>None of the ${M.fas.filter(f=>f.pg).length} free agents raises ${pab(A)} chance this week by even half a point. The closest category is ${sbtn(`mc|${a}|${b}|${w}|${s.c.k}`,s.c.l)} at ${pc(s.p)}.${n?` ${n}.`:''}</p></div>`}
  else{const gains=r.gain.slice(0,2).map(g=>g[0].l),down=r.dWin<0;
    h=`<div class="dmu-lever">
      <b>Add ${esc(r.f.name)}${dropTxt}</b>
      <div class="dmu-shift" data-tip="${esc(`${poss(A.abbr)} chance to win ${weekName(w)}, before and after`)}">${pc(o.win)}<i>→</i>${pc(r.o.win)}<small class="${down?'down':''}">${pts(r.dWin)}</small></div>
      <p>${pab(A)} chance to win the week with ${esc(r.f.name)} (${esc(r.f.nba)} · ${r.f.pos}), who has ${plural(r.games,'game')}${o.live?' left':''} this week. ${f2(r.dExp)} expected categories${gains.length?`, mostly ${gains.join(' and ')}`:''}.</p>
      ${alt.length?`<ul class="dmu-alt">${alt.map(x=>`<li>Next: <b>${esc(x.f.name)}</b> ${pts(x.dWin)} · ${plural(x.games,'game')}</li>`).join('')}</ul>`:''}
      <div class="dmu-links">${ghost(`data-player="${esc(r.f.name)}"`,'Player profile')}${gains.length?ghost(`data-stat="${esc(`pc|${r.f.name}|${r.gain[0][0].k}`)}"`,`${gains[0]} breakdown`):''}</div></div>`}
  if(opts.answer){const Q=rankedStreams(b,a,w).rows[0],yb=b===ME,their=yb?'your':pab(B),aCh=a===ME?'your chance':`${pab(A)} chance`;
    if(Q&&Q.dWin>=.01&&r&&r.dWin>=.005&&Q.f.name===r.f.name)h+=`<p class="note">${esc(Q.f.name)} is also ${their} best answer (${pts(Q.dWin)} for ${yb?'you':'them'}), so whoever adds them first keeps them from the other side.</p>`;
    else if(Q&&Q.dWin>=.01)h+=`<p class="note">${yb?'Your':pab(B)} best answer: ${esc(Q.f.name)} would move ${yb?'your':'their'} chance by ${pts(Q.dWin)}, to ${pc(Q.o.win)}, so ${aCh} would drop to about ${pc(1-Q.o.win)}.</p>`;
    else h+=`<p class="note">${yb?'No free agent moves your chance':`${ab(B)} has no free agent who moves their chance`} by a full point.</p>`}
  return h}
const ctxNote=(A,B,w,o)=>{const out=[];
  if(w>REGW)out.push(`Fantasy playoffs. This pairing is assumed: who actually meets depends on the final standings.`);
  else if(!isReal(A.id,B.id,w)){const m=meets(A.id,B.id);out.push(`${tn(A)} and ${tn(B)} don't meet in ${weekName(w)}, so this is a what-if on that week's NBA schedule.${m.length?` They meet in ${m.length>1?'weeks':'week'} ${m.map(x=>sbtn(`mw|${A.id}|${B.id}|${x}`,String(x))).join(', ')}.`:''}`)}
  if(isOver(w)&&!o.live)out.push(`This week has finished. The board keeps no box scores for past weeks, so these numbers are the projection from today's rosters.`);
  else if(o.live)out.push(`Under way: ESPN's live totals so far, plus projections for the games left.`);
  return out.length?`<p class="note">${out.join(' ')}</p>`:''};

/* ---------- mw: the week ---------- */
DRILL.mw=(a,b,wk)=>{const A=TM(a),B=TM(b),w=WK(wk);if(!A||!B||A.id===B.id||w==null)return null;css();
  const o=mp(A.id,B.id,w),L=o.live,d=o.dist,mode=d.indexOf(Math.max(...d)),[tg,tcl]=tag(o.win);
  const fA=projTeam(A.id,w,0),fB=projTeam(B.id,w,0);
  const facts=[
    L?fact('Live now',`${L.score[0]}-${L.score[1]}${L.score[2]?'-'+L.score[2]:''}`,'categories, as of the last update'):'',
    fact('Win chance',pc(o.win),`${tg} · needs 5 of the 9 categories`),
    fact(L?'Projected final':'Expected categories',`${o.exp.toFixed(1)}–${o.expL.toFixed(1)}`,'the average split'),
    L?'':fact('Most likely result',`${mode}-${9-mode}`,`${pc(d[mode])} chance`),
    fact('Player-games',`${o.Pa.games.toFixed(0)} v ${o.Pb.games.toFixed(0)}`,`expected starts${L?' left':''} · ${ab(A)} ${o.Pa.bench} benched, ${ab(B)} ${o.Pb.bench}`,`tgm|${A.id}`)].join('');
  const days=fA.days.map((x,i)=>[x,fB.days[i]]).filter(([x,y])=>x&&y);
  // consecutive days when neither side has a game collapse into one row (the All-Star break, for one)
  const runs=ds=>{const out=[];ds.forEach(d=>{const idle=!d[0].playing&&!d[1].playing,l=out[out.length-1];if(idle&&l&&l.idle){l.last=d[0];l.n++}else out.push(idle?{idle,first:d[0],last:d[0],n:1}:{d})});return out};
  const tipNames=(id,dd)=>{const R=rosterOf(id).filter(p=>p.pg).sort((x,y)=>y.prio-x.prio),st=R.filter(p=>dd.st.has(p.name)).map(p=>short(p.name)),bn=R.filter(p=>plays(p.nba,dd.sp)&&avail(p,w)>0&&!dd.st.has(p.name)).map(p=>short(p.name));
    return `${teamById[id].abbr} ${dlab(dd.sp)}: ${st.length?st.join(', '):'nobody'}${bn.length?' · bench: '+bn.join(', '):''}`};
  const cell=(id,dd)=>`<td class="num ${dd.sp<todaySP?'past':''} ${dd.playing>dd.started?'warnc':''}" data-tip="${esc(tipNames(id,dd))}">${dd.started}${dd.playing>dd.started?`<small class="sit">+${dd.playing-dd.started} sit</small>`:''}</td>`;
  const rem=days.filter(([x])=>!L||x.sp>=L.fromSP),sA=sum(rem.map(x=>x[0].started)),sB=sum(rem.map(x=>x[1].started)),eA=L?o.Pa.games:fA.games,eB=L?o.Pb.games:fB.games;
  const dayTbl=`<div class="scroll"><table class="dmu-days"><thead><tr><th class="l" scope="col">Day</th><th scope="col">${ab(A)}</th><th scope="col">${ab(B)}</th><th scope="col">Edge</th></tr></thead><tbody>
    ${runs(days).map(g=>{if(g.idle)return `<tr><td class="l ${g.last.sp<todaySP?'past':''}" colspan="4">${g.n>1?`${dlab(g.first.sp)} – ${dlab(g.last.sp)}`:dlab(g.first.sp)} <span class="note" style="display:inline">· no NBA games${g.n>1?` for ${g.n} days`:''}</span></td></tr>`;const [x,y]=g.d,df=x.started-y.started;return `<tr><td class="l ${x.sp<todaySP?'past':''}">${dlab(x.sp)}</td>${cell(A.id,x)}${cell(B.id,y)}<td class="num ${df>0?'up':df<0?'down':''}">${df?`+${Math.abs(df)} ${df>0?ab(A):ab(B)}`:'even'}</td></tr>`}).join('')}
    <tr class="tot"><td class="l">${L?'Starts left':'Starts'}</td><td class="num">${sA}</td><td class="num">${sB}</td><td class="num ${sA>sB?'up':sA<sB?'down':''}">${sA===sB?'even':`+${Math.abs(sA-sB)} ${sA>sB?ab(A):ab(B)}`}</td></tr>
    <tr><td class="l" data-tip="Starts scaled by how often each player is expected to play">${L?'Expected left':'Expected'}</td><td class="num">${eA.toFixed(1)}</td><td class="num">${eB.toFixed(1)}</td><td class="num ${eA-eB>=.05?'up':eB-eA>=.05?'down':''}">${Math.abs(eA-eB)<.05?'even':`+${Math.abs(eA-eB).toFixed(1)} ${eA>eB?ab(A):ab(B)}`}</td></tr></tbody></table></div>`;
  const who=(T,ds)=>{const R=rosterOf(T.id).filter(p=>p.pg).sort((x,y)=>y.prio-x.prio),groups=[];
    ds.forEach(dd=>{const l=groups[groups.length-1];if(!dd.playing&&l&&l.idle){l.last=dd;l.n++}else groups.push(dd.playing?{dd}:{idle:true,first:dd,last:dd,n:1})});
    return `<details class="inline"><summary>${tn(T)}: who starts each day</summary><div class="dmu-who">${groups.map(g=>{
      if(g.idle)return `<div class="idle ${g.last.sp<todaySP?'past':''}"><b>${g.n>1?`${dlab(g.first.sp)} – ${dlab(g.last.sp)}`:dlab(g.first.sp)}</b> <span class="note" style="display:inline">· no games</span></div>`;
      const dd=g.dd,st=R.filter(p=>dd.st.has(p.name)),bn=R.filter(p=>plays(p.nba,dd.sp)&&avail(p,w)>0&&!dd.st.has(p.name)),out=R.filter(p=>plays(p.nba,dd.sp)&&avail(p,w)===0);
      return `<div class="${dd.sp<todaySP?'past':''}"><b>${dlab(dd.sp)}</b><span>${st.length?st.map(p=>esc(short(p.name))).join(', '):'Nobody can start'}${bn.length?`<small>Bench (no open slot): ${bn.map(p=>esc(short(p.name))).join(', ')}</small>`:''}${out.length?`<small>Listed out: ${out.map(p=>esc(short(p.name))).join(', ')}</small>`:''}</span></div>`}).join('')}</div></details>`};
  const links=[isReal(A.id,B.id,w)?ghost(`data-go="matchup" data-week="${w}" data-wkteam="${A.id}"`,'Open in the Matchup tab'):'',
    ghost(`data-stat="${esc(`h2h|${A.id}|${B.id}`)}"`,'Roster v roster'),ghost(`data-stat="${esc(`tpo|${A.id}`)}"`,`${ab(A)} playoff odds`),ghost(`data-stat="${esc(`tpo|${B.id}`)}"`,`${ab(B)} playoff odds`)].join('');
  const h=`${ctxNote(A,B,w,o)}<div class="facts">${facts}</div>
    ${drillSec('Categories won',`How often ${ab(A)} ends the week with each number of category wins, out of 9.`,distChart(o,A,B)+distLine(o,A))}
    ${drillSec('Chance in each category',`${pab(A)} chance, sorted from safest to longest shot, with both projected totals. Tap one for the full picture.`,catChart(o,A,B))}
    ${drillSec('Swing categories','Where the week is likely to be decided.',swingCards(o,A,B,3))}
    ${drillSec(A.id===ME?'Your best move':'Best move',`The free agent who adds the most win chance for ${ab(A)}, run through this week's real schedule.`,lever(A.id,B.id,w,o,{answer:A.id===ME||B.id===ME}))}
    ${drillSec('Games, day by day',`Starts each day after the 11-slot daily limit. Orange days have more players with games than open slots. Expected scales the starts by how often each player is expected to play.${days.some(([x])=>x.sp<todaySP)?' Faded days are already played.':''}`,dayTbl+who(A,days.map(x=>x[0]))+who(B,days.map(x=>x[1])))}
    <div class="dmu-links">${links}</div>
    ${how([`Each team's week is built day by day from the real NBA schedule. On each day the players with games fill the 11 starting slots (PG, SG, SF, PF, C, G, F and four UTIL) in order of value, so extra games on a crowded day sit on the bench, as in ESPN's daily lineups. Each player's numbers are scaled by how often they are expected to play. Injuries count only in the near term: a player listed out sits the current week once it starts (before the season, their week-1 games are cut by 60%) and loses half their games the week after; a day-to-day player loses a quarter of the current week once it starts. Later weeks assume everyone is back.`,
      `Each category's chance compares the two projected totals with how much that category usually swings in a week: steals, blocks and the shooting percentages swing the most, points the least. The categories-won chart treats the nine categories as independent, which is an assumption (some move together, such as points and field goal attempts), and adds up every way they can split. Ties within a category (possible in small counts such as blocks) are not modelled.`,
      `"Settles the week" is the chance the other eight categories split 4-4, so this one decides it. The week's chance moves by exactly that much for each point of chance in the category. "Lean" means 62%, the board's Lean threshold; the amount needed holds everything else fixed, including the other team.`,
      `The best move adds each free agent in place of ${esc(dropFor(A.id))} (${A.id===ME?'your lowest-value player':'their lowest-value player across all nine categories'}), assumes the pickup is made before their first game of the week, and reruns the week. Other teams' moves are not modelled.`])}`;
  return {eyebrow:`${tn(A)} vs ${tn(B)}`,title:`${weekName(w)}: ${pc(o.win)} to win`,sub:`${weekLabel(w)} · ${o.exp.toFixed(1)}–${o.expL.toFixed(1)} ${L?'projected final':'expected'} categories`,back:`${A.abbr} v ${B.abbr} · ${wkShort(w)}`,html:h}};

/* ---------- mc: one category in that week ---------- */
DRILL.mc=(a,b,wk,k)=>{const A=TM(a),B=TM(b),w=WK(wk),c=CT(k);if(!A||!B||A.id===B.id||w==null||!c)return null;css();
  const o=mp(A.id,B.id,w),L=o.live,p=o.p[c.k],[tg,tcl]=tag(p),pv=pivots(o)[c.k],ga=o.da[c.k],gb=o.db[c.k],sa=Math.sqrt(ga.v),sb=Math.sqrt(gb.v),pal=PAL(A.id,B.id);
  // two percentages that would print the same get a fourth decimal, so a near tie still shows who leads
  const [tA,tB]=pairT(c,ga.m,gb.m,fmt1);
  const now=(cur)=>{if(!L||!cur)return null;const v=cur[c.k]??(c.pct?(cur[c.pct[1]]?cur[c.pct[0]]/cur[c.pct[1]]:null):null);return v};
  const nA=now(L&&L.ca),nB=now(L&&L.cb);
  const swingTxt=v=>c.pct?`±${f3(v)}`:`±${v>=10?v.toFixed(0):v.toFixed(1)}`;
  const projFact=(T,g,s,nw,stat)=>fact(`${esc(T.abbr)} projected`,T===A?tA:tB,`${c.pct?`on ${Math.round(g.A||0)} attempts · `:''}usually ${swingTxt(s)}${nw!=null?` · ${fmt1(c,nw)} so far`:''}`,stat);
  const facts=[fact(`Chance ${esc(A.abbr)} wins it`,pc(p),tg),projFact(A,ga,sa,nA,`tc|${A.id}|${c.k}`),projFact(B,gb,sb,nB,`tc|${B.id}|${c.k}`),
    fact('Settles the week',pc(pv.piv),`Week chance ${pc(pv.ifWon)} if ${esc(A.abbr)} wins it, ${pc(pv.ifLost)} if not (${pc(o.win)} now)`,`mw|${A.id}|${B.id}|${w}`)].join('');
  const fmtN=v=>c.pct?f3(v):Math.abs(v)>=100?v.toFixed(0):(Math.round(v*10)/10).toString();
  const range=sa>1e-6&&sb>1e-6?CH.normals([{m:ga.m,s:sa,name:A.abbr,cls:pal.A},{m:gb.m,s:sb,name:B.abbr,cls:pal.B}],{fmt:fmtN,rev:!!c.neg,label:`${c.n}: projected range for each team`}):'<div class="empty">One side has no games projected, so there is no range to draw.</div>';
  const flips=`<ul class="dmu-flip">${[['a',A],['b',B]].map(([s,T])=>{const n=leanNeed(o,c,s);if(!n)return '';
    const head=n.already?'Done':c.pct?`+${amt(n.makes)}`:c.neg?`−${amt(n.need)}`:`+${amt(n.need)}`;
    let body=n.already?`Already leans ${ab(T)} (${pc(s==='a'?p:1-p)}).`:c.pct?`${MADE[c.k]} for ${ab(T)} on the same attempts (${f3((s==='a'?ga:gb).m)} to ${f3((s==='a'?ga:gb).m+n.need)}) would make it lean their way.`
      :`${c.neg?'fewer turnovers':c.l} for ${ab(T)} this week would make it lean their way.`;
    if(!n.already&&!c.pct&&!c.neg){const top=rosterOf(T.id).filter(q=>q.pg&&q.pg[c.k]>0).sort((x,y)=>y.pg[c.k]-x.pg[c.k])[0];
      if(top)body+=` That is about ${(n.need/top.pg[c.k]).toFixed(1)} extra games of ${esc(top.name)} (${top.pg[c.k].toFixed(1)} a game).`}
    return `<li><span>${head}</span><span>${body}</span></li>`}).join('')}</ul>`;
  const CA=contrib(A.id,o.Pa,w,c),CB=contrib(B.id,o.Pb,w,c);
  const rowsOf=(list,bc)=>{const s=[...list].sort((x,y)=>Math.abs(y.v)-Math.abs(x.v)),top=s.slice(0,6),rest=s.slice(6);
    const rows=top.map(x=>{const per=c.pct?`${f3(x.at?x.mk/x.at:null)} on ${(x.at/Math.max(x.g,1e-9)).toFixed(1)} a game`:`${x.p.pg[c.k].toFixed(1)} a game`;
      return {label:`${esc(x.p.name)}<small>${x.g.toFixed(1)} starts</small>`,v:x.v,txt:c.pct?f1(x.v):x.v.toFixed(1),cls:c.pct?(x.v>=0?'pos':'neg'):bc,stat:`pc|${x.p.name}|${c.k}`,
        tip:c.pct?`${x.p.name}: ${x.mk.toFixed(1)} of ${x.at.toFixed(1)} expected (${per}) · ${f1(x.v)} makes against a league-average shooter`:`${x.p.name}: ${per} × ${x.g.toFixed(1)} expected starts = ${x.v.toFixed(1)} ${c.l}`}});
    const rv=sum(rest.map(x=>x.v));rows.rest=rest.length?` The other ${plural(rest.length,'player')} with starts add ${c.pct?f1(rv)+' makes':rv.toFixed(1)+' '+c.l}.`:'';
    return rows};
  const RA=rowsOf(CA,pal.bA),RB=rowsOf(CB,pal.bB),mx=Math.max(1e-9,...[...RA,...RB].map(x=>Math.abs(x.v)));
  const bars=(T,rows)=>rows.length?'<div class="dmu-wide">'+CH.hbars(rows,{max:mx,center:!!c.pct,stack:true,label:`${T.name}: ${c.n} by player`})+'</div>':'<div class="empty">No starts projected.</div>';
  const sideSec=(T,P,list,rows)=>{const tot=c.pct?`${sum(list.map(x=>x.mk)).toFixed(1)} of ${sum(list.map(x=>x.at)).toFixed(1)} ${c.l.replace('%','')}A expected${L?' in the games left':''}`:`${sum(list.map(x=>x.v)).toFixed(1)} ${c.l} expected${L?' in the games left':''}`;
    return drillSec(`${ab(T)}: ${c.neg?'who commits them':c.pct?'who moves it':'who supplies it'}`,`${tot}, from ${P.games.toFixed(1)} expected starts${P.bench?` (${plural(P.bench,'game')} benched)`:''}.${c.pct?' Bars show made shots above or below a league-average shooter on the same attempts.':''}${rows.rest}`,bars(T,rows))};
  const nav=`<div class="chips" role="group" aria-label="Other categories">${CATS.map(x=>`<button type="button" class="chip tchip" data-stat="${esc(`mc|${A.id}|${B.id}|${w}|${x.k}`)}" data-on="${x.k===c.k}" ${x.k===c.k?'aria-current="true"':''}>${x.l} <small>${pc(o.p[x.k])}</small></button>`).join('')}</div>`;
  const links=[ghost(`data-stat="${esc(`mw|${A.id}|${B.id}|${w}`)}"`,'The whole week'),ghost(`data-stat="${esc(`tc|${A.id}|${c.k}`)}"`,`${ab(A)} in ${c.l}`),ghost(`data-stat="${esc(`tc|${B.id}|${c.k}`)}"`,`${ab(B)} in ${c.l}`),ghost(`data-stat="${esc(`lc|${c.k}`)}"`,`${c.l} across the league`)].join('');
  const h=`${ctxNote(A,B,w,o)}<div class="facts">${facts}</div>
    ${drillSec('Range of outcomes',`Each curve is where that team's ${c.n.toLowerCase()} total is likely to land${L?', counting what is already in':''}. The more they overlap, the closer the race.${c.neg?' Lower is better.':''}`,range)}
    ${drillSec('What flips it',`The amount each side needs for a lean (62%), with everything else as projected.`,flips)}
    ${sideSec(A,o.Pa,CA,RA)}${sideSec(B,o.Pb,CB,RB)}
    ${drillSec('Other categories this week','',nav)}
    <div class="dmu-links">${links}</div>
    ${how([`Each total is projected from the real NBA schedule and the daily 11-starter limit: a player's per-game numbers times their expected starts this week (games they start, scaled by how often they are expected to play).${L?' Once the week is under way, ESPN\'s live totals are added to the projection for the games left.':''}`,
      `The curves are normal ranges around each projection. "Usually" means within one typical swing, about two weeks in three. ${c.pct?'A percentage swings less as attempts pile up, so a high-volume team is steadier.':c.k==='pts'?'Points are the steadiest category.':'Smaller counting stats swing more, relative to their size.'} The chance is how often the ${c.neg?'lower':'higher'} total comes out on top, assuming the two teams' weeks are independent.`,
      `"Settles the week" is the chance that the other eight categories split 4-4. The week's chance moves by exactly that much for each point of chance here, so a close category that often settles the week is where an extra pickup pays off most.`,
      `"What flips it" holds both teams' ranges fixed and asks how far one total has to move for a 62% lean.${c.pct?' For a percentage, it counts extra made shots on the same attempts.':''}${!c.pct&&!c.neg?' The game count uses that team\'s best per-game producer in this category.':''}`])}`;
  return {eyebrow:`${tn(A)} vs ${tn(B)} · ${weekName(w)}`,title:`${nb(c.n)}: ${pc(p)}`,sub:`${ab(A)} ${tA} vs ${ab(B)} ${tB} projected · <span class="pill ${tcl}" style="margin:0">${tg}</span>`,back:`${c.l} · ${A.abbr} v ${B.abbr}`,html:h}};

/* ---------- Matchup lab panel on the Matchup tab ---------- */
PANELS.matchup.push((tid,opp,w)=>{const A=tm(+tid),B=tm(+opp);if(!A||!B||A.id===B.id||!PER[w])return '';css();
  const o=mp(A.id,B.id,w);
  return `<section class="panel" id="dmu-lab">${head('Matchup lab',`${weekName(w)} from ${ptn(A)} side: how the nine categories could split, where the week will be decided, and the one move that helps most.`,ghost(`data-stat="${esc(`mw|${A.id}|${B.id}|${w}`)}"`,'Full breakdown'))}
    <div class="cols">${drillSec('Categories won',`How often ${ab(A)} ends the week with each number of category wins.`,distChart(o,A,B)+distLine(o,A))}
      ${drillSec('Chance in each category','Sorted from safest to longest shot. Tap a category for both ranges and who supplies it.',catChart(o,A,B))}</div>
    <div class="cols">${drillSec('Swing categories','Where the week is likely to be decided.',swingCards(o,A,B,3))}
      ${drillSec(A.id===ME?'Your best move':'Best move',`The free agent who adds the most win chance for ${ab(A)} this week.`,lever(A.id,B.id,w,o,{answer:B.id===ME||A.id===ME}))}</div>
    ${how([`The categories-won chart turns the nine category chances into the chance of every final score, treating the categories as independent (an assumption: some move together). Five or more wins takes the week.`,
      `A swing category sits between 38% and 62%. "Settles the week" is the chance the other eight split 4-4, so that category decides it; the week's chance moves by that much for each point of chance in it.`,
      `The best move reruns the week with each free agent in place of ${esc(dropFor(A.id))}, on the days they would actually start, and keeps the one that raises the win chance most. It ranks by win chance, not expected categories, so it can differ from the streamer table above.`])}</section>`});

/* ---------- search commands ---------- */
CMDS.push({label:'My matchup this week',sub:'Every way the categories can split, swing categories and the best move',kw:'matchup week odds swing streamer move categories won distribution',tag:'Drill',
  act:()=>{const w=Math.min(curWeek,REGW),o=oppOf(ME,w);if(o!=null)openStat(`mw|${ME}|${o}|${w}`)}});
CMDS.push({label:'My closest category this week',sub:'The swing category, its range and what flips it',kw:'swing toss-up close category flip lean',tag:'Drill',
  act:()=>{const w=Math.min(curWeek,REGW),o=oppOf(ME,w);if(o==null)return;const s=swings(mp(ME,o,w))[0];openStat(`mc|${ME}|${o}|${w}|${s.c.k}`)}});

/* ---------- shared helpers for other modules (call at render time) ---------- */
LAB.matchPivots=(a,b,w)=>{const A=TM(a),B=TM(b),x=WK(w);return A&&B&&A.id!==B.id&&x!=null?pivots(mp(A.id,B.id,x)):null};
LAB.swingCats=(a,b,w)=>{const A=TM(a),B=TM(b),x=WK(w);return A&&B&&A.id!==B.id&&x!=null?swings(mp(A.id,B.id,x)).map(s=>({k:s.c.k,p:s.p,piv:s.piv,ifWon:s.ifWon,ifLost:s.ifLost})):null};
LAB.leanNeed=(a,b,w,k,side='a')=>{const A=TM(a),B=TM(b),x=WK(w),c=CT(k);return A&&B&&A.id!==B.id&&x!=null&&c?leanNeed(mp(A.id,B.id,x),c,side):null};
LAB.bestStream=(a,b,w)=>{const A=TM(a),B=TM(b),x=WK(w);if(!A||!B||A.id===B.id||x==null)return null;const R=rankedStreams(A.id,B.id,x),r=R.rows[0];
  return r?{name:r.f.name,drop:R.drop,dWin:r.dWin,dExp:r.dExp,games:r.games,win:r.o.win}:null};
})();

</script>
<script>/* module: d_player.js */

window.LAB=window.LAB||{};

`;
function css(){if(document.getElementById('dp-css'))return;const s=document.createElement('style');s.id='dp-css';s.textContent=CSS;document.head.appendChild(s)}

/* ---------- small helpers ---------- */
const r1=x=>Math.round(x*10)/10;
const sd3=x=>x==null||!isFinite(x)?'–':(x>=0?'+':'-')+Math.abs(x).toFixed(3).replace(/^0/,'');
const SHOT={fg:['shots','FGA','field goals'],ft:['free throws','FTA','free throws'],tp:['3-pointers','3PA','3-pointers']};
const MINA={fg:2,ft:1,tp:1};
const VERB={pts:['scores','points'],reb:['grabs','rebounds'],ast:['hands out','assists'],stl:['records','steals'],blk:['blocks','shots'],to:['commits','turnovers']};
const tAbbr=p=>p.team&&teamById[p.team]?teamById[p.team].abbr:'FA';
const tName=p=>p.team&&teamById[p.team]?teamById[p.team].name:'Free agent';
const nbaS=p=>!p.nba||p.nba==='?'?'Unsigned':p.nba;
const subOf=p=>`${esc(tName(p))} · ${esc(nbaS(p))} · ${esc(p.pos)}${pills(p)}`;
const plist=a=>a.length<2?a.join(''):a.slice(0,-1).join(', ')+' and '+a[a.length-1];
const above=(arr,v)=>arr.filter(x=>x>v+1e-12).length;
// share of rostered values a player beats; insiders use the core's pctl (ties half, self excluded)
const beat=(arr,v,inside)=>inside?pctl(arr,v):arr.filter(x=>x<v-1e-12).length/Math.max(1,arr.length);
const pctTxt=s=>Math.round(Math.max(0,Math.min(1,s))*100)+'%';
const pcls=s=>s>=.85?'p3':s>=.65?'p2':s>=.5?'p1':s<=.15?'n3':s<=.35?'n2':'n1';
const descr=(type,...a)=>[type,...a].join('|');
const ptsTxt=d=>{const n=Math.round(d*100);return (n>0?'+':'')+n+(Math.abs(n)===1?' pt':' pts')};
const art=c=>/^(FG|FT|AST)/.test(c.l)?'an':'a';
// raw category value the model ranks on: per game, or impact = (their % - league %) x attempts for percentages
function rawOf(ln,c){if(!ln)return null;if(c.pct){const a=ln[c.pct[1]];return a?(ln[c.pct[0]]/a-M.lg[c.k])*a:0}return ln[c.k]??null}
function zLine(ln,c){const r=rawOf(ln,c);if(r==null||!isFinite(r))return null;const z=(r-M.st[c.k].m)/M.st[c.k].s;return c.neg?-z:z}
const projLabel=p=>p.src&&p.src.startsWith('ESPN')?(p.cur?'Projection (with season)':'ESPN projection'):p.team?'Projection':'2025-26 stats';
const srcTxt=p=>p.team===0?'their 2025-26 per-game stats (free agents are not in ESPN\'s projection feed)':p.src&&p.src.startsWith('ESPN')?'ESPN\'s 2026-27 projection'+(p.cur?', blended with the season so far':''):p.src==='2025-26 actual'?'their 2025-26 per-game stats (no ESPN projection could be read)':'a hand estimate ('+esc(p.src||'no source')+')';
const legend=items=>`<div class="legend">${items.map(([cls,l])=>`<span><i class="${cls}"></i>${l}</span>`).join('')}</div>`;
const actBtn=(d,l)=>`<button type="button" class="btn sm ghost" ${sx(d)}>${l}</button>`;
const noData=(p,what)=>`<div class="empty">No projection or stats for ${esc(p.name)} yet, so there is no ${what} to break down.</div>`;

/* ---------- memoized tables (once per model state) ---------- */
const catTab=k=>memo(NS+'.cat.'+k,()=>{const R=M.players.filter(p=>p.pg),A=M.all.filter(p=>p.pg);
  return {R,A,zr:R.map(p=>p.zpg[k]),za:A.map(p=>p.zpg[k])}});
// value in your build, per game and over a full season (projected games / average games), for every rostered player
const valTab=()=>memo(NS+'.val',()=>{const ks=CATS.filter(c=>!S.punt.has(c.k)).map(c=>c.k),R=M.players.filter(p=>p.pg);
  const pg=q=>q.pg?ks.reduce((s,k)=>s+q.zpg[k],0):null,fs=q=>q.pg?pg(q)*(q.gp||0)/M.avgGp:null;
  return {pg,fs,R,pgArr:R.map(pg),fsArr:R.map(fs),vArr:R.map(q=>q.value)}});
const valRank=p=>p.team>0&&p.rank?p.rank:(p.value==null?null:1+M.players.filter(q=>q.value!=null&&q.value>p.value+1e-12).length);
const tvRank=p=>p.tvRank??(1+M.players.filter(q=>q.tv>p.tv+1e-12).length);
// nearest neighbours in nine-category per-game z space (rostered and free agents)

// this week's matchup for the player's fantasy team with and without them (a free agent is swapped onto your team for your lowest-value player)
const weekSwing=p=>{if(!p.pg)return null;const w=Math.min(curWeek,REGW),tid=p.team>0?p.team:ME,opp=oppOf(tid,w);if(opp==null)return null;

    const alt=p.team>0?ro.filter(q=>q!==p):[...ro.filter(q=>q.name!==drop),p],P=weekProj(alt,w,L?L.fromSP:0),pr=catProbs(catDist(P,L&&L.ca),base.db),o=matchOdds(pr);

/* ---------- pc: one player in one category ---------- */
function shotChart(p,c){const [mk,ak]=c.pct,lg=M.lg[c.k],k=c.k,minA=MINA[k],onR=p.team>0;
  const pool=[...M.players.filter(q=>q.pg),...(onR?[]:[p])].filter(q=>q.pg[ak]>=minA);
  if(pool.length<5)return '';
  const pts=pool.map(q=>{const y=q.pg[mk]/q.pg[ak];return {q,x:q.pg[ak],y,imp:(y-lg)*q.pg[ak]}});
  const W=440,H=262,pl=42,pr=14,pt=18,pb=38,me=pts.find(d=>d.q===p);
  const ys=pts.map(d=>d.y).sort((a,b)=>a-b),qt=f=>ys[Math.round(f*(ys.length-1))];

  const x1=Math.max(...pts.map(d=>d.x))*1.05,X=x=>pl+x/x1*(W-pl-pr),Y=y=>pt+(1-(Math.max(y0,Math.min(y1,y))-y0)/(y1-y0))*(H-pt-pb);
  const yt=CH.ticks(y0,y1,4).filter(v=>v>=y0&&v<=y1),xt=CH.ticks(0,x1,5).filter(v=>v<=x1);
  let iso='';
  if(me&&Math.abs(me.imp)>.02){const I=me.imp,xa=Math.max(.05,I>0?I/(y1-lg):I/(y0-lg)),q=[];
    for(let i=0;i<=60;i++){const x=xa+(x1-xa)*i/60,y=lg+I/x;if(y>=y0-1e-9&&y<=y1+1e-9)q.push(r1(X(x))+','+r1(Y(y)))}
    if(q.length>1){iso=`<polyline class="ln s1 dp-iso" points="${q.join(' ')}" data-tip="${esc(`Every point on this curve has the same impact as ${p.name}: ${f2(I)} makes a game`)}"/>`;
}}
  const ord2=[...pts].sort((a,b)=>(a.q===p)-(b.q===p)||(a.q.team===ME)-(b.q.team===ME));
  const dots=ord2.map(d=>{const hi=d.q===p,cl=hi?'hi':d.q.team===ME?'me':'';
    return `<circle class="dot ${cl}" cx="${r1(X(d.x))}" cy="${r1(Y(d.y))}" r="${hi?6:4}" data-tip="${esc(`${d.q.name} (${tAbbr(d.q)}) · ${f3(d.y)} on ${d.x.toFixed(1)} ${SHOT[k][1]} · impact ${f2(d.imp)}`)}"${hi?'':` ${sx(descr('pc',d.q.name,k))}`}/>`}).join('');
  const clipped=pts.filter(d=>d.y<y0||d.y>y1).length;
  return `<div class="chwrap dp-sc"><svg class="ch" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(c.l+' against attempts for every rostered player')}">
    ${yt.map(v=>`<line class="gr" x1="${pl}" x2="${W-pr}" y1="${r1(Y(v))}" y2="${r1(Y(v))}"/><text x="${pl-6}" y="${r1(Y(v)+4)}" text-anchor="end">${f3(v)}</text>`).join('')}

    ${clipped?`<p class="note dp-note">${clipped} low-volume shooter${clipped>1?'s sit':' sits'} beyond the edge and ${clipped>1?'are':'is'} pinned to it.</p>`:''}</div>`}

function shootSec(p,c,T){const [mk,ak]=c.pct,k=c.k,lg=M.lg[k],m=p.pg[mk],a=p.pg[ak],pct=a?m/a:null,imp=rawOf(p.pg,c),onR=p.team>0,N=T.R.length;

  const rkPct=pct==null||a<minA?null:1+qual.filter(q=>q.pct[k]>pct+1e-12).length,rkAtt=1+T.R.filter(q=>q.pg[ak]>a+1e-12).length,rkImp=1+above(T.zr,p.zpg[k]);
  if(!a)return drillSec('Shooting, and why volume matters','',`<p class="note">They don't attempt ${SHOT[k][0]}, so they add nothing to a team's makes or attempts. ${c.l} is neutral for them: impact 0, which sits near the middle of the league because the average impact is 0 by definition. ${T.R.filter(q=>(q.pg[ak]||0)<MINA[k]).length} of ${N} rostered players take fewer than ${MINA[k]} ${SHOT[k][1]} a game.</p>`);
  const facts=`<div class="facts">${fact('Makes / attempts',`${m.toFixed(1)} / ${a.toFixed(1)}`,`a game · ${ord(rkAtt)} in ${SHOT[k][1]}`)}${fact('Percentage',pct==null?'–':f3(pct),`league ${f3(lg)} (${pct==null?'no attempts':sd3(pct-lg)})`)}${fact('Impact',f2(imp),'makes a game above an average shooter')}${fact('Rank by impact',`#${rkImp}`,`of ${N}${rkPct?` · #${rkPct} of ${qual.length} by % alone`:''}`)}</div>`;

  const tp=M.teams.map(t=>t.line[k]).filter(v=>v!=null&&isFinite(v)).sort((x,y)=>y-x),gap15=tp.length>=5?tp[0]-tp[4]:null;

  else{
    out.push(`A team's ${c.l} is its total makes divided by its total attempts, so every shot counts the same no matter who takes it. That is why the board ranks shooting by <b>impact</b>: (their % − league %) × attempts, the extra makes a game compared with a league-average shooter on the same volume.`);
    if(imp>.03){const cand=qual.filter(q=>q!==p&&q.pct[k]>pct+.005&&(q.pct[k]-lg)*q.pg[ak]<imp-.02).sort((x,y)=>y.pct[k]-x.pct[k])[0];

function linesSec(p,c,T){const k=c.k,L=[[projLabel(p),p.pg,p.gp],['Season so far',p.cur,p.cur&&p.cur.gp],['Last 15 days',p.rec,p.rec&&p.rec.gp],['2025-26',p.last,p.last&&p.last.gp]].filter(x=>x[1]);

function topSec(p,c,T){const k=c.k,top=[...T.A].sort((a,b)=>b.zpg[k]-a.zpg[k]),i=top.indexOf(p),ten=top.slice(0,10);

    return drillSec(title,note,`<div class="scroll"><table class="dp-t"><thead><tr><th scope="col">#</th><th class="l" scope="col">Player</th><th scope="col">${c.l}</th><th scope="col">Impact</th></tr></thead><tbody>${ten.map((q,n)=>row(q,n+1)).join('')}${i>=10?row(p,i+1):''}</tbody></table></div>`)}

function puntSec(p,c,T){const k=c.k,punted=S.punt.has(k),R=T.R.filter(q=>q.value!=null);if(p.value==null)return '';
  const alt=q=>punted?q.value+q.z[k]:q.value-q.z[k],va=alt(p),rkNow=valRank(p),rkAlt=1+R.filter(q=>q!==p&&alt(q)>va+1e-12).length;
